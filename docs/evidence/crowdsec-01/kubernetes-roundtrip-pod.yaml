apiVersion: v1
kind: Pod
metadata:
  name: crowdsec-fix-01-snapshot-verify
  namespace: crowdsec-fix-01-verify
  labels:
    app.kubernetes.io/part-of: crowdsec-fix-01-verify
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: verify
      image: docker.io/crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
      args:
        - >-
          set -eu;
          cd /snapshot;
          sha256sum -c ARCHIVE.SHA256 >/dev/null;
          tar -xzf crs-snapshot.tar.gz -C /crs-data;
          cd /crs-data;
          sha256sum -c SHA256SUMS >/dev/null;
          count="$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)";
          test "$count" -eq 49;
          printf 'PASS: archive=%s files=%s\n'
          "$(sha256sum /snapshot/crs-snapshot.tar.gz | awk '{print $1}')" "$count";
          touch /crs-data/READY;
          sleep 300
      readinessProbe:
        exec:
          command:
            - test
            - -f
            - /crs-data/READY
        periodSeconds: 2
        timeoutSeconds: 1
      resources:
        requests:
          cpu: 1m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      volumeMounts:
        - name: snapshot
          mountPath: /snapshot
          readOnly: true
        - name: crs-data
          mountPath: /crs-data
  volumes:
    - name: snapshot
      configMap:
        name: crowdsec-01-crs-snapshot
    - name: crs-data
      emptyDir: {}
