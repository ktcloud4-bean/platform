# CROWDSEC-01 Docker 격리 호환 검증 전용. Kubernetes에 적용하지 않는다.
global:
  checkNewVersion: false

entryPoints:
  web:
    address: :18080

providers:
  file:
    filename: /etc/traefik/dynamic.yaml

log:
  level: INFO

accessLog: {}

experimental:
  abortOnPluginFailure: false
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1
      hash: 500739fc1600c12a651433b13a81693470cd336dbc7864cb85ee42098c93d884
