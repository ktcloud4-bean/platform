# CROWDSEC-01 Docker 격리 호환 검증 전용. Kubernetes에 적용하지 않는다.
http:
  routers:
    control:
      rule: PathPrefix(`/crowdsec-01/control`)
      entryPoints:
        - web
      service: whoami
    waf:
      rule: PathPrefix(`/crowdsec-01/waf`)
      entryPoints:
        - web
      middlewares:
        - crowdsec-01-appsec
      service: whoami

  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://crowdsec-01-local-backend:8080

  middlewares:
    crowdsec-01-appsec:
      plugin:
        crowdsec:
          enabled: true
          crowdsecMode: appsec
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec-01-local-lapi:8080
          crowdsecLapiKeyFile: /run/secrets/crowdsec-01/bouncer-key
          crowdsecAppsecEnabled: true
          crowdsecAppsecScheme: http
          crowdsecAppsecHost: crowdsec-01-local-appsec:7422
          crowdsecAppsecPath: /
          crowdsecAppsecKeyFile: /run/secrets/crowdsec-01/bouncer-key
          crowdsecAppsecFailureBlock: true
          crowdsecAppsecUnreachableBlock: true
          crowdsecAppsecUnreadableBodyBlock: true
          crowdsecAppsecBodyLimit: 1048576
          remediationStatusCode: 403
          httpTimeoutSeconds: 2
          updateIntervalSeconds: 60
          metricsUpdateIntervalSeconds: 0
          forwardedHeadersTrustedIps: []
          clientTrustedIps: []
