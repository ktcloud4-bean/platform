# 폐기된 CORAZA-01 Docker 격리 재현 전용. Kubernetes에 적용하지 않는다.
http:
  routers:
    waf:
      rule: PathPrefix(`/waf`)
      entryPoints:
        - web
      middlewares:
        - coraza-minimal
      service: whoami

  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://coraza-01-local-backend:8080

  middlewares:
    coraza-minimal:
      plugin:
        coraza:
          includeCRS: true
          directives:
            - SecRuleEngine On
            - SecRule REQUEST_URI "@streq /waf/blocked" "id:1000002,phase:1,log,deny,status:403"
