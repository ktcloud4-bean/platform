# 폐기된 CORAZA-01 Docker 격리 재현 전용. Kubernetes에 적용하지 않는다.
http:
  routers:
    control:
      rule: PathPrefix(`/control`)
      entryPoints:
        - web
      service: whoami
    waf:
      rule: PathPrefix(`/waf`)
      entryPoints:
        - web
      middlewares:
        - coraza-crs
      service: whoami

  services:
    whoami:
      loadBalancer:
        servers:
          - url: http://coraza-01-local-backend:8080

  middlewares:
    coraza-crs:
      plugin:
        coraza:
          includeCRS: true
          directives:
            - Include @coraza.conf-recommended
            - SecRuleEngine On
            - SecRequestBodyAccess On
            - SecResponseBodyAccess Off
            - SecAction "id:900000,phase:1,pass,t:none,nolog,setvar:tx.blocking_paranoia_level=1"
            - SecAction "id:900001,phase:1,pass,t:none,nolog,setvar:tx.detection_paranoia_level=1"
            - SecAction "id:900110,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
            - SecRule REQUEST_URI "@streq /waf/exception" "id:1000001,phase:1,pass,nolog,chain"
            - SecRule REQUEST_HEADERS:User-Agent "@streq masscan" "t:none,ctl:ruleRemoveById=913100"
            - Include @crs-setup.conf.example
            - Include @owasp_crs/*.conf
