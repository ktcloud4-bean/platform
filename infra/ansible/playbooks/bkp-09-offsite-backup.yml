---

- name: BKP-09 controller-side secret and existing offsite input 준비
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    bkp03_secret_dir: >-
      {{ lookup('ansible.builtin.env', 'BKP03_SECRET_DIR') | default(
         lookup('ansible.builtin.env', 'KTC_SECRET_ROOT') | default(lookup('ansible.builtin.env', 'HOME') ~ '/secrets/ktcloud4-bean', true) ~ '/bkp-03', true) }}
    bkp03_offsite_vars_file: >-
      {{ lookup('ansible.builtin.env', 'BKP03_OFFSITE_VARS_FILE') | default(bkp03_secret_dir ~ '/offsite-vars.yml', true) }}
  tasks:
    - name: 저장소 밖 입력 경계 확인
      ansible.builtin.assert:
        that:
          - bkp03_secret_dir is regex('^/')
          - bkp03_offsite_vars_file is regex('^/')
          - not bkp03_secret_dir.startswith(playbook_dir | dirname | dirname)
          - not bkp03_offsite_vars_file.startswith(playbook_dir | dirname | dirname)
        fail_msg: BKP03_SECRET_DIR과 BKP03_OFFSITE_VARS_FILE은 저장소 밖 절대경로여야 한다.

    - name: BKP-03 복구 자격증명 디렉터리 선언
      ansible.builtin.file:
        path: "{{ bkp03_secret_dir }}"
        state: directory
        owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
        mode: "0700"

    - name: 전용 S3 identity 자격증명 조회 또는 생성
      ansible.builtin.set_fact:
        bkp03_offsite_access_key: >-
          {{ lookup('ansible.builtin.password', bkp03_secret_dir ~ '/offsite-reader-s3.access',
                    length=24, chars=['ascii_letters', 'digits']) }}
        bkp03_offsite_secret_key: >-
          {{ lookup('ansible.builtin.password', bkp03_secret_dir ~ '/offsite-reader-s3.secret',
                    length=64, chars=['ascii_letters', 'digits']) }}
      no_log: true

    - name: 복구 자격증명 파일 mode 0600 강제
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ lookup('ansible.builtin.env', 'USER') }}"
        mode: "0600"
      loop:
        - "{{ bkp03_secret_dir }}/offsite-reader-s3.access"
        - "{{ bkp03_secret_dir }}/offsite-reader-s3.secret"
      no_log: true

    - name: BKP-04 AWS 착지점 입력 읽기
      ansible.builtin.include_vars:
        file: "{{ bkp03_offsite_vars_file }}"
        name: bkp03_offsite_inputs
      no_log: true

    - name: BKP-04 착지점 입력의 최소 형식 확인
      ansible.builtin.assert:
        that:
          - bkp03_offsite_inputs.offsite_aws_bucket | default('') | length > 0
          - bkp03_offsite_inputs.offsite_aws_region | default('') | length > 0
          - bkp03_offsite_inputs.offsite_alert_topic_arn | default('') | length > 0
          - bkp03_offsite_inputs.offsite_aws_access_key_id | default('') | length >= 16
          - bkp03_offsite_inputs.offsite_aws_secret_access_key | default('') | length >= 32
        fail_msg: 검증된 BKP-04 AWS bucket, region, alert topic과 전송 identity가 필요하다.
      no_log: true

- name: BKP-09 S3 offsite reader identity 확장 및 4개 버킷 오프사이트 연결 선언
  hosts: object_nodes
  gather_facts: true
  become: true
  vars:
    bkp09_offsite_access_key: "{{ hostvars['localhost'].bkp03_offsite_access_key }}"
    bkp09_offsite_secret_key: "{{ hostvars['localhost'].bkp03_offsite_secret_key }}"
    offsite_aws_region: "{{ hostvars['localhost'].bkp03_offsite_inputs.offsite_aws_region }}"
    offsite_aws_bucket: "{{ hostvars['localhost'].bkp03_offsite_inputs.offsite_aws_bucket }}"
    offsite_alert_topic_arn: "{{ hostvars['localhost'].bkp03_offsite_inputs.offsite_alert_topic_arn }}"
    offsite_aws_access_key_id: "{{ hostvars['localhost'].bkp03_offsite_inputs.offsite_aws_access_key_id }}"
    offsite_aws_secret_access_key: "{{ hostvars['localhost'].bkp03_offsite_inputs.offsite_aws_secret_access_key }}"
    offsite_local_access_key_id: "{{ hostvars['localhost'].bkp03_offsite_access_key }}"
    offsite_local_secret_access_key: "{{ hostvars['localhost'].bkp03_offsite_secret_key }}"
    offsite_source_buckets:
      - bkp-03-postgres
      - bkp-03-vault
      - bkp-01-k3s-datastore
      - bkp-02-velero
  roles:
    - role: bkp09_s3_targets
    - role: seaweedfs_offsite_backup
