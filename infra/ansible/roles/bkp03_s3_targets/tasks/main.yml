---

- name: BKP-03 S3 전제와 전용 identity 입력 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.hostname == 'object-01'
      - bkp03_postgres_bucket != bkp03_vault_bucket
      - bkp03_postgres_identity != bkp03_vault_identity
      - bkp03_postgres_access_key | length >= 16
      - bkp03_postgres_secret_key | length >= 32
      - bkp03_vault_access_key | length >= 16
      - bkp03_vault_secret_key | length >= 32
      - bkp03_offsite_access_key | length >= 16
      - bkp03_offsite_secret_key | length >= 32
      - bkp03_postgres_access_key != bkp03_vault_access_key
      - bkp03_postgres_access_key != bkp03_offsite_access_key
      - bkp03_vault_access_key != bkp03_offsite_access_key
    fail_msg: object-01과 PostgreSQL·Vault·offsite 전용 identity의 분리 입력이 필요하다.
  no_log: true

- name: SeaweedFS S3 구성과 public certificate 현재 상태 확인
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ bkp03_s3_config_path }}"
    - "{{ bkp03_s3_ca_path }}"
    - "{{ bkp03_rclone_path }}"
    - "{{ bkp03_volume_service_path }}"
  register: bkp03_s3_files

- name: SeaweedFS S3 필수 파일 존재 확인
  ansible.builtin.assert:
    that:
      - bkp03_s3_files.results | map(attribute='stat.exists') | min
    fail_msg: S3-01과 BKP-04가 설치한 s3.json, TLS certificate와 rclone이 필요하다.

- name: SeaweedFS 기존 volume 목록과 slot 한도 확인
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      echo 'volume.list' |
      /usr/local/bin/weed shell -master=127.0.0.1:9333 2>/dev/null
    executable: /bin/bash
  register: bkp03_volume_list_before
  changed_when: false
  check_mode: false

- name: SeaweedFS volume unit 읽기
  ansible.builtin.slurp:
    src: "{{ bkp03_volume_service_path }}"
  register: bkp03_volume_unit_raw

- name: 재시작 전 SeaweedFS volume ID 기록
  ansible.builtin.set_fact:
    bkp03_volume_ids_before: >-
      {{ bkp03_volume_list_before.stdout |
         regex_findall('volume Id:([0-9]+),') | map('int') | list }}

- name: 승인된 SeaweedFS volume slot 변경 경계 확인
  ansible.builtin.assert:
    that:
      - >-
        (bkp03_volume_unit_raw.content | b64decode |
         regex_findall('(?m)^  -max=([0-9]+) ') | length) == 1
      - >-
        (bkp03_volume_unit_raw.content | b64decode |
         regex_findall('(?m)^  -max=([0-9]+) ') | first | int)
        in [6, 8, 10, 15, 20, bkp03_required_volume_max_count]
      - bkp03_required_volume_max_count in [10, 30]
    fail_msg: >-
      승인된 object-01 volume max 변경만 허용한다.

- name: SeaweedFS volume slot 한도 선언
  ansible.builtin.lineinfile:
    path: "{{ bkp03_volume_service_path }}"
    regexp: '^  -max=[0-9]+ '
    line: "  -max={{ bkp03_required_volume_max_count }} \\"
  register: bkp03_volume_unit_change

- name: 변경된 SeaweedFS volume service만 재시작
  ansible.builtin.systemd:
    name: seaweedfs-volume.service
    state: restarted
    daemon_reload: true
  when:
    - bkp03_volume_unit_change.changed
    - not ansible_check_mode

- name: SeaweedFS volume service 재연결 대기
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8080
    state: started
    timeout: 30
  when:
    - bkp03_volume_unit_change.changed
    - not ansible_check_mode

- name: SeaweedFS volume service와 slot 한도 재확인
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      systemctl is-active seaweedfs-volume.service
      grep -Fx -- '  -max={{ bkp03_required_volume_max_count }} \' '{{ bkp03_volume_service_path }}'
      echo 'volume.list' | /usr/local/bin/weed shell -master=127.0.0.1:9333 2>/dev/null
    executable: /bin/bash
  register: bkp03_volume_list_after
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: 기존 SeaweedFS volume 보존 확인
  ansible.builtin.assert:
    that:
      - >-
        bkp03_volume_ids_before |
        difference(bkp03_volume_list_after.stdout |
                   regex_findall('volume Id:([0-9]+),') |
                   map('int') | list) | length == 0
      - >-
        bkp03_volume_list_after.stdout |
        regex_findall('Topology.*volume:[0-9]+/' ~
                      (bkp03_required_volume_max_count | string) ~ ' active:') |
        length == 1
    fail_msg: volume service 재시작 전 기존 volume 목록이 모두 보존되어야 한다.
  when: not ansible_check_mode

- name: 기존 static S3 구성 읽기
  ansible.builtin.slurp:
    src: "{{ bkp03_s3_config_path }}"
  register: bkp03_s3_config_raw
  no_log: true

- name: 기존 S3 구성과 BKP-03 최종 identity 계산
  ansible.builtin.set_fact:
    bkp03_s3_current_config: "{{ bkp03_s3_config_raw.content | b64decode | from_json }}"
    bkp03_s3_owned_names:
      - "{{ bkp03_postgres_identity }}"
      - "{{ bkp03_vault_identity }}"
      - "{{ bkp03_offsite_identity }}"
    bkp03_s3_desired_identities:
      - name: "{{ bkp03_postgres_identity }}"
        credentials:
          - accessKey: "{{ bkp03_postgres_access_key }}"
            secretKey: "{{ bkp03_postgres_secret_key }}"
        actions:
          - "Read:{{ bkp03_postgres_bucket }}"
          - "List:{{ bkp03_postgres_bucket }}"
          - "Write:{{ bkp03_postgres_bucket }}"
      - name: "{{ bkp03_vault_identity }}"
        credentials:
          - accessKey: "{{ bkp03_vault_access_key }}"
            secretKey: "{{ bkp03_vault_secret_key }}"
        actions:
          - "Read:{{ bkp03_vault_bucket }}"
          - "List:{{ bkp03_vault_bucket }}"
          - "Write:{{ bkp03_vault_bucket }}"
      - name: "{{ bkp03_offsite_identity }}"
        credentials:
          - accessKey: "{{ bkp03_offsite_access_key }}"
            secretKey: "{{ bkp03_offsite_secret_key }}"
        actions:
          - "Read:{{ bkp03_postgres_bucket }}"
          - "List:{{ bkp03_postgres_bucket }}"
          - "Read:{{ bkp03_vault_bucket }}"
          - "List:{{ bkp03_vault_bucket }}"
          - "Read:bkp-01-k3s-datastore"
          - "List:bkp-01-k3s-datastore"
          - "Read:bkp-02-velero"
          - "List:bkp-02-velero"
  no_log: true

- name: BKP-03 이외 기존 identity 보존 목록 계산
  ansible.builtin.set_fact:
    bkp03_s3_preserved_identities: >-
      {{ bkp03_s3_current_config.identities | default([])
         | rejectattr('name', 'in', bkp03_s3_owned_names) | list }}
  no_log: true

- name: BKP-03 최종 static S3 구성 계산
  ansible.builtin.set_fact:
    bkp03_s3_final_config: >-
      {{ bkp03_s3_current_config
         | combine({'identities': bkp03_s3_preserved_identities + bkp03_s3_desired_identities}) }}
  no_log: true

- name: 현재 bucket 목록 조회
  ansible.builtin.shell:
    cmd: "set -o pipefail; echo 'fs.ls /buckets' | /usr/local/bin/weed shell -filer=127.0.0.1:8888 2>/dev/null"
    executable: /bin/bash
  register: bkp03_bucket_listing
  changed_when: false
  check_mode: false

- name: 생성이 필요한 BKP-03 bucket 계산
  ansible.builtin.set_fact:
    bkp03_missing_buckets: >-
      {{ [bkp03_postgres_bucket, bkp03_vault_bucket]
         | difference(bkp03_bucket_listing.stdout_lines) | list }}

- name: bucket bootstrap용 일회성 identity 계산
  ansible.builtin.set_fact:
    bkp03_bootstrap_access_key: >-
      {{ lookup('ansible.builtin.password', '/dev/null', length=24,
                chars=['ascii_letters', 'digits']) }}
    bkp03_bootstrap_secret_key: >-
      {{ lookup('ansible.builtin.password', '/dev/null', length=64,
                chars=['ascii_letters', 'digits']) }}
  no_log: true
  when: bkp03_missing_buckets | length > 0

- name: BKP-03 bucket bootstrap와 최종 최소권한 수렴
  block:
    - name: 일회성 bucket bootstrap identity를 static config에 추가
      ansible.builtin.copy:
        content: >-
          {{ bkp03_s3_current_config | combine({'identities':
             bkp03_s3_preserved_identities + bkp03_s3_desired_identities + [{
               'name': 'bkp-03-bootstrap',
               'credentials': [{'accessKey': bkp03_bootstrap_access_key,
                                'secretKey': bkp03_bootstrap_secret_key}],
               'actions': ['Admin:' ~ bkp03_postgres_bucket,
                           'Admin:' ~ bkp03_vault_bucket]
             }]}) | to_nice_json }}
        dest: "{{ bkp03_s3_config_path }}"
        owner: seaweedfs
        group: seaweedfs
        mode: "0600"
      no_log: true
      when:
        - bkp03_missing_buckets | length > 0
        - not ansible_check_mode

    - name: bootstrap identity 반영을 위해 S3 gateway만 재시작
      ansible.builtin.systemd:
        name: seaweedfs-s3.service
        state: restarted
      when:
        - bkp03_missing_buckets | length > 0
        - not ansible_check_mode

    - name: S3 API로 전용 bucket 생성
      ansible.builtin.command:
        argv:
          - "{{ bkp03_rclone_path }}"
          - mkdir
          - "bootstrap:{{ item }}"
          - --config
          - /dev/null
          - --ca-cert
          - "{{ bkp03_s3_ca_path }}"
      environment:
        RCLONE_CONFIG_BOOTSTRAP_TYPE: s3
        RCLONE_CONFIG_BOOTSTRAP_PROVIDER: Other
        RCLONE_CONFIG_BOOTSTRAP_ENV_AUTH: "false"
        RCLONE_CONFIG_BOOTSTRAP_ACCESS_KEY_ID: "{{ bkp03_bootstrap_access_key }}"
        RCLONE_CONFIG_BOOTSTRAP_SECRET_ACCESS_KEY: "{{ bkp03_bootstrap_secret_key }}"
        RCLONE_CONFIG_BOOTSTRAP_ENDPOINT: "{{ bkp03_s3_endpoint }}"
        RCLONE_CONFIG_BOOTSTRAP_FORCE_PATH_STYLE: "true"
      loop: "{{ bkp03_missing_buckets }}"
      no_log: true
      when:
        - bkp03_missing_buckets | length > 0
        - not ansible_check_mode
  always:
    - name: 일회성 identity를 제거한 BKP-03 최종 S3 구성 선언
      ansible.builtin.copy:
        content: "{{ bkp03_s3_final_config | to_nice_json }}"
        dest: "{{ bkp03_s3_config_path }}"
        owner: seaweedfs
        group: seaweedfs
        mode: "0600"
      register: bkp03_final_s3_config
      no_log: true
      when: not ansible_check_mode

    - name: postgres-01 전용 S3 source systemd drop-in directory 선언
      ansible.builtin.file:
        path: /etc/systemd/system/seaweedfs-s3.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: postgres-01 전용 S3 source 허용 선언
      ansible.builtin.copy:
        content: |
          [Service]
          IPAddressAllow={{ bkp03_postgres_source_cidr }}
        dest: /etc/systemd/system/seaweedfs-s3.service.d/bkp-03.conf
        owner: root
        group: root
        mode: "0644"
      register: bkp03_s3_source_dropin

    # bucket 생성이 실패해도 always 안에서 final config를 runtime에 반영해
    # 일회성 bootstrap identity가 프로세스 메모리에 남지 않게 한다.
    - name: 최종 최소권한 설정으로 S3 gateway 수렴
      ansible.builtin.systemd:
        name: seaweedfs-s3.service
        state: restarted
        daemon_reload: true
      when:
        - not ansible_check_mode
        - >-
          bkp03_missing_buckets | length > 0 or
          bkp03_final_s3_config.changed | default(false) or
          bkp03_s3_source_dropin.changed | default(false)

- name: 최종 bucket 목록 조회
  ansible.builtin.shell:
    cmd: "set -o pipefail; echo 'fs.ls /buckets' | /usr/local/bin/weed shell -filer=127.0.0.1:8888 2>/dev/null"
    executable: /bin/bash
  register: bkp03_final_bucket_listing
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: BKP-03 전용 bucket 두 개 존재 확인
  ansible.builtin.assert:
    that:
      - bkp03_postgres_bucket in bkp03_final_bucket_listing.stdout_lines
      - bkp03_vault_bucket in bkp03_final_bucket_listing.stdout_lines
    fail_msg: PostgreSQL과 Vault 전용 bucket이 모두 존재해야 한다.
  when: not ansible_check_mode

- name: 전용 identity별 보이는 bucket 조회
  ansible.builtin.command:
    argv:
      - "{{ bkp03_rclone_path }}"
      - lsd
      - "{{ item.remote }}:"
      - --config
      - /dev/null
      - --ca-cert
      - "{{ bkp03_s3_ca_path }}"
  environment: "{{ item.environment }}"
  loop:
    - remote: pgverify
      environment:
        RCLONE_CONFIG_PGVERIFY_TYPE: s3
        RCLONE_CONFIG_PGVERIFY_PROVIDER: Other
        RCLONE_CONFIG_PGVERIFY_ENV_AUTH: "false"
        RCLONE_CONFIG_PGVERIFY_ACCESS_KEY_ID: "{{ bkp03_postgres_access_key }}"
        RCLONE_CONFIG_PGVERIFY_SECRET_ACCESS_KEY: "{{ bkp03_postgres_secret_key }}"
        RCLONE_CONFIG_PGVERIFY_ENDPOINT: "{{ bkp03_s3_endpoint }}"
        RCLONE_CONFIG_PGVERIFY_FORCE_PATH_STYLE: "true"
    - remote: vaultverify
      environment:
        RCLONE_CONFIG_VAULTVERIFY_TYPE: s3
        RCLONE_CONFIG_VAULTVERIFY_PROVIDER: Other
        RCLONE_CONFIG_VAULTVERIFY_ENV_AUTH: "false"
        RCLONE_CONFIG_VAULTVERIFY_ACCESS_KEY_ID: "{{ bkp03_vault_access_key }}"
        RCLONE_CONFIG_VAULTVERIFY_SECRET_ACCESS_KEY: "{{ bkp03_vault_secret_key }}"
        RCLONE_CONFIG_VAULTVERIFY_ENDPOINT: "{{ bkp03_s3_endpoint }}"
        RCLONE_CONFIG_VAULTVERIFY_FORCE_PATH_STYLE: "true"
  register: bkp03_identity_bucket_views
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: 전용 identity 교차 bucket 격리 확인
  ansible.builtin.assert:
    that:
      - bkp03_postgres_bucket in bkp03_identity_bucket_views.results[0].stdout
      - bkp03_vault_bucket not in bkp03_identity_bucket_views.results[0].stdout
      - bkp03_vault_bucket in bkp03_identity_bucket_views.results[1].stdout
      - bkp03_postgres_bucket not in bkp03_identity_bucket_views.results[1].stdout
    fail_msg: PostgreSQL과 Vault S3 identity가 자기 bucket만 볼 수 있어야 한다.
  when: not ansible_check_mode

- name: PostgreSQL identity의 Vault bucket 교차 쓰기 거부 확인
  ansible.builtin.shell:
    cmd: >-
      printf 'denied\n' |
      {{ bkp03_rclone_path }} rcat
      pgdeny:{{ bkp03_vault_bucket }}/bkp03-postgres-cross-write-denied
      --config /dev/null --ca-cert {{ bkp03_s3_ca_path }}
      --retries 1 --low-level-retries 1 --log-level ERROR
    executable: /bin/bash
  environment:
    RCLONE_CONFIG_PGDENY_TYPE: s3
    RCLONE_CONFIG_PGDENY_PROVIDER: Other
    RCLONE_CONFIG_PGDENY_ENV_AUTH: "false"
    RCLONE_CONFIG_PGDENY_ACCESS_KEY_ID: "{{ bkp03_postgres_access_key }}"
    RCLONE_CONFIG_PGDENY_SECRET_ACCESS_KEY: "{{ bkp03_postgres_secret_key }}"
    RCLONE_CONFIG_PGDENY_ENDPOINT: "{{ bkp03_s3_endpoint }}"
    RCLONE_CONFIG_PGDENY_FORCE_PATH_STYLE: "true"
  register: bkp03_postgres_cross_write
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Vault identity의 PostgreSQL bucket 교차 쓰기 거부 확인
  ansible.builtin.shell:
    cmd: >-
      printf 'denied\n' |
      {{ bkp03_rclone_path }} rcat
      vaultdeny:{{ bkp03_postgres_bucket }}/bkp03-vault-cross-write-denied
      --config /dev/null --ca-cert {{ bkp03_s3_ca_path }}
      --retries 1 --low-level-retries 1 --log-level ERROR
    executable: /bin/bash
  environment:
    RCLONE_CONFIG_VAULTDENY_TYPE: s3
    RCLONE_CONFIG_VAULTDENY_PROVIDER: Other
    RCLONE_CONFIG_VAULTDENY_ENV_AUTH: "false"
    RCLONE_CONFIG_VAULTDENY_ACCESS_KEY_ID: "{{ bkp03_vault_access_key }}"
    RCLONE_CONFIG_VAULTDENY_SECRET_ACCESS_KEY: "{{ bkp03_vault_secret_key }}"
    RCLONE_CONFIG_VAULTDENY_ENDPOINT: "{{ bkp03_s3_endpoint }}"
    RCLONE_CONFIG_VAULTDENY_FORCE_PATH_STYLE: "true"
  register: bkp03_vault_cross_write
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

# 권한 회귀가 생긴 경우에도 probe object를 남기지 않는다. 이 cleanup은 정상 상태에서는
# 둘 다 skip되고, 반대 bucket의 정상 owner identity만 사용한다.
- name: 예기치 않게 생성된 Vault bucket 교차 쓰기 probe 제거
  ansible.builtin.command:
    argv:
      - "{{ bkp03_rclone_path }}"
      - deletefile
      - "vaultcleanup:{{ bkp03_vault_bucket }}/bkp03-postgres-cross-write-denied"
      - --config
      - /dev/null
      - --ca-cert
      - "{{ bkp03_s3_ca_path }}"
  environment:
    RCLONE_CONFIG_VAULTCLEANUP_TYPE: s3
    RCLONE_CONFIG_VAULTCLEANUP_PROVIDER: Other
    RCLONE_CONFIG_VAULTCLEANUP_ENV_AUTH: "false"
    RCLONE_CONFIG_VAULTCLEANUP_ACCESS_KEY_ID: "{{ bkp03_vault_access_key }}"
    RCLONE_CONFIG_VAULTCLEANUP_SECRET_ACCESS_KEY: "{{ bkp03_vault_secret_key }}"
    RCLONE_CONFIG_VAULTCLEANUP_ENDPOINT: "{{ bkp03_s3_endpoint }}"
    RCLONE_CONFIG_VAULTCLEANUP_FORCE_PATH_STYLE: "true"
  no_log: true
  when:
    - not ansible_check_mode
    - bkp03_postgres_cross_write.rc == 0

- name: 예기치 않게 생성된 PostgreSQL bucket 교차 쓰기 probe 제거
  ansible.builtin.command:
    argv:
      - "{{ bkp03_rclone_path }}"
      - deletefile
      - "pgcleanup:{{ bkp03_postgres_bucket }}/bkp03-vault-cross-write-denied"
      - --config
      - /dev/null
      - --ca-cert
      - "{{ bkp03_s3_ca_path }}"
  environment:
    RCLONE_CONFIG_PGCLEANUP_TYPE: s3
    RCLONE_CONFIG_PGCLEANUP_PROVIDER: Other
    RCLONE_CONFIG_PGCLEANUP_ENV_AUTH: "false"
    RCLONE_CONFIG_PGCLEANUP_ACCESS_KEY_ID: "{{ bkp03_postgres_access_key }}"
    RCLONE_CONFIG_PGCLEANUP_SECRET_ACCESS_KEY: "{{ bkp03_postgres_secret_key }}"
    RCLONE_CONFIG_PGCLEANUP_ENDPOINT: "{{ bkp03_s3_endpoint }}"
    RCLONE_CONFIG_PGCLEANUP_FORCE_PATH_STYLE: "true"
  no_log: true
  when:
    - not ansible_check_mode
    - bkp03_vault_cross_write.rc == 0

- name: producer identity의 상대 bucket Write 권한 부재 판정
  ansible.builtin.assert:
    that:
      - bkp03_postgres_cross_write.rc != 0
      - bkp03_vault_cross_write.rc != 0
    fail_msg: PostgreSQL과 Vault producer identity는 상대 bucket에 쓸 수 없어야 한다.
  when: not ansible_check_mode

- name: 인증된 SeaweedFS S3 public certificate 읽기
  ansible.builtin.slurp:
    src: "{{ bkp03_s3_ca_path }}"
  register: bkp03_s3_ca_raw

- name: client play에 전달할 public certificate fact 선언
  ansible.builtin.set_fact:
    bkp03_s3_ca_b64: "{{ bkp03_s3_ca_raw.content }}"
