---
# infra/ansible/roles/wazuh_agent_baseline/tasks/main.yml
# WAZUH-03: OS 계열별 설치 → 최소 ossec.conf 선언 → authd 최초 등록 → 서비스 기동.

- name: 전제 확인 — authd password와 지원 OS
  ansible.builtin.assert:
    that:
      - wazuh_agent_authd_password | length >= 32
      - ansible_facts.os_family in ['RedHat', 'Debian']
      - ansible_facts.architecture == 'x86_64'
    fail_msg: >-
      wazuh_agent_authd_password(32자 이상, extra-vars로만 주입)가 필요하고
      RedHat·Debian 계열 x86_64만 지원한다.
  no_log: true

- name: RedHat 계열 설치
  ansible.builtin.include_tasks: install-redhat.yml
  when: ansible_facts.os_family == 'RedHat'

- name: Debian 계열 설치
  ansible.builtin.include_tasks: install-debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: OS 계열 기본 신뢰 저장소 경로 결정
  ansible.builtin.set_fact:
    wazuh_agent_os_trust_directories: "{{ ['/etc/pki/tls', '/etc/pki/ca-trust/source/anchors'] if ansible_facts.os_family == 'RedHat' else ['/etc/ssl'] }}"

- name: syscheck 감시 경로 병합
  ansible.builtin.set_fact:
    wazuh_agent_syscheck_directories: "{{ (wazuh_agent_base_syscheck_directories + wazuh_agent_os_trust_directories + (wazuh_agent_extra_syscheck_directories.split(',') if wazuh_agent_extra_syscheck_directories else [])) | unique }}"

- name: ossec.conf 선언 (syscheck·rootcheck 외 모듈 없음)
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: wazuh-agent 재시작

- name: 기존 등록 상태 확인
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: wazuh_agent_client_keys

- name: manager에 최초 등록 (agent-auth)
  ansible.builtin.command:
    argv:
      - /var/ossec/bin/agent-auth
      - -m
      - "{{ wazuh_agent_manager_address }}"
      - -p
      - "{{ wazuh_agent_manager_auth_port }}"
      - -A
      - "{{ wazuh_agent_name }}"
      - -P
      - "{{ wazuh_agent_authd_password }}"
  when: not wazuh_agent_client_keys.stat.exists or wazuh_agent_client_keys.stat.size == 0
  no_log: true
  notify: wazuh-agent 재시작

- name: wazuh-agent 활성화 및 기동
  ansible.builtin.systemd_service:
    name: wazuh-agent
    enabled: true
    daemon_reload: true
    state: started
