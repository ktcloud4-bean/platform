---
# infra/ansible/roles/warpgate_baseline/defaults/main.yml
# WG-01/WG-02 warpgate-01 기준선과 Keycloak SSO 기본값.
#
# 버전과 checksum 은 고정한다. `latest` 나 미검증 설치 스크립트, curl|sh 는 쓰지 않는다.
# 선정 근거와 무결성 검증 절차는 docs/runbook/warpgate-privileged-access.md 가 소유한다.

# 작업 시점의 최신 안정 릴리스. prerelease(v0.27.0-beta.*)는 채택하지 않는다.
warpgate_version: "v0.26.1"
warpgate_arch_suffix: "x86_64-linux"

# GitHub Release asset 의 SHA-256. release API 의 asset digest 와 동일해야 한다.
warpgate_binary_sha256: "a09e96f48ef0462ee7d7c2a770595211d63c3825b39a019ab3ba5e2b5f84bd54"
# CycloneDX SBOM. 공급망 증거로 함께 고정한다.
warpgate_sbom_sha256: "b2e371ac168362f9cc6e3d666f376d66bec0f6205866183d8665ead5a2f92de1"

warpgate_release_base: "https://github.com/warp-tech/warpgate/releases/download/{{ warpgate_version }}"
warpgate_binary_url: "{{ warpgate_release_base }}/warpgate-{{ warpgate_version }}-{{ warpgate_arch_suffix }}"
warpgate_sbom_url: "{{ warpgate_release_base }}/warpgate-{{ warpgate_version }}-{{ warpgate_arch_suffix }}.cdx.xml"

# 전용 서비스 계정. 로그인 셸을 주지 않는다.
warpgate_user: "warpgate"
warpgate_group: "warpgate"

# 경로
# 바이너리는 /usr/local/bin 에 둔다. Rocky 9 targeted policy 의 기본 file context 가
# 이미 bin_t 이므로 semanage 로 별도 규칙을 추가하지 않아도 올바른 label 을 얻는다.
# 데이터 디렉터리는 /var/lib 아래라 var_lib_t 를 상속한다.
warpgate_binary_path: "/usr/local/bin/warpgate-{{ warpgate_version }}"
warpgate_binary_link: "/usr/local/bin/warpgate"
warpgate_sbom_path: "/usr/local/share/warpgate-{{ warpgate_version }}-{{ warpgate_arch_suffix }}.cdx.xml"
warpgate_config_path: "/etc/warpgate.yaml"
warpgate_data_dir: "/var/lib/warpgate"

# listen endpoint
# 단일 홈 VM 이라 [::] 는 사실상 eth0 + loopback 이다. VLAN 경계는 OPNsense 가 소유하며
# 실제 최소화는 NET-04 범위다. 이 role 은 VLAN 정책을 만들지 않는다.
warpgate_http_listen: "[::]:8888"
warpgate_ssh_listen: "[::]:2222"

# 브라우저 SSO callback 과 service cookie 가 사용하는 내부 service alias.
# 공개 A/AAAA 또는 NAT 를 뜻하지 않으며 docs/ip-plan.md 가 단일 원본이다.
warpgate_external_host: "warpgate.imcherry5778.xyz"

# 세션 기록
warpgate_recordings_enable: true

# v0.26.1 이 제공하는 세션 경계. SSH 에는 유휴 timeout 만 있고 별도의 절대 최대
# duration 키는 없다. 존재하지 않는 설정을 추측해서 넣지 않는다.
warpgate_ssh_inactivity_timeout: "5m"
warpgate_http_session_max_age: "30m"
warpgate_http_cookie_max_age: "8h"

# 로그·감사 보존기간. 보존기간으로 통제하고 용량으로 통제하지 않는다
# (docs/capacity-plan.md 의 warpgate-01 구획 참조).
warpgate_log_retention: "7days"
warpgate_audit_retention: "90days"
warpgate_log_format: "text"

# 대상 host key 검증 정책. prompt 는 첫 접속에서 사용자에게 확인을 요구한다.
# auto_accept 는 TOFU 이므로 기본값으로 쓰지 않는다.
warpgate_ssh_host_key_verification: "prompt"

# 로컬 break-glass 관리자 비밀번호. 저장소에 두지 않는다.
# 저장소 밖 mode 0600 vars 파일 또는 --extra-vars 로만 주입한다.
warpgate_admin_password: ""

# Keycloak OIDC. client secret 과 Admin API bearer token 은 저장소 밖 mode 0600
# vars 에서만 주입한다. bearer token 은 전용 client 선언 시에만 사용하고 게스트에
# 저장하지 않는다.
warpgate_sso_enabled: true
warpgate_sso_name: "keycloak"
warpgate_sso_label: "Keycloak"
warpgate_sso_issuer: "https://sso.imcherry5778.xyz/realms/platform"
warpgate_sso_client_id: "warpgate"
warpgate_sso_client_secret_file: ""
warpgate_sso_client_secret: >-
  {{
    (lookup('ansible.builtin.file', warpgate_sso_client_secret_file) | trim)
    if warpgate_sso_client_secret_file | length > 0 else ''
  }}
warpgate_sso_scopes:
  - email
  - profile
warpgate_sso_roles_claim: "groups"
warpgate_sso_role_mappings:
  /platform-users: "platform-users"
  /platform-privileged: "platform-privileged"
warpgate_sso_auto_create_users: false

warpgate_keycloak_manage_client: true
warpgate_keycloak_admin_bearer_header_file: ""
warpgate_keycloak_admin_bearer_token: >-
  {{
    (lookup('ansible.builtin.file', warpgate_keycloak_admin_bearer_header_file)
     | trim | regex_replace('^Authorization: Bearer ', ''))
    if warpgate_keycloak_admin_bearer_header_file | length > 0 else ''
  }}
warpgate_keycloak_client_owner_attribute: "warpgate_baseline/WG-02"
warpgate_keycloak_realm: "platform"
warpgate_keycloak_admin_base: >-
  {{ warpgate_sso_issuer | regex_replace('/realms/[^/]+$', '') }}/admin/realms/{{ warpgate_keycloak_realm }}
warpgate_keycloak_redirect_uri: >-
  https://{{ warpgate_external_host }}:{{ warpgate_http_listen | regex_replace('^.*:', '') }}/@warpgate/api/sso/return

# Warpgate 전용 public DNS-01 인증서. OPNsense·Proxmox·k3s token 또는 private key 를
# 재사용하지 않는다. Cloudflare token 은 대상 zone 의 Zone:Read + DNS:Edit 만 가진다.
warpgate_acme_enabled: true
warpgate_acme_email: "admin@imcherry5778.xyz"
warpgate_acme_server: "https://acme-v02.api.letsencrypt.org/directory"
warpgate_acme_cloudflare_token_file: ""
warpgate_acme_cloudflare_token: >-
  {{
    (lookup('ansible.builtin.file', warpgate_acme_cloudflare_token_file) | trim)
    if warpgate_acme_cloudflare_token_file | length > 0 else ''
  }}
warpgate_acme_dir: "/var/lib/warpgate-acme"
warpgate_acme_credentials_dir: "/etc/warpgate-acme"
warpgate_acme_renew_days: 30
# ACCESS VLAN 은 외부 UDP/TCP 53을 직접 열지 않고 OPNsense Unbound만 사용한다.
# Unbound의 내부 imcherry5778.xyz local-zone은 ACME TXT를 NXDOMAIN으로 답하므로
# Cloudflare API 생성 뒤 고정 대기하고 CA의 authoritative 검증에 맡긴다.
warpgate_acme_dns_propagation_wait: "60s"

# 공식 go-acme/lego release archive 를 checksum 으로 고정한다.
warpgate_lego_version: "v5.2.1"
warpgate_lego_archive_sha256: "c5c7f34594daa8d05ec568069fa6c97ace1ef428367533a6d42bf9b3d5164169"
warpgate_lego_archive_url: >-
  https://github.com/go-acme/lego/releases/download/{{ warpgate_lego_version }}/lego_{{ warpgate_lego_version }}_linux_amd64.tar.gz
warpgate_lego_archive_path: "/var/cache/warpgate/lego-{{ warpgate_lego_version }}-linux-amd64.tar.gz"
warpgate_lego_binary_path: "/usr/local/bin/lego-{{ warpgate_lego_version }}"
warpgate_lego_binary_link: "/usr/local/bin/lego"

# 선언형 provisioning 목록. 기본은 비어 있고 저장소 밖 vars 파일로 주입한다.
# 각 항목은 state: present|absent 를 가진다.
#
# warpgate_roles:
#   - { name: "<role>", description: "", state: present }
# warpgate_targets:
#   - name: "<target>"
#     description: ""
#     ssh: { host: "127.0.0.1", port: 22, username: "<user>" }
#     roles: ["<role>"]
#     state: present
# warpgate_users:
#   - name: "<user>"
#     description: ""
#     password: "<저장소 밖에서 주입>"
#     roles: ["<role>"]  # 생략하면 direct role 을 관리하지 않는다.
#     sso_credentials:
#       - { provider: "keycloak", email: "<검증된 이메일>" }
#     state: present
# warpgate_known_hosts:
#   - { host: "<대상>", port: 22, key_type: "ssh-ed25519", source_host: "<인증된 known_hosts의 이름 또는 IP>", state: present }
# `source_host`를 쓰면 아래 저장소 밖 trusted known_hosts에서 키를 읽는다. key_base64를
# 직접 주입하는 기존 호출도 호환하지만, 자동 수집·TOFU는 허용하지 않는다.
warpgate_trusted_known_hosts_file: ""
warpgate_roles:
  - name: "platform-users"
    description: "Keycloak /platform-users 일상 접근"
    state: present
  - name: "platform-privileged"
    description: "Keycloak /platform-privileged 승인 특권 접근"
    state: present
warpgate_targets: []
warpgate_users:
  # IAM-MIG-01: imcherry/imcherry-admin(legacy)와 imcherry5778/imcherry5778-admin(신규)의
  # Keycloak email이 각각 동일해(전자는 실제 email 재사용, 후자는 IAM-MIG-01에서 신규 계정에
  # legacy와 같은 "+admin" 별칭을 부여) SSO credential이 email 기준으로 충돌한다. 두 계정을
  # 동시에 email로 매핑하면 어느 Warpgate user로 로그인이 귀속되는지 결정할 수 없으므로,
  # user 객체(세션 기록·역할 이력)는 보존하되 legacy 쪽 SSO credential만 제거해 로그인
  # 경로를 신규 ID로 옮긴다. legacy Keycloak 계정 자체도 이 작업에서 disable한다.
  - name: "imcherry"
    description: "Keycloak 일상 ID (legacy, IAM-MIG-01로 disable; SSO credential 제거)"
    sso_credentials: []
    state: present
  - name: "imcherry-admin"
    description: "Keycloak 특권 ID (legacy, IAM-MIG-01로 disable; SSO credential 제거)"
    sso_credentials: []
    state: present
  - name: "imcherry5778"
    description: "Keycloak 일상 ID"
    sso_credentials:
      - provider: "keycloak"
        email: "imcherry5778@gmail.com"
    state: present
  - name: "imcherry5778-admin"
    description: "Keycloak 특권 ID"
    sso_credentials:
      - provider: "keycloak"
        email: "imcherry5778+admin@gmail.com"
    state: present
warpgate_known_hosts: []

# WG-02 라이브 권한·recording 검증용 loopback OS 계정. 검증 run에서만 true로
# 올리고 최종 run은 false로 되돌려 계정과 home을 제거한다.
warpgate_validation_target_enabled: false
warpgate_validation_target_user: "wg02-validation-target"

# provisioning 을 수행할지 여부. false 면 설치·설정·서비스만 선언한다.
warpgate_provision_enabled: >-
  {{ (warpgate_roles | length + warpgate_targets | length
      + warpgate_users | length + warpgate_known_hosts | length) > 0 }}

# admin API 호출에 쓰는 loopback base URL.
# WG-02 공인 인증서는 service alias 단일 SAN이라 127.0.0.1 URL과 일치하지 않는다.
# 관리 API는 외부로 열지 않고 loopback 한정으로 호출한다.
warpgate_api_base: "https://127.0.0.1:{{ warpgate_http_listen | regex_replace('^.*:', '') }}"
