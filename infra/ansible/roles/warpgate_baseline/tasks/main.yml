---
# infra/ansible/roles/warpgate_baseline/tasks/main.yml
# WG-01: warpgate-01 Warpgate 선언형 배포.
#
# 이 role 은 warpgate-01 안의 Warpgate 설치·서비스 계정·설정·systemd unit 과
# 선언한 role/target/user 만 소유한다. OPNsense, Proxmox, VLAN 정책, 다른 VM 은
# 건드리지 않는다.

- name: 전제 확인 — 대상 OS·아키텍처
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Rocky"
      - ansible_facts.distribution_major_version == "9"
      - ansible_facts.architecture == "x86_64"
    fail_msg: >-
      이 role 은 Rocky Linux 9 x86_64 를 전제로 한다.
      실제: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}
      {{ ansible_facts.architecture }}

- name: 전제 확인 — SELinux Enforcing 유지
  ansible.builtin.assert:
    that:
      - ansible_facts.selinux.status | default('disabled') == 'enabled'
      - ansible_facts.selinux.mode | default('disabled') == 'enforcing'
    fail_msg: >-
      SELinux 는 Enforcing 이어야 한다. 이 role 은 SELinux 를 완화하지 않는다.

- name: 기존 설정 파일 확인
  ansible.builtin.stat:
    path: "{{ warpgate_config_path }}"
  register: warpgate_config_stat

- name: 전제 확인 — 최초 부트스트랩의 로컬 복구 관리자 비밀번호 주입
  ansible.builtin.assert:
    that:
      - warpgate_config_stat.stat.exists or warpgate_admin_password | length >= 12
    fail_msg: >-
      최초 Warpgate 부트스트랩에는 warpgate_admin_password 를 저장소 밖 vars 파일이나
      --extra-vars 로 주입해야 한다. 이미 설정된 Warpgate를 재적용할 때는 기존 로컬
      복구 계정의 비밀번호를 요구하거나 교체하지 않는다.
  no_log: true

- name: WG-02 외부 비밀 파일 metadata 확인
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: >-
    {{
      [
        warpgate_sso_client_secret_file,
        warpgate_keycloak_admin_bearer_header_file,
        warpgate_acme_cloudflare_token_file
      ]
      | reject('equalto', '')
      | list
    }}
  register: wg_external_secret_files
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: WG-02 외부 비밀 파일 최소 권한 확인
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg | default(false)
      - item.stat.mode == "0600"
    fail_msg: "WG-02 외부 비밀 입력은 symlink가 아닌 mode 0600 regular file이어야 한다."
  loop: "{{ wg_external_secret_files.results }}"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: 전제 확인 — WG-02 SSO·ACME 비밀 주입
  ansible.builtin.assert:
    that:
      - not (warpgate_sso_enabled | bool) or warpgate_sso_client_secret | length >= 32
      - >-
        not (warpgate_sso_enabled | bool and warpgate_keycloak_manage_client | bool)
        or warpgate_keycloak_admin_bearer_token | length >= 32
      - not (warpgate_acme_enabled | bool) or warpgate_acme_cloudflare_token | length >= 32
    fail_msg: >-
      WG-02 client secret, 단기 Keycloak Admin bearer token, Warpgate 전용 Cloudflare
      DNS token 을 저장소 밖 mode 0600 vars 에 주입해야 한다.
  no_log: true

- name: 전용 그룹 생성
  ansible.builtin.group:
    name: "{{ warpgate_group }}"
    system: true
    state: present

- name: 전용 서비스 계정 생성 (로그인 셸 없음)
  ansible.builtin.user:
    name: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    system: true
    shell: /sbin/nologin
    home: "{{ warpgate_data_dir }}"
    create_home: false
    password_lock: true
    state: present

- name: 데이터 디렉터리 생성 (최소 권한)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    mode: "0700"
  loop:
    - "{{ warpgate_data_dir }}"
    - "{{ warpgate_data_dir }}/db"
    - "{{ warpgate_data_dir }}/ssh-keys"
    - "{{ warpgate_data_dir }}/recordings"

# 고정 버전 + 고정 checksum 으로만 내려받는다.
# floating latest, 미검증 설치 스크립트, curl|sh 는 쓰지 않는다.
- name: Warpgate 바이너리 설치 (고정 버전·SHA-256 검증)
  ansible.builtin.get_url:
    url: "{{ warpgate_binary_url }}"
    dest: "{{ warpgate_binary_path }}"
    checksum: "sha256:{{ warpgate_binary_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  register: warpgate_binary_download

- name: CycloneDX SBOM 보관 (공급망 증거)
  ansible.builtin.get_url:
    url: "{{ warpgate_sbom_url }}"
    dest: "{{ warpgate_sbom_path }}"
    checksum: "sha256:{{ warpgate_sbom_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: 현재 버전 symlink
  ansible.builtin.file:
    src: "{{ warpgate_binary_path }}"
    dest: "{{ warpgate_binary_link }}"
    state: link
    force: true
    owner: root
    group: root

# --- 최초 부트스트랩 -------------------------------------------------------
# unattended-setup 은 설정 파일, SQLite DB, SSH host/client key, 자체서명 TLS 와
# 로컬 admin 사용자를 한 번에 만든다. 설정 파일 존재로 멱등성을 보장하고,
# 이후 설정은 아래 template 이 소유한다.

- name: 최초 부트스트랩 (unattended-setup)
  ansible.builtin.command:
    argv: >-
      {{
        [warpgate_binary_path, '--config', warpgate_config_path, 'unattended-setup',
         '--data-path', warpgate_data_dir,
         '--http-port', warpgate_http_listen | regex_replace('^.*:', ''),
         '--ssh-port', warpgate_ssh_listen | regex_replace('^.*:', ''),
         '--external-host', warpgate_external_host]
        + (['--record-sessions'] if warpgate_recordings_enable | bool else [])
      }}
  environment:
    WARPGATE_ADMIN_PASSWORD: "{{ warpgate_admin_password }}"
  when: not warpgate_config_stat.stat.exists
  no_log: true
  changed_when: true
  notify: restart warpgate

- name: 부트스트랩 산출물 소유권 정리
  ansible.builtin.file:
    path: "{{ warpgate_data_dir }}"
    state: directory
    owner: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    recurse: true
  when: not warpgate_config_stat.stat.exists

# 자기 loopback 검증은 cross-VLAN 증거가 아니다. 임시 계정의 생성·제거도 role 선언이
# 소유하며 최종값 false에서 계정과 home을 제거한다.
- name: WG-02 임시 loopback 검증 계정 선언
  ansible.builtin.include_tasks: validation_target.yml

# Keycloak 기존 realm/group/user/bootstrap Job 은 건드리지 않는다. WG-02 전용 client 와
# groups mapper 하나만 Admin API 로 소유한다.
- name: Keycloak WG-02 전용 OIDC client 선언
  ansible.builtin.include_tasks: keycloak_client.yml
  when:
    - warpgate_sso_enabled | bool
    - warpgate_keycloak_manage_client | bool

# setup 자체서명 자료를 공인 단일-host DNS-01 인증서로 교체한다. 발급과 자동 갱신,
# 배포 경로는 이 role 이 함께 소유한다.
- name: Warpgate 전용 ACME 인증서 선언
  ansible.builtin.include_tasks: acme.yml
  when: warpgate_acme_enabled | bool

- name: WG-04 입력 검증 — native PostgreSQL listener와 upstream TLS trust
  ansible.builtin.assert:
    that:
      - warpgate_postgres_listen is match('^\\[::\\]:[0-9]{1,5}$')
      - warpgate_postgres_external_host | length > 0
      - warpgate_postgres_external_port | int > 0
      - warpgate_postgres_external_port | int < 65536
      - warpgate_postgres_upstream_host | length > 0
      - warpgate_postgres_upstream_certificate_pem | length > 0
    fail_msg: >-
      WG-04에는 PostgreSQL listener endpoint, external host/port와 postgres-01의
      public bootstrap CA 입력이 모두 필요하다.
  when: warpgate_postgres_enabled | bool
  no_log: true

- name: WG-04 PostgreSQL public bootstrap CA를 Warpgate system trust anchor로 설치
  ansible.builtin.copy:
    content: "{{ warpgate_postgres_upstream_certificate_pem }}"
    dest: "{{ warpgate_postgres_trust_anchor_path }}"
    owner: root
    group: root
    mode: "0644"
  register: warpgate_postgres_trust_anchor
  when: warpgate_postgres_enabled | bool
  no_log: true

- name: WG-04 system trust store 갱신
  ansible.builtin.command:
    argv: ["update-ca-trust", "extract"]
  when:
    - warpgate_postgres_enabled | bool
    - warpgate_postgres_trust_anchor.changed
  changed_when: true

- name: WG-04 actual PostgreSQL upstream TLS chain과 hostname 검증
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      printf '' | openssl s_client \
        -starttls postgres \
        -connect "${WG04_POSTGRES_HOST}:5432" \
        -CAfile "${WG04_CA_FILE}" \
        -verify_hostname "${WG04_POSTGRES_HOST}" \
        -verify_return_error 2>&1 \
        | grep -Fx 'Verify return code: 0 (ok)'
    executable: /bin/bash
  environment:
    WG04_POSTGRES_HOST: "{{ warpgate_postgres_upstream_host }}"
    WG04_CA_FILE: "{{ warpgate_postgres_trust_anchor_path }}"
  changed_when: false
  when: warpgate_postgres_enabled | bool

- name: WG-04 actual PostgreSQL server leaf의 최소 잔여 유효기간 검증
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      printf '' | openssl s_client \
        -starttls postgres \
        -connect "${WG04_POSTGRES_HOST}:5432" \
        -CAfile "${WG04_CA_FILE}" \
        -verify_hostname "${WG04_POSTGRES_HOST}" \
        -verify_return_error 2>/dev/null \
        | openssl x509 -noout -checkend 86400
    executable: /bin/bash
  environment:
    WG04_POSTGRES_HOST: "{{ warpgate_postgres_upstream_host }}"
    WG04_CA_FILE: "{{ warpgate_postgres_trust_anchor_path }}"
  changed_when: false
  when: warpgate_postgres_enabled | bool

# --- 선언형 설정 -----------------------------------------------------------

- name: Warpgate 설정 선언
  ansible.builtin.template:
    src: warpgate.yaml.j2
    dest: "{{ warpgate_config_path }}"
    owner: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    mode: "0600"
    validate: "{{ omit if ansible_check_mode else warpgate_binary_path + ' --config %s check' }}"
  notify: restart warpgate
  no_log: "{{ warpgate_sso_enabled | bool }}"

- name: 데이터 디렉터리 권한 재확인
  ansible.builtin.file:
    path: "{{ warpgate_data_dir }}"
    state: directory
    owner: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    mode: "0700"

- name: TLS 자료 존재 확인
  ansible.builtin.stat:
    path: "{{ warpgate_data_dir }}/{{ item }}"
  loop:
    - tls.certificate.pem
    - tls.key.pem
  register: warpgate_tls_stat

# 최초 check mode 에서는 setup 이 아직 실행되지 않아 파일이 없다. 그때는 건너뛴다.
- name: TLS 자료 최소 권한
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: "{{ warpgate_user }}"
    group: "{{ warpgate_group }}"
    mode: "0600"
  loop: "{{ warpgate_tls_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: systemd unit 선언 (hardening 포함)
  ansible.builtin.template:
    src: warpgate.service.j2
    dest: /etc/systemd/system/warpgate.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart warpgate

- name: 서비스 활성화와 기동 (재부팅 후 자동 시작)
  ansible.builtin.systemd:
    name: warpgate.service
    enabled: true
    state: started
    daemon_reload: true

- name: handler 를 먼저 반영한다
  ansible.builtin.meta: flush_handlers

- name: HTTP 관리 endpoint 응답 대기
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/api/info"
    validate_certs: false
    status_code: [200, 401, 403]
  register: warpgate_http_ready
  retries: 30
  delay: 2
  until: warpgate_http_ready is succeeded
  check_mode: false
  when: not ansible_check_mode

- name: 선언한 role/target/user 반영
  ansible.builtin.include_tasks: provision.yml
  when:
    - warpgate_provision_enabled | bool
    - not ansible_check_mode
