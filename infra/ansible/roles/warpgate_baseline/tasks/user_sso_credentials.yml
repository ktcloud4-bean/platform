---
# 한 managed user 의 SSO credential 을 provider+email 쌍으로 정확히 선언한다.

- name: "{{ wg_managed_sso_user.name }} 현재 SSO credential 조회"
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        wg_user_ids[wg_managed_sso_user.name] }}/credentials/sso
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: 200
  register: wg_user_sso_credentials_current
  check_mode: false

- name: "{{ wg_managed_sso_user.name }} SSO credential 생성"
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        wg_user_ids[wg_managed_sso_user.name] }}/credentials/sso
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body:
      provider: "{{ item.provider }}"
      email: "{{ item.email }}"
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ wg_managed_sso_user.sso_credentials }}"
  loop_control:
    label: "{{ item.provider }}:{{ item.email }}"
  when: >-
    (wg_user_sso_credentials_current.json
      | selectattr('provider', 'equalto', item.provider)
      | selectattr('email', 'equalto', item.email)
      | list | length) == 0

- name: "{{ wg_managed_sso_user.name }} 선언 밖 SSO credential 제거"
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        wg_user_ids[wg_managed_sso_user.name] }}/credentials/sso/{{ item.id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204, 404]
  changed_when: true
  loop: "{{ wg_user_sso_credentials_current.json }}"
  loop_control:
    label: "{{ item.provider | default('any') }}:{{ item.email }}"
  when: >-
    (wg_managed_sso_user.sso_credentials
      | selectattr('provider', 'equalto', item.provider)
      | selectattr('email', 'equalto', item.email)
      | list | length) == 0
