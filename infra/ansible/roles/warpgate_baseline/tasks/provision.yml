---
# infra/ansible/roles/warpgate_baseline/tasks/provision.yml
# WG-01: role / target / user 를 Warpgate 관리 API 로 선언형 반영한다.
#
# Warpgate 는 role·target·user 를 설정 파일이 아니라 제품 DB 에 둔다. 따라서
# 선언은 같은 VM의 내부 service alias 관리 API 호출로 반영한다. 이 role 은 공개 경로나
# 방화벽을 만들지 않는다.
#
# 관리 API 는 외부 공개 없이 내부 alias로만 호출한다. 외부 브라우저용 인증서는 같은 role의
# WG-02 전용 DNS-01 선언이 소유한다. bootstrap self-signed certificate도 지원해야 하므로
# 이 내부 호출은 validate_certs 를 끈다.

- name: 선언형 Warpgate 제품 DB 수렴용 기존 로컬 관리자 입력 확인
  ansible.builtin.assert:
    that:
      - warpgate_admin_password | length >= 12
    fail_msg: >-
      role·target·user·Admin role은 Warpgate 제품 DB에 저장되므로, 기존 로컬 admin의
      현재 비밀번호를 저장소 밖 mode 0600 vars file로 주입해야 합니다. 이 task는
      비밀번호를 생성·교체하거나 recover-access를 실행하지 않습니다.
  no_log: true

- name: 관리 API 로그인 (같은 VM의 내부 service alias)
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/api/auth/login"
    method: POST
    # v0.26.1은 HTTP session cookie request Host를 external_host와 대조한다.
    # Host를 internal service alias로 고정해 cookie를 재사용한다. 요청은 같은 VM의
    # ACCESS 주소로만 나가며 외부 관리 listener를 만들지 않는다.
    headers:
      Host: "{{ warpgate_external_host }}"
    body_format: json
    body:
      username: admin
      password: "{{ warpgate_admin_password }}"
    validate_certs: false
    status_code: [200, 201, 204]
  register: wg_login
  no_log: true
  check_mode: false

- name: 세션 쿠키 보관
  ansible.builtin.set_fact:
    wg_headers:
      Host: "{{ warpgate_external_host }}"
      Cookie: "{{ wg_login.cookies_string }}"
  no_log: true

# --- role ------------------------------------------------------------------

- name: 현재 role 목록 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/roles"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_roles_current
  check_mode: false

- name: 선언한 role 생성
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/roles"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      description: "{{ item.description | default('') }}"
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ warpgate_roles | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (wg_roles_current.json | map(attribute='name') | list)

- name: 제거할 role 삭제
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/role/{{
        (wg_roles_current.json | selectattr('name', 'eq', item.name) | first).id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204]
  changed_when: true
  loop: "{{ warpgate_roles | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in (wg_roles_current.json | map(attribute='name') | list)

- name: role 목록 재조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/roles"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_roles_current
  check_mode: false

- name: role 이름 → id 색인
  ansible.builtin.set_fact:
    wg_role_ids: "{{ dict(wg_roles_current.json | map(attribute='name') | zip(wg_roles_current.json | map(attribute='id'))) }}"

# --- admin role -------------------------------------------------------------
# access role은 target 연결 여부만, admin role은 제품 관리 UI의 기능별 권한만 소유한다.
# 이 목록은 별도 OIDC claim mapping으로만 사용자에게 붙으며 target role에는 영향을 주지 않는다.

- name: 현재 Admin role 목록 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/admin-roles"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_admin_roles_current
  check_mode: false
  when: warpgate_admin_roles | length > 0

- name: WG-04 Admin role 입력의 최소권한 shape 확인
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9-]{0,62}$')
      - item.description is string
      - item.targets_create is boolean
      - item.targets_edit is boolean
      - item.targets_delete is boolean
      - item.users_create is boolean
      - item.users_edit is boolean
      - item.users_delete is boolean
      - item.access_roles_create is boolean
      - item.access_roles_edit is boolean
      - item.access_roles_delete is boolean
      - item.access_roles_assign is boolean
      - item.sessions_view is boolean
      - item.sessions_terminate is boolean
      - item.recordings_view is boolean
      - item.tickets_create is boolean
      - item.tickets_delete is boolean
      - item.config_edit is boolean
      - item.admin_roles_manage is boolean
      - item.ticket_requests_manage is boolean
    fail_msg: Warpgate Admin role은 이름과 v0.26.1의 전체 boolean permission을 명시해야 한다.
  loop: "{{ warpgate_admin_roles }}"
  loop_control:
    label: "{{ item.name }}"
  when: warpgate_admin_roles | length > 0

- name: 선언한 Admin role 생성
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/admin-roles"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body: "{{ item }}"
    validate_certs: false
    status_code: [201]
  changed_when: true
  loop: "{{ warpgate_admin_roles }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - warpgate_admin_roles | length > 0
    - item.name not in (wg_admin_roles_current.json | map(attribute='name') | list)

- name: 선언한 Admin role의 drift 판정
  ansible.builtin.set_fact:
    wg_admin_role_drift: >-
      {{ wg_admin_role_drift | default([]) + [item] }}
  loop: "{{ warpgate_admin_roles }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - warpgate_admin_roles | length > 0
    - item.name in (wg_admin_roles_current.json | map(attribute='name') | list)
    - >-
      ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).description != item.description)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).targets_create != item.targets_create)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).targets_edit != item.targets_edit)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).targets_delete != item.targets_delete)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).users_create != item.users_create)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).users_edit != item.users_edit)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).users_delete != item.users_delete)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).access_roles_create != item.access_roles_create)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).access_roles_edit != item.access_roles_edit)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).access_roles_delete != item.access_roles_delete)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).access_roles_assign != item.access_roles_assign)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).sessions_view != item.sessions_view)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).sessions_terminate != item.sessions_terminate)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).recordings_view != item.recordings_view)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).tickets_create != item.tickets_create)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).tickets_delete != item.tickets_delete)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).config_edit != item.config_edit)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).admin_roles_manage != item.admin_roles_manage)
      or ((wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).ticket_requests_manage != item.ticket_requests_manage)

- name: 선언한 Admin role drift 보정
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/admin-roles/{{
        (wg_admin_roles_current.json | selectattr('name', 'eq', item.name) | first).id
      }}
    method: PUT
    headers: "{{ wg_headers }}"
    body_format: json
    body: "{{ item }}"
    validate_certs: false
    status_code: [200]
  changed_when: true
  loop: "{{ wg_admin_role_drift | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

# --- 대상 SSH host key ------------------------------------------------------
# host_key_verification 이 prompt 라 첫 접속에서 사용자에게 TOFU 확인을 요구한다.
# 인증된 경로(Proxmox 직렬 콘솔)로 이미 확인한 host key 만 미리 선언해 TOFU 를 없앤다.

- name: 저장소 밖 known_hosts에서 읽을 대상 선별
  ansible.builtin.set_fact:
    wg_known_hosts_needing_resolution: >-
      {{ warpgate_known_hosts
         | selectattr('state', 'defined')
         | selectattr('state', 'eq', 'present')
         | rejectattr('key_base64', 'defined')
         | list }}
  no_log: true

- name: trusted known_hosts 입력 경로 확인
  ansible.builtin.assert:
    that:
      - warpgate_trusted_known_hosts_file | length > 0
      - warpgate_trusted_known_hosts_file is match('^/')
    fail_msg: >-
      key_base64를 직접 주입하지 않는 운영 대상은 저장소 밖 absolute trusted known_hosts
      파일과 source_host를 지정해야 한다. ssh-keyscan·accept-new·TOFU는 사용하지 않는다.
  when: wg_known_hosts_needing_resolution | length > 0
  no_log: true

- name: trusted known_hosts 파일 metadata 확인
  ansible.builtin.stat:
    path: "{{ warpgate_trusted_known_hosts_file }}"
    follow: false
  delegate_to: localhost
  become: false
  run_once: true
  register: wg_trusted_known_hosts_stat
  when: wg_known_hosts_needing_resolution | length > 0
  no_log: true

- name: trusted known_hosts 파일 최소 권한 확인
  ansible.builtin.assert:
    that:
      - wg_trusted_known_hosts_stat.stat.exists
      - wg_trusted_known_hosts_stat.stat.isreg | default(false)
      - wg_trusted_known_hosts_stat.stat.mode == '0600'
      - not (wg_trusted_known_hosts_stat.stat.islnk | default(false))
    fail_msg: trusted known_hosts는 저장소 밖 mode 0600 regular file이어야 한다.
  delegate_to: localhost
  become: false
  run_once: true
  when: wg_known_hosts_needing_resolution | length > 0
  no_log: true

- name: 인증된 known_hosts에서 대상 ed25519 key 추출
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      ssh-keygen -F "$WG_SOURCE_HOST" -f "$WG_TRUSTED_KNOWN_HOSTS" \
        | awk -v key_type="$WG_KEY_TYPE" '$2 == key_type { print $3; exit }'
    executable: /bin/bash
  environment:
    WG_SOURCE_HOST: "{{ item.source_host | default(item.host) }}"
    WG_KEY_TYPE: "{{ item.key_type }}"
    WG_TRUSTED_KNOWN_HOSTS: "{{ warpgate_trusted_known_hosts_file }}"
  delegate_to: localhost
  become: false
  register: wg_known_hosts_extract
  changed_when: false
  check_mode: false
  loop: "{{ wg_known_hosts_needing_resolution }}"
  loop_control:
    label: "{{ item.host }} ← {{ item.source_host | default(item.host) }}"
  no_log: true

- name: 인증된 known_hosts key 추출 결과 확인
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout_lines | length == 1
      - item.stdout | trim is match('^[A-Za-z0-9+/]+={0,3}$')
    fail_msg: >-
      {{ item.item.host }}의 {{ item.item.key_type }} key가 trusted known_hosts의
      {{ item.item.source_host | default(item.item.host) }} 항목에 정확히 하나 있어야 한다.
  loop: "{{ wg_known_hosts_extract.results | default([]) }}"
  loop_control:
    label: "{{ item.item.host }}"
  no_log: true

- name: 기존 key_base64 선언으로 resolved 목록 초기화
  ansible.builtin.set_fact:
    wg_known_hosts_resolved: >-
      {{ warpgate_known_hosts
         | selectattr('state', 'defined')
         | rejectattr('state', 'eq', 'present')
         | list }}
  no_log: true

- name: 직접 주입한 key_base64를 resolved 목록에 추가
  ansible.builtin.set_fact:
    wg_known_hosts_resolved: "{{ wg_known_hosts_resolved + [item] }}"
  loop: >-
    {{ warpgate_known_hosts
       | selectattr('state', 'defined')
       | selectattr('state', 'eq', 'present')
       | selectattr('key_base64', 'defined')
       | list }}
  loop_control:
    label: "{{ item.host }}"
  no_log: true

- name: trusted known_hosts key를 resolved 목록에 추가
  ansible.builtin.set_fact:
    wg_known_hosts_resolved: >-
      {{ wg_known_hosts_resolved
         + [item.item | combine({'key_base64': item.stdout | trim})] }}
  loop: "{{ wg_known_hosts_extract.results | default([]) }}"
  loop_control:
    label: "{{ item.item.host }}"
  no_log: true

- name: 신뢰 host key 현황 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/ssh/known-hosts"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_known_hosts_current
  check_mode: false

- name: 기존 trusted host key 색인
  ansible.builtin.set_fact:
    wg_known_hosts_current_by_slot: >-
      {{ wg_known_hosts_current_by_slot | default({})
         | combine({
             item.host ~ '|' ~ (item.port | string) ~ '|' ~ item.key_type:
             (item.key_base64 | default(''))
           }) }}
  loop: "{{ wg_known_hosts_current.json }}"
  loop_control:
    label: "{{ item.host }}:{{ item.port }} {{ item.key_type }}"
  no_log: true

- name: 기존 trusted host key 불일치 fail closed
  ansible.builtin.assert:
    that:
      - >-
        (item.host ~ '|' ~ (item.port | default(22) | int | string) ~ '|' ~ item.key_type)
        not in (wg_known_hosts_current_by_slot | default({}))
        or
        (wg_known_hosts_current_by_slot[
          item.host ~ '|' ~ (item.port | default(22) | int | string) ~ '|' ~ item.key_type
        ] == item.key_base64)
    fail_msg: >-
      {{ item.host }}:{{ item.port | default(22) }}의 기존 {{ item.key_type }} key가
      인증된 선언과 다릅니다. key rotation은 별도 검증·승인 절차로 처리해야 합니다.
  loop: "{{ wg_known_hosts_resolved }}"
  loop_control:
    label: "{{ item.host }}:{{ item.port | default(22) }} {{ item.key_type }}"
  no_log: true

- name: 검증된 대상 host key 선언
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/ssh/known-hosts"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body: >-
      {{
        {
          'host': item.host,
          'port': item.port | default(22) | int,
          'key_type': item.key_type,
          'key_base64': item.key_base64
        }
      }}
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ wg_known_hosts_resolved | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.host }}:{{ item.port | default(22) }} {{ item.key_type }}"
  when: >-
    (wg_known_hosts_current.json
      | selectattr('host', 'eq', item.host)
      | selectattr('port', 'eq', item.port | default(22) | int)
      | selectattr('key_type', 'eq', item.key_type)
      | list | length) == 0

- name: 제거할 host key 삭제
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/ssh/known-hosts/{{
        (wg_known_hosts_current.json
          | selectattr('host', 'eq', item.host)
          | selectattr('port', 'eq', item.port | default(22) | int)
          | selectattr('key_type', 'eq', item.key_type)
          | first).id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204]
  changed_when: true
  loop: "{{ wg_known_hosts_resolved | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
  loop_control:
    label: "{{ item.host }}:{{ item.port | default(22) }} {{ item.key_type }}"
  when: >-
    (wg_known_hosts_current.json
      | selectattr('host', 'eq', item.host)
      | selectattr('port', 'eq', item.port | default(22) | int)
      | selectattr('key_type', 'eq', item.key_type)
      | list | length) > 0

# --- target ----------------------------------------------------------------

- name: 현재 target 목록 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/targets"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_targets_current
  check_mode: false

- name: 선언한 target 생성
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/targets"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    # 관리 API 의 union discriminator 는 Rust variant 이름(PascalCase)을 쓴다.
    # options를 명시하면 SSH 이외 protocol도 선언할 수 있다. port 등 숫자 형과
    # PostgreSQL upstream password를 안전하게 유지하려고 body 전체를 Jinja 식으로 만든다.
    body: >-
      {{
        {
          'name': item.name,
          'description': item.description | default(''),
          'options': (
            item.options
            if item.options is defined
            else {
              'kind': 'Ssh',
              'host': item.ssh.host,
              'port': item.ssh.port | default(22) | int,
              'username': item.ssh.username,
              'auth': {'kind': 'PublicKey'}
            }
          )
        }
      }}
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ warpgate_targets | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (wg_targets_current.json | map(attribute='name') | list)
  no_log: true

- name: 제거할 target 삭제
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/targets/{{
        (wg_targets_current.json | selectattr('name', 'eq', item.name) | first).id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204]
  changed_when: true
  loop: "{{ warpgate_targets | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in (wg_targets_current.json | map(attribute='name') | list)

- name: target 목록 재조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/targets"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_targets_current
  check_mode: false
  no_log: true

- name: reconcile 대상의 현재 options와 선언 options 일치 여부 확인
  ansible.builtin.assert:
    that:
      - >-
        (wg_targets_current.json | selectattr('name', 'eq', item.name) | list | length) == 1
    fail_msg: "{{ item.name }} target은 reconcile 전에 정확히 하나여야 한다."
  loop: >-
    {{ warpgate_targets | selectattr('state', 'defined') | selectattr('state', 'eq', 'present')
       | selectattr('reconcile', 'defined') | selectattr('reconcile', 'equalto', true) | list }}
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: 선언과 달라진 reconcile target options 갱신
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/targets/{{
        (wg_targets_current.json | selectattr('name', 'eq', item.name) | first).id }}
    method: PUT
    headers: "{{ wg_headers }}"
    body_format: json
    body: >-
      {{
        {
          'name': item.name,
          'description': item.description | default(''),
          'options': item.options
        }
      }}
    validate_certs: false
    status_code: 200
  changed_when: true
  loop: >-
    {{ warpgate_targets | selectattr('state', 'defined') | selectattr('state', 'eq', 'present')
       | selectattr('reconcile', 'defined') | selectattr('reconcile', 'equalto', true) | list }}
  loop_control:
    label: "{{ item.name }}"
  when: >-
    (wg_targets_current.json | selectattr('name', 'eq', item.name) | first).options
    != item.options
  no_log: true

- name: target 이름 → id 색인
  ansible.builtin.set_fact:
    wg_target_ids: "{{ dict(wg_targets_current.json | map(attribute='name') | zip(wg_targets_current.json | map(attribute='id'))) }}"

- name: target 별 허용 role 현황 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/targets/{{ wg_target_ids[item.name] }}/roles"
    headers: "{{ wg_headers }}"
    validate_certs: false
  loop: "{{ warpgate_targets | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: wg_target_roles_current
  check_mode: false

# 대상별 역할 제한: 선언한 role 만 해당 target 에 붙인다.
- name: target 에 허용 role 부여
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/targets/{{
        wg_target_ids[item.0.item.name] }}/roles/{{ wg_role_ids[item.1] }}
    method: POST
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 201, 409]
  changed_when: true
  loop: "{{ wg_target_roles_current.results | subelements('item.roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.name }} → {{ item.1 }}"
  when: item.1 not in (item.0.json | map(attribute='name') | list)

- name: target 의 선언 밖 role 제거
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/targets/{{
        wg_target_ids[item.0.item.name] }}/roles/{{ item.1.id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204, 404]
  changed_when: true
  loop: "{{ wg_target_roles_current.results | subelements('json', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.name }} ↛ {{ item.1.name }}"
  when: item.1.name not in (item.0.item.roles | default([]))

# --- user ------------------------------------------------------------------

- name: 현재 user 목록 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_users_current
  check_mode: false

- name: 선언한 user 생성
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body:
      username: "{{ item.name }}"
      description: "{{ item.description | default('') }}"
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ warpgate_users | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (wg_users_current.json | map(attribute='username') | list)

- name: 제거할 user 삭제
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        (wg_users_current.json | selectattr('username', 'eq', item.name) | first).id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204]
  changed_when: true
  loop: "{{ warpgate_users | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in (wg_users_current.json | map(attribute='username') | list)

- name: user 목록 재조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users"
    headers: "{{ wg_headers }}"
    validate_certs: false
  register: wg_users_current
  check_mode: false

- name: user 이름 → id 색인
  ansible.builtin.set_fact:
    wg_user_ids: "{{ dict(wg_users_current.json | map(attribute='username') | zip(wg_users_current.json | map(attribute='id'))) }}"

- name: user 이름 → 현재 정책 색인
  ansible.builtin.set_fact:
    wg_users_by_name: "{{ dict(wg_users_current.json | map(attribute='username') | zip(wg_users_current.json)) }}"
  no_log: true

- name: 선언한 native protocol credential policy 반영
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users/{{ wg_user_ids[item.name] }}"
    method: PUT
    headers: "{{ wg_headers }}"
    body_format: json
    body: >-
      {{
        {
          'username': item.name,
          'description': item.description | default(''),
          'credential_policy': item.credential_policy,
          'rate_limit_bytes_per_second': wg_users_by_name[item.name].rate_limit_bytes_per_second,
          'allowed_ip_ranges': wg_users_by_name[item.name].allowed_ip_ranges
        }
      }}
    validate_certs: false
    status_code: 200
  changed_when: true
  loop: >-
    {{ warpgate_users | selectattr('state', 'defined') | selectattr('state', 'eq', 'present')
       | selectattr('credential_policy', 'defined') | list }}
  loop_control:
    label: "{{ item.name }}"
  when: wg_users_by_name[item.name].credential_policy != item.credential_policy
  no_log: true

- name: 선언한 user 의 SSO credential 정확 일치
  ansible.builtin.include_tasks: user_sso_credentials.yml
  loop: >-
    {{ warpgate_users
       | selectattr('state', 'defined')
       | selectattr('state', 'eq', 'present')
       | selectattr('sso_credentials', 'defined')
       | list }}
  loop_control:
    loop_var: wg_managed_sso_user
    label: "{{ wg_managed_sso_user.name }}"

- name: user 별 기존 password credential 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users/{{ wg_user_ids[item.name] }}/credentials/passwords"
    headers: "{{ wg_headers }}"
    validate_certs: false
  loop: "{{ warpgate_users | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: wg_user_pw_current
  check_mode: false

# 자격증명은 없을 때만 만든다. 회전은 이 role 이 소유하지 않는다.
- name: user password credential 생성
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users/{{ wg_user_ids[item.item.name] }}/credentials/passwords"
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body:
      password: "{{ item.item.password }}"
    validate_certs: false
    status_code: [200, 201]
  changed_when: true
  loop: "{{ wg_user_pw_current.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.json | length == 0
    - item.item.password | default('') | length > 0
  no_log: true

- name: user 별 현재 role 조회
  ansible.builtin.uri:
    url: "{{ warpgate_api_base }}/@warpgate/admin/api/users/{{ wg_user_ids[item.name] }}/roles"
    headers: "{{ wg_headers }}"
    validate_certs: false
  loop: "{{ warpgate_users | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: wg_user_roles_current
  check_mode: false

- name: user 에 role 부여
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        wg_user_ids[item.0.item.name] }}/roles/{{ wg_role_ids[item.1] }}
    method: POST
    headers: "{{ wg_headers }}"
    body_format: json
    body: {}
    validate_certs: false
    status_code: [200, 201, 409]
  changed_when: true
  loop: "{{ wg_user_roles_current.results | subelements('item.roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.name }} → {{ item.1 }}"
  when: item.1 not in (item.0.json | map(attribute='name') | list)

# roles 키를 명시한 local/API user 만 direct assignment 를 정확히 관리한다.
# Keycloak SSO user 는 roles 키를 생략하고 로그인 시 groups mapping 이 동기화한다.
- name: user 의 선언 밖 direct role 제거
  ansible.builtin.uri:
    url: >-
      {{ warpgate_api_base }}/@warpgate/admin/api/users/{{
        wg_user_ids[item.0.item.name] }}/roles/{{ item.1.id }}
    method: DELETE
    headers: "{{ wg_headers }}"
    validate_certs: false
    status_code: [200, 204, 404]
  changed_when: true
  loop: "{{ wg_user_roles_current.results | subelements('json', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.item.name }} ↛ {{ item.1.name }}"
  when:
    - item.0.item.roles is defined
    - item.1.name not in item.0.item.roles
