---
# infra/ansible/roles/node_exporter_baseline/defaults/main.yml
# OBS-11: Proxmox·Linux VM node-exporter fleet 기준선.
#
# 버전과 checksum은 고정한다. `latest`나 미검증 설치 스크립트, curl|sh는 쓰지 않는다.
# k3s-01의 cpu·memory·disk·network·systemd는 기존 kube-prometheus-stack
# DaemonSet(v1.12.1, gitops/apps/obs/release-metadata.env, port 9100)을 재사용하므로
# 이 role의 대상이 아니다. 같은 upstream 버전을 이 role에서도 고정해 두 경로의
# node_exporter 버전을 맞춘다.
#
# OBS-13: 단, 그 DaemonSet은 non-root securityContext 때문에 filesystem collector만
# 실패한다(OBS-11이 기존 한계로 판정, 권한을 약화하지 않는다는 원칙상 확대하지 않음).
# root/PVC 사용률 경보를 위해 k3s-01에도 이 role을 별도 포트(9101, inventory의
# node_exporter_root_k3s01 그룹)로 한 번 더 적용해 filesystem 대표 시계열만 보완한다.
# DaemonSet의 port 9100·기존 collector는 바꾸지 않는다.

node_exporter_version: "1.12.1"
node_exporter_arch: "linux-amd64"
node_exporter_release_sha256: "b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63"

node_exporter_release_asset: "node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
node_exporter_release_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_release_asset }}"

node_exporter_cache_dir: "/var/cache/node_exporter"
node_exporter_binary_path: "/usr/local/bin/node_exporter-{{ node_exporter_version }}"
node_exporter_binary_link: "/usr/local/bin/node_exporter"

# 전용 서비스 계정. 로그인 셸을 주지 않는다.
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"

node_exporter_listen_port: 9100

# OBS-11 canary 판정 결과 (netbird-01, 2026-08-12):
# - systemd: node_systemd_units·socket_current/accepted/refused가 실제 유닛 상태를
#   반영하고 scrape_duration 22.8ms로 정지 기준 안이라 fleet 전체 기본값으로 확대한다.
# - processes: 이 role의 하드닝은 ProtectProc=invisible을 유지하므로(권한 약화 금지)
#   node_processes_pids=1처럼 node_exporter 자기 프로세스 1개만 보인다. 시스템 전체
#   프로세스 수를 반영하지 못해 미달로 판정하고 기본값에 넣지 않는다. Node Exporter
#   Full 대시보드의 processes collector 의존 패널(Processes Detailed States, PIDs
#   Number and Limit, Threads Number and Limit)은 gitops/tools/obs-11/normalize-dashboard.jq가
#   제거한다.
node_exporter_canary_collectors:
  - systemd
