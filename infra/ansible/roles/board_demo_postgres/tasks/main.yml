---
- name: BOARD-DEMO-01 PostgreSQL 입력을 검증한다
  ansible.builtin.assert:
    that:
      - pg_board_demo_password | length >= 24
      - pg_board_demo_database == 'board_demo'
      - pg_board_demo_role == 'board_demo_user'
    fail_msg: BOARD-DEMO-01은 저장소 밖 24자 이상 DB password와 고정 DB/role 이름이 필요하다.
  no_log: true

- name: BOARD-DEMO-01 login role을 최소권한으로 선언한다
  community.postgresql.postgresql_user:
    name: "{{ pg_board_demo_role }}"
    password: "{{ pg_board_demo_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOBYPASSRLS
    state: present
  become_user: postgres
  no_log: true
  when: not ansible_check_mode

- name: BOARD-DEMO-01 전용 database를 선언한다
  community.postgresql.postgresql_db:
    name: "{{ pg_board_demo_database }}"
    owner: "{{ pg_board_demo_role }}"
    state: present
  become_user: postgres
  when: not ansible_check_mode

- name: BOARD-DEMO-01 database live 존재 여부를 조회한다
  community.postgresql.postgresql_query:
    login_db: postgres
    query: "SELECT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'board_demo') AS present;"
  register: board_demo_database_live
  become_user: postgres
  check_mode: false
  changed_when: false

- name: PUBLIC의 BOARD-DEMO-01 database CONNECT 권한을 회수한다
  community.postgresql.postgresql_privs:
    login_db: postgres
    type: database
    objs: "{{ pg_board_demo_database }}"
    roles: PUBLIC
    privs: CONNECT
    state: absent
  become_user: postgres
  when: not ansible_check_mode or board_demo_database_live.query_result[0].present

- name: BOARD-DEMO-01 role에 자기 database CONNECT만 허용한다
  community.postgresql.postgresql_privs:
    login_db: postgres
    type: database
    objs: "{{ pg_board_demo_database }}"
    roles: "{{ pg_board_demo_role }}"
    privs: CONNECT
    state: present
  become_user: postgres
  when: not ansible_check_mode or board_demo_database_live.query_result[0].present

- name: BOARD-DEMO-01 public schema의 PUBLIC 권한을 회수한다
  community.postgresql.postgresql_privs:
    login_db: "{{ pg_board_demo_database }}"
    type: schema
    objs: public
    roles: PUBLIC
    privs: ALL
    state: absent
  become_user: postgres
  when: not ansible_check_mode or board_demo_database_live.query_result[0].present
