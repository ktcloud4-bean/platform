---

- name: SeaweedFS 배포 전제 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.distribution == 'Rocky'
      - ansible_facts.distribution_major_version == '9'
      - seaweedfs_version == '4.40'
      - seaweedfs_release_sha256 | length == 64
      - seaweedfs_license == 'Apache-2.0'
      - seaweedfs_s3_allowed_sources | length > 0
      - seaweedfs_s3_bind_address == ansible_default_ipv4.address
    fail_msg: Rocky Linux 9/amd64, 고정 release, license, bind 주소와 최소 source 입력을 확인한다.

- name: admin 콘솔 credential 형식 확인
  ansible.builtin.assert:
    that:
      - seaweedfs_admin_user | length > 0
      - seaweedfs_admin_password | length == 0 or seaweedfs_admin_password | length >= 16
    fail_msg: >-
      weed admin 자체 로그인을 켜려면 충분한 길이의 비밀번호가 필요하다.
      비워두면(기본값) 자체 로그인은 꺼지고 Pomerium `/platform-privileged`
      게이트에만 의존한다(S3-02-FIX-01: weed admin은 SSO를 지원하지 않아
      Keycloak 뒤에 자체 로그인을 이중으로 두면 사용자 경험만 나빠지고,
      계정 하나를 공유하는 로컬 로그인은 Pomerium의 사용자별 접근 로그보다
      추적성이 낮다).
  no_log: true

- name: S3 허용 source가 단일 host CIDR 형식인지 확인
  ansible.builtin.assert:
    that:
      - item is regex('^[0-9]{1,3}(\.[0-9]{1,3}){3}/32$')
    fail_msg: S3 source는 광범위 subnet이 아니라 검증한 소비자 /32 CIDR만 허용한다.
  loop: "{{ seaweedfs_s3_allowed_sources }}"

- name: S3 identity 입력의 비밀 아닌 구조 확인
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | length > 0
      - item.name not in ['anonymous', 'deny-all-bootstrap']
      - item.credentials is defined
      - item.credentials | length > 0
      - item.actions is defined
      - item.actions | length > 0
      - item.actions | reject('regex', '^(Admin|Read|List|Tagging|Write|Delete):[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$') | list | length == 0
    fail_msg: 각 S3 identity에는 name, credential과 제한된 action이 필요하다.
  loop: "{{ seaweedfs_s3_identities }}"
  no_log: true

- name: S3 credential 최소 형식 확인
  ansible.builtin.assert:
    that:
      - item.accessKey is defined
      - item.accessKey | length >= 16
      - item.secretKey is defined
      - item.secretKey | length >= 32
    fail_msg: S3 credential은 저장소 밖 입력의 accessKey와 충분한 길이의 secretKey가 필요하다.
  loop: "{{ seaweedfs_s3_identities | map(attribute='credentials') | flatten }}"
  no_log: true

- name: SeaweedFS 필수 패키지 설치
  ansible.builtin.dnf:
    name:
      - curl
      - gzip
      - openssl
      - policycoreutils-python-utils
      - tar
    state: present

- name: SeaweedFS system group 선언
  ansible.builtin.group:
    name: "{{ seaweedfs_group }}"
    system: true
    state: present

- name: SeaweedFS 비로그인 system user 선언
  ansible.builtin.user:
    name: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    home: "{{ seaweedfs_data_dir }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    password_lock: true
    state: present

- name: 초기 config directory 존재 여부 확인
  ansible.builtin.stat:
    path: "{{ seaweedfs_config_dir }}"
  register: seaweedfs_config_dir_before

- name: 초기 cache·license directory 존재 여부 확인
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ seaweedfs_cache_dir }}"
    - /usr/share/licenses/seaweedfs
  register: seaweedfs_support_dirs_before

- name: SeaweedFS persistent directory 선언
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ seaweedfs_cache_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_version }}", owner: root, group: root, mode: "0755" }
    - { path: "/usr/share/licenses/seaweedfs", owner: root, group: root, mode: "0755" }
    - { path: "{{ seaweedfs_config_dir }}", owner: root, group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_config_dir }}/tls", owner: root, group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_data_dir }}", owner: "{{ seaweedfs_user }}", group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_master_dir }}", owner: "{{ seaweedfs_user }}", group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_volume_dir }}", owner: "{{ seaweedfs_user }}", group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_filer_dir }}", owner: "{{ seaweedfs_user }}", group: "{{ seaweedfs_group }}", mode: "0750" }
    - { path: "{{ seaweedfs_admin_dir }}", owner: "{{ seaweedfs_user }}", group: "{{ seaweedfs_group }}", mode: "0750" }

- name: SeaweedFS release archive 기존 상태 확인
  ansible.builtin.stat:
    path: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_release_asset }}"
  register: seaweedfs_archive_before

- name: 고정 SeaweedFS release archive 다운로드와 SHA-256 강제
  ansible.builtin.get_url:
    url: "{{ seaweedfs_release_url }}"
    dest: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_release_asset }}"
    checksum: "sha256:{{ seaweedfs_release_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  register: seaweedfs_archive_download
  when: not ansible_check_mode or seaweedfs_support_dirs_before.results[0].stat.exists

- name: 고정 release archive 압축 해제
  ansible.builtin.unarchive:
    src: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_release_asset }}"
    dest: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_version }}"
    remote_src: true
    creates: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_version }}/weed"
  when: not ansible_check_mode or seaweedfs_archive_before.stat.exists

- name: 압축 해제한 weed binary 확인
  ansible.builtin.stat:
    path: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_version }}/weed"
  register: seaweedfs_extracted_binary

- name: weed binary 설치
  ansible.builtin.copy:
    src: "{{ seaweedfs_cache_dir }}/{{ seaweedfs_version }}/weed"
    dest: "{{ seaweedfs_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: SeaweedFS stack 재시작
  when: seaweedfs_extracted_binary.stat.exists

- name: Apache-2.0 license 원문 설치와 SHA-256 강제
  ansible.builtin.get_url:
    url: "{{ seaweedfs_license_url }}"
    dest: /usr/share/licenses/seaweedfs/LICENSE
    checksum: "sha256:{{ seaweedfs_license_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode or seaweedfs_support_dirs_before.results[1].stat.exists

- name: canonical guest hostname 선언
  ansible.builtin.hostname:
    name: "{{ seaweedfs_canonical_fqdn }}"
    use: systemd

- name: Rocky cloud-init hosts template 선언
  ansible.builtin.template:
    src: hosts.redhat.tmpl.j2
    dest: /etc/cloud/templates/hosts.redhat.tmpl
    owner: root
    group: root
    mode: "0644"

- name: 이전 minio canonical hosts 행 제거
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '(^|\s)minio-01(\.|\s)'
    state: absent

- name: 로컬 canonical·S3 alias 해석 선언
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ seaweedfs_s3_bind_address | regex_escape }}\s+'
    line: "{{ seaweedfs_s3_bind_address }} {{ seaweedfs_canonical_fqdn }} {{ seaweedfs_s3_fqdn }} object-01"
    state: present

- name: SeaweedFS SELinux local file-context 현재 선언 조회
  ansible.builtin.command:
    argv: [semanage, fcontext, -C, -l]
  register: seaweedfs_selinux_local_contexts
  changed_when: false
  check_mode: false

- name: SeaweedFS SELinux file-context 영속 선언
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - -a
      - -t
      - "{{ item.type }}"
      - "{{ item.target }}"
  loop:
    - { target: "/var/lib/seaweedfs(/.*)?", type: "var_lib_t" }
    - { target: "/etc/seaweedfs(/.*)?", type: "etc_t" }
    - { target: "/usr/local/bin/weed", type: "bin_t" }
  when:
    - not ansible_check_mode
    - item.target not in seaweedfs_selinux_local_contexts.stdout
  register: seaweedfs_selinux_context_add

- name: SeaweedFS 경로 SELinux label 적용
  ansible.builtin.command:
    argv: [restorecon, -RFv, "{{ item }}"]
  loop:
    - "{{ seaweedfs_data_dir }}"
    - "{{ seaweedfs_config_dir }}"
    - "{{ seaweedfs_binary_path }}"
  register: seaweedfs_restorecon
  changed_when: "'Relabeled' in seaweedfs_restorecon.stdout"
  when: not ansible_check_mode

- name: check mode에서 SeaweedFS SELinux label drift 조회
  ansible.builtin.command:
    argv: [restorecon, -nRFv, "{{ item }}"]
  loop:
    - "{{ seaweedfs_data_dir }}"
    - "{{ seaweedfs_config_dir }}"
    - "{{ seaweedfs_binary_path }}"
  register: seaweedfs_restorecon_check
  changed_when: seaweedfs_restorecon_check.stdout | length > 0
  failed_when: false
  when: ansible_check_mode

- name: TLS certificate·private key 현재 상태 확인
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ seaweedfs_tls_cert_path }}"
    - "{{ seaweedfs_tls_key_path }}"
  register: seaweedfs_tls_files

- name: 기존 TLS certificate 만료 여유 확인
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ seaweedfs_tls_cert_path }}"
      - -noout
      - -checkend
      - "{{ seaweedfs_tls_renew_before_seconds | string }}"
  register: seaweedfs_tls_checkend
  changed_when: false
  failed_when: false
  check_mode: false
  when: seaweedfs_tls_files.results[0].stat.exists

- name: 기존 TLS certificate SAN 확인
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ seaweedfs_tls_cert_path }}"
      - -noout
      - -ext
      - subjectAltName
  register: seaweedfs_tls_san
  changed_when: false
  failed_when: false
  check_mode: false
  when: seaweedfs_tls_files.results[0].stat.exists

- name: TLS certificate 재생성 필요 여부 계산
  ansible.builtin.set_fact:
    seaweedfs_tls_regenerate: >-
      {{
        (not seaweedfs_tls_files.results[0].stat.exists)
        or (not seaweedfs_tls_files.results[1].stat.exists)
        or ((seaweedfs_tls_checkend.rc | default(1)) != 0)
        or (seaweedfs_canonical_fqdn not in (seaweedfs_tls_san.stdout | default('')))
        or (seaweedfs_s3_fqdn not in (seaweedfs_tls_san.stdout | default('')))
        or (('IP Address:' ~ seaweedfs_s3_bind_address) not in (seaweedfs_tls_san.stdout | default('')))
      }}

- name: 불완전한 TLS 임시 파일 제거
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ seaweedfs_tls_cert_path }}.new"
    - "{{ seaweedfs_tls_key_path }}.new"
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode
  no_log: true

- name: host-specific bootstrap TLS leaf와 private key 생성
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -nodes
      - -days
      - "{{ seaweedfs_tls_valid_days | string }}"
      - -subj
      - "/CN={{ seaweedfs_canonical_fqdn }}"
      - -addext
      - "basicConstraints=critical,CA:FALSE"
      - -addext
      - "keyUsage=critical,digitalSignature,keyEncipherment"
      - -addext
      - "extendedKeyUsage=serverAuth"
      - -addext
      - "subjectAltName=DNS:{{ seaweedfs_canonical_fqdn }},DNS:{{ seaweedfs_s3_fqdn }},IP:{{ seaweedfs_s3_bind_address }}"
      - -keyout
      - "{{ seaweedfs_tls_key_path }}.new"
      - -out
      - "{{ seaweedfs_tls_cert_path }}.new"
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode
  no_log: true

- name: 새 TLS private key 권한 설정
  ansible.builtin.file:
    path: "{{ seaweedfs_tls_key_path }}.new"
    owner: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    mode: "0600"
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode
  no_log: true

- name: 새 TLS certificate 권한 설정
  ansible.builtin.file:
    path: "{{ seaweedfs_tls_cert_path }}.new"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0644"
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode

- name: 새 TLS private key 원자적 승격
  ansible.builtin.command:
    argv: [mv, "{{ seaweedfs_tls_key_path }}.new", "{{ seaweedfs_tls_key_path }}"]
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode
  no_log: true
  notify: SeaweedFS S3 재시작

- name: 새 TLS certificate 원자적 승격
  ansible.builtin.command:
    argv: [mv, "{{ seaweedfs_tls_cert_path }}.new", "{{ seaweedfs_tls_cert_path }}"]
  when:
    - seaweedfs_tls_regenerate | bool
    - not ansible_check_mode
  notify: SeaweedFS S3 재시작

- name: 최종 TLS private key 최소권한 선언
  ansible.builtin.file:
    path: "{{ seaweedfs_tls_key_path }}"
    owner: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    mode: "0600"
  when: not ansible_check_mode or seaweedfs_tls_files.results[1].stat.exists
  no_log: true

- name: 최종 TLS certificate 권한 선언
  ansible.builtin.file:
    path: "{{ seaweedfs_tls_cert_path }}"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0644"
  when: not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists

- name: admin TLS security.toml 선언
  ansible.builtin.template:
    src: security.toml.j2
    dest: "{{ seaweedfs_config_dir }}/security.toml"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0640"
  notify: SeaweedFS admin 재시작

- name: admin credential EnvironmentFile 선언
  ansible.builtin.template:
    src: admin.env.j2
    dest: "{{ seaweedfs_config_dir }}/admin.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: SeaweedFS admin 재시작

- name: S3 static identity configuration 선언
  ansible.builtin.template:
    src: s3.json.j2
    dest: "{{ seaweedfs_config_dir }}/s3.json"
    owner: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    mode: "0600"
  no_log: true
  notify: SeaweedFS S3 재시작
  when: not ansible_check_mode or seaweedfs_config_dir_before.stat.exists

- name: SeaweedFS systemd unit 선언
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: "0644"
  loop:
    - seaweedfs-master
    - seaweedfs-volume
    - seaweedfs-filer
    - seaweedfs-s3
    - seaweedfs-admin
  notify: SeaweedFS stack 재시작

- name: 설치된 weed binary 상태 확인
  ansible.builtin.stat:
    path: "{{ seaweedfs_binary_path }}"
  register: seaweedfs_binary_after

- name: SeaweedFS 다섯 구성요소 enabled·started 선언
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - seaweedfs-master
    - seaweedfs-volume
    - seaweedfs-filer
    - seaweedfs-s3
    - seaweedfs-admin
  when: not ansible_check_mode

- name: 변경 handler 적용
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: 설치된 SeaweedFS version 확인
  ansible.builtin.command:
    argv: ["{{ seaweedfs_binary_path }}", version]
  register: seaweedfs_version_output
  changed_when: false
  check_mode: false
  when: seaweedfs_binary_after.stat.exists

- name: 고정 SeaweedFS version 검증
  ansible.builtin.assert:
    that:
      - seaweedfs_version in seaweedfs_version_output.stdout
    fail_msg: 설치된 weed binary가 고정한 release와 다르다.
  when: seaweedfs_binary_after.stat.exists

- name: S3 JSON 문법 검증
  ansible.builtin.command:
    argv: [python3, -m, json.tool, "{{ seaweedfs_config_dir }}/s3.json"]
  changed_when: false
  no_log: true
  check_mode: false
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_config_dir_before.stat.exists

- name: SeaweedFS 다섯 구성요소 active 상태 확인
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}.service"]
  loop:
    - seaweedfs-master
    - seaweedfs-volume
    - seaweedfs-filer
    - seaweedfs-s3
    - seaweedfs-admin
  register: seaweedfs_active_units
  changed_when: false
  check_mode: false
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists

- name: SeaweedFS listener 경계 확인
  ansible.builtin.command:
    argv: [ss, -H, -lnt]
  register: seaweedfs_listeners
  changed_when: false
  check_mode: false
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists

- name: 내부 endpoint loopback과 외부 TLS S3·admin bind 검증
  ansible.builtin.assert:
    that:
      - "('127.0.0.1:' ~ seaweedfs_master_port) in seaweedfs_listeners.stdout"
      - "('127.0.0.1:' ~ seaweedfs_volume_port) in seaweedfs_listeners.stdout"
      - "('127.0.0.1:' ~ seaweedfs_filer_port) in seaweedfs_listeners.stdout"
      - "(seaweedfs_s3_bind_address ~ ':' ~ seaweedfs_s3_port) in seaweedfs_listeners.stdout"
      - "('*:' ~ seaweedfs_admin_port) in seaweedfs_listeners.stdout"
      - "('0.0.0.0:' ~ seaweedfs_master_port) not in seaweedfs_listeners.stdout"
      - "('0.0.0.0:' ~ seaweedfs_volume_port) not in seaweedfs_listeners.stdout"
      - "('0.0.0.0:' ~ seaweedfs_filer_port) not in seaweedfs_listeners.stdout"
    fail_msg: >-
      master·volume·filer는 loopback 전용이어야 한다. admin은 -ip.bind 옵션이
      없어 항상 0.0.0.0으로 듣지만 k3s-01만 systemd IPAddressAllow·OPNsense
      PF로 허용하고, S3는 DATA 주소의 TLS port에 있어야 한다.
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists

- name: hostname 검증이 적용된 TLS S3 무인증 응답 확인
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - --cacert
      - "{{ seaweedfs_tls_cert_path }}"
      - --resolve
      - "{{ seaweedfs_s3_fqdn }}:{{ seaweedfs_s3_port }}:{{ seaweedfs_s3_bind_address }}"
      - "https://{{ seaweedfs_s3_fqdn }}:{{ seaweedfs_s3_port }}/"
  register: seaweedfs_tls_probe
  changed_when: false
  check_mode: false
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists

- name: 무자격 S3 접근 거부 확인
  ansible.builtin.assert:
    that:
      - seaweedfs_tls_probe.stdout == '403'
    fail_msg: TLS 검증은 성공하되 credential 없는 S3 요청은 HTTP 403이어야 한다.
  when:
    - seaweedfs_binary_after.stat.exists
    - not ansible_check_mode or seaweedfs_tls_files.results[0].stat.exists
