---
# infra/ansible/roles/postgres_baseline/tasks/main.yml
# PostgreSQL 16 baseline installation and hardening

- name: WG-04 입력 검증 — Warpgate 전용 운영 role
  ansible.builtin.assert:
    that:
      - postgres_warpgate_source_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - postgres_warpgate_role is match('^[a-z][a-z0-9_]{0,62}$')
      - postgres_warpgate_database is match('^[a-z][a-z0-9_]{0,62}$')
      - pg_warpgate_ops_password | length >= 32
    fail_msg: >-
      WG-04에는 단일 IPv4 relay source, 안전한 role/database 식별자와 저장소 밖의
      32자 이상 pg_warpgate_ops_password가 필요하다.
  when: postgres_warpgate_session_enabled | bool
  no_log: true

- name: Enable PostgreSQL 16 DNF stream module
  ansible.builtin.dnf:
    name: "@postgresql:16"
    state: present

- name: Install PostgreSQL 16 server, contrib, python3-psycopg2 and openssl
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - postgresql-contrib
      - python3-psycopg2
      - openssl
    state: present

- name: Check if PostgreSQL PGDATA is initialized
  ansible.builtin.stat:
    path: "{{ postgres_data_dir }}/PG_VERSION"
  register: pgdata_version

- name: Initialize PostgreSQL database cluster
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
  when: not pgdata_version.stat.exists and not ansible_check_mode

- name: Check PostgreSQL server leaf TLS private key
  ansible.builtin.stat:
    path: "{{ postgres_tls_leaf_key_path }}"
  register: pg_tls_leaf_key

- name: Check PostgreSQL bootstrap CA private key
  ansible.builtin.stat:
    path: "{{ postgres_tls_ca_key_path }}"
  register: pg_tls_ca_key

- name: WG-04 legacy PostgreSQL TLS certificate CA property read
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ postgres_tls_leaf_cert_path }}"
      - -noout
      - -text
  register: pg_tls_legacy_certificate
  changed_when: false
  check_mode: false
  when:
    - postgres_tls_migrate_legacy_ca_leaf | bool
    - pg_tls_leaf_key.stat.exists

- name: WG-04 legacy certificate must be a CA before migration
  ansible.builtin.assert:
    that:
      - pg_tls_legacy_certificate.stdout is search('CA:TRUE')
    fail_msg: >-
      기존 PostgreSQL TLS leaf가 CA:TRUE bootstrap certificate가 아니므로 WG-04
      migration을 적용할 수 없습니다. 실제 certificate chain을 별도로 판정해야 합니다.
  when:
    - postgres_tls_migrate_legacy_ca_leaf | bool
    - pg_tls_leaf_key.stat.exists
    - not pg_tls_ca_key.stat.exists

- name: Determine whether current PostgreSQL server certificate is a legacy CA leaf
  ansible.builtin.set_fact:
    pg_tls_legacy_leaf_is_ca: >-
      {{ postgres_tls_migrate_legacy_ca_leaf | bool
         and (pg_tls_legacy_certificate.stdout | default('') is search('CA:TRUE')) }}
  no_log: true

- name: Generate dedicated PostgreSQL bootstrap CA for a new cluster
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -keyout
      - "{{ postgres_tls_ca_key_path }}"
      - -out
      - "{{ postgres_tls_ca_cert_path }}"
      - -days
      - "{{ postgres_tls_ca_days | string }}"
      - -nodes
      - -subj
      - "/CN={{ postgres_tls_ca_common_name }}"
      - -addext
      - "basicConstraints=critical,CA:TRUE"
      - -addext
      - "keyUsage=critical,keyCertSign,cRLSign"
  when:
    - not pg_tls_leaf_key.stat.exists
    - not pg_tls_ca_key.stat.exists
    - not ansible_check_mode
  no_log: true

- name: WG-04 existing bootstrap CA certificate preserve
  ansible.builtin.copy:
    src: "{{ postgres_tls_leaf_cert_path }}"
    dest: "{{ postgres_tls_ca_cert_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - postgres_tls_migrate_legacy_ca_leaf | bool
    - pg_tls_leaf_key.stat.exists
    - not pg_tls_ca_key.stat.exists
    - not ansible_check_mode

- name: WG-04 existing bootstrap CA private key preserve
  ansible.builtin.copy:
    src: "{{ postgres_tls_leaf_key_path }}"
    dest: "{{ postgres_tls_ca_key_path }}"
    remote_src: true
    owner: postgres
    group: postgres
    mode: "0600"
  when:
    - postgres_tls_migrate_legacy_ca_leaf | bool
    - pg_tls_leaf_key.stat.exists
    - not pg_tls_ca_key.stat.exists
    - not ansible_check_mode
  no_log: true

# BKP-06: root:root였을 때 pg_basebackup(BKP-03)이 PGDATA 전체를 읽다가 이 파일에서
# Permission denied로 죽었다. 이 CA는 postgres-01 자신만을 위한 self-signed
# 단일 호스트 CA(다른 host/service와 공유하지 않음)라 postgres OS 계정에 읽기를
# 주는 것이 server.key를 이미 그 계정에 맡기는 것과 같은 신뢰 경계다. 위 마이그레이션
# task는 파일이 없을 때만 한 번 실행되므로, 이미 존재하는 환경도 계속 맞는 소유자를
# 갖도록 별도로 강제한다.
- name: CA private key 소유자 강제(BKP-03 pg_basebackup이 읽을 수 있도록)
  ansible.builtin.file:
    path: "{{ postgres_tls_ca_key_path }}"
    owner: postgres
    group: postgres
    mode: "0600"
  when: pg_tls_ca_key.stat.exists or postgres_tls_migrate_legacy_ca_leaf | bool

- name: Determine whether a PostgreSQL server leaf must be issued
  ansible.builtin.set_fact:
    pg_tls_issue_leaf: >-
      {{ (not pg_tls_leaf_key.stat.exists and not pg_tls_ca_key.stat.exists)
         or (pg_tls_legacy_leaf_is_ca | bool) }}
  no_log: true

- name: Check PostgreSQL leaf staging paths before issuing
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgres_tls_leaf_key_path }}.next"
    - "{{ postgres_tls_leaf_cert_path }}.next"
    - "{{ postgres_data_dir }}/server-leaf.csr"
    - "{{ postgres_data_dir }}/server-leaf.ext"
  register: pg_tls_staging_paths
  when: pg_tls_issue_leaf | bool

- name: Refuse to overwrite PostgreSQL TLS staging material
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      PostgreSQL TLS staging file {{ item.item }} already exists. 기존 leaf와 key를
      덮어쓰지 않고 원인과 rollback 상태를 먼저 판정해야 합니다.
  loop: "{{ pg_tls_staging_paths.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: pg_tls_issue_leaf | bool

- name: Render PostgreSQL server leaf certificate extensions
  ansible.builtin.copy:
    content: |
      basicConstraints=critical,CA:FALSE
      keyUsage=critical,digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=DNS:{{ postgres_canonical_fqdn }},IP:{{ postgres_data_ip }}
    dest: "{{ postgres_data_dir }}/server-leaf.ext"
    owner: root
    group: root
    mode: "0600"
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode

- name: Generate PostgreSQL server leaf private key and CSR
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -newkey
      - rsa:4096
      - -nodes
      - -keyout
      - "{{ postgres_tls_leaf_key_path }}.next"
      - -out
      - "{{ postgres_data_dir }}/server-leaf.csr"
      - -subj
      - "/CN={{ postgres_canonical_fqdn }}"
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode
  no_log: true

- name: Sign PostgreSQL server leaf with bootstrap CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - "{{ postgres_data_dir }}/server-leaf.csr"
      - -CA
      - "{{ postgres_tls_ca_cert_path }}"
      - -CAkey
      - "{{ postgres_tls_ca_key_path }}"
      - -CAcreateserial
      - -CAserial
      - "{{ postgres_data_dir }}/server-ca.srl"
      - -out
      - "{{ postgres_tls_leaf_cert_path }}.next"
      - -days
      - "{{ postgres_tls_leaf_days | string }}"
      - -sha256
      - -extfile
      - "{{ postgres_data_dir }}/server-leaf.ext"
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode
  no_log: true

- name: Verify staged PostgreSQL leaf chain and hostname
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ postgres_tls_ca_cert_path }}"
      - -verify_hostname
      - "{{ postgres_canonical_fqdn }}"
      - "{{ postgres_tls_leaf_cert_path }}.next"
  changed_when: false
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode

- name: Verify staged PostgreSQL leaf is not a CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ postgres_tls_leaf_cert_path }}.next"
      - -noout
      - -text
  register: pg_tls_staged_leaf
  changed_when: false
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode

- name: Assert staged PostgreSQL leaf CA constraint
  ansible.builtin.assert:
    that:
      - pg_tls_staged_leaf.stdout is search('CA:FALSE')
    fail_msg: PostgreSQL server leaf는 CA:FALSE여야 합니다.
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode

- name: Activate staged PostgreSQL server leaf without replacing trust anchor
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - >-
        set -euo pipefail;
        mv "{{ postgres_tls_leaf_key_path }}.next" "{{ postgres_tls_leaf_key_path }}";
        mv "{{ postgres_tls_leaf_cert_path }}.next" "{{ postgres_tls_leaf_cert_path }}";
        chown postgres:postgres "{{ postgres_tls_leaf_key_path }}" "{{ postgres_tls_leaf_cert_path }}";
        chmod 0600 "{{ postgres_tls_leaf_key_path }}";
        chmod 0644 "{{ postgres_tls_leaf_cert_path }}";
        rm -f "{{ postgres_data_dir }}/server-leaf.csr" "{{ postgres_data_dir }}/server-leaf.ext"
  when:
    - pg_tls_issue_leaf | bool
    - not ansible_check_mode
  notify: reload postgresql
  no_log: true

- name: Ensure correct permissions on TLS key file
  ansible.builtin.file:
    path: "{{ postgres_tls_leaf_key_path }}"
    owner: postgres
    group: postgres
    mode: "0600"
  when: pg_tls_leaf_key.stat.exists or pg_tls_issue_leaf | bool

- name: Ensure correct permissions on TLS certificate file
  ansible.builtin.file:
    path: "{{ postgres_tls_leaf_cert_path }}"
    owner: postgres
    group: postgres
    mode: "0644"
  when: pg_tls_leaf_key.stat.exists or pg_tls_issue_leaf | bool

- name: Check PostgreSQL bootstrap CA certificate after TLS setup
  ansible.builtin.stat:
    path: "{{ postgres_tls_ca_cert_path }}"
  register: pg_tls_ca_cert_after

- name: Deploy public copy of PostgreSQL bootstrap CA for client trust
  ansible.builtin.copy:
    src: >-
      {{ postgres_tls_ca_cert_path if pg_tls_ca_cert_after.stat.exists else postgres_tls_leaf_cert_path }}
    dest: "/etc/pki/tls/certs/postgres-01-bootstrap.crt"
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Ensure postgres-01.imcherry5778.xyz points to 10.10.50.10 in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "10.10.50.10 {{ postgres_canonical_fqdn }} postgres-01"
    regexp: ".*{{ postgres_canonical_fqdn }}.*"
    state: present

- name: Configure listen_addresses in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    regexp: "^#?listen_addresses\\s*=.*"
    line: "listen_addresses = '{{ postgres_listen_addresses }}'"
  notify: reload postgresql

- name: Configure ssl in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    regexp: "^#?ssl\\s*=.*"
    line: "ssl = on"
  notify: reload postgresql

- name: Configure ssl_cert_file in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    regexp: "^#?ssl_cert_file\\s*=.*"
    line: "ssl_cert_file = 'server.crt'"
  notify: reload postgresql

- name: Configure ssl_key_file in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    regexp: "^#?ssl_key_file\\s*=.*"
    line: "ssl_key_file = 'server.key'"
  notify: reload postgresql

- name: Configure password_encryption in postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgres_data_dir }}/postgresql.conf"
    regexp: "^#?password_encryption\\s*=.*"
    line: "password_encryption = 'scram-sha-256'"
  notify: reload postgresql

- name: Deploy pg_hba.conf configuration
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: reload postgresql

- name: Ensure postgresql service is enabled and running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Create keycloak_user service role with minimal privileges
  community.postgresql.postgresql_user:
    name: keycloak_user
    password: "{{ pg_keycloak_password }}"
    role_attr_flags: "NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION"
    state: present
  no_log: true
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - pg_keycloak_password | length > 0

- name: Create verify_user service role with minimal privileges
  community.postgresql.postgresql_user:
    name: verify_user
    password: "{{ pg_verify_password }}"
    role_attr_flags: "NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION"
    state: present
  no_log: true
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - pg_verify_password | length > 0

- name: Create gitea_user service role with minimal privileges
  community.postgresql.postgresql_user:
    name: gitea_user
    password: "{{ pg_gitea_password }}"
    role_attr_flags: "NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION"
    state: present
  no_log: true
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - pg_gitea_password | length > 0

- name: Create Warpgate PostgreSQL operator role with no administrative attributes
  community.postgresql.postgresql_user:
    name: "{{ postgres_warpgate_role }}"
    password: "{{ pg_warpgate_ops_password }}"
    role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,NOINHERIT,NOBYPASSRLS"
    state: present
  no_log: true
  become: true
  become_user: postgres
  when:
    - postgres_warpgate_session_enabled | bool
    - not ansible_check_mode

- name: Create keycloak database owned by keycloak_user
  community.postgresql.postgresql_db:
    name: keycloak
    owner: keycloak_user
    state: present
  become: true
  become_user: postgres
  when: not ansible_check_mode

- name: Create verify_db database owned by verify_user
  community.postgresql.postgresql_db:
    name: verify_db
    owner: verify_user
    state: present
  become: true
  become_user: postgres
  when: not ansible_check_mode

- name: Create gitea database owned by gitea_user
  community.postgresql.postgresql_db:
    name: gitea
    owner: gitea_user
    state: present
  become: true
  become_user: postgres
  when:
    - not ansible_check_mode
    - pg_gitea_password | length > 0

- name: Revoke CONNECT from PUBLIC on keycloak database
  community.postgresql.postgresql_query:
    db: postgres
    query: "REVOKE CONNECT ON DATABASE keycloak FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Revoke CONNECT from PUBLIC on verify_db database
  community.postgresql.postgresql_query:
    db: postgres
    query: "REVOKE CONNECT ON DATABASE verify_db FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Revoke CONNECT from PUBLIC on gitea database
  community.postgresql.postgresql_query:
    db: postgres
    query: "REVOKE CONNECT ON DATABASE gitea FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when:
    - not ansible_check_mode
    - pg_gitea_password | length > 0

- name: Grant CONNECT on keycloak database to keycloak_user
  community.postgresql.postgresql_query:
    db: postgres
    query: "GRANT CONNECT ON DATABASE keycloak TO keycloak_user;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Grant CONNECT on verify_db database to verify_user
  community.postgresql.postgresql_query:
    db: postgres
    query: "GRANT CONNECT ON DATABASE verify_db TO verify_user;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Grant CONNECT on gitea database to gitea_user
  community.postgresql.postgresql_query:
    db: postgres
    query: "GRANT CONNECT ON DATABASE gitea TO gitea_user;"
  become: true
  become_user: postgres
  changed_when: false
  when:
    - not ansible_check_mode
    - pg_gitea_password | length > 0

- name: Grant pg_monitor and CONNECT only to the Warpgate operator role
  community.postgresql.postgresql_query:
    db: postgres
    query: >-
      GRANT pg_monitor TO {{ postgres_warpgate_role }};
      GRANT CONNECT ON DATABASE {{ postgres_warpgate_database }} TO {{ postgres_warpgate_role }};
      REVOKE pg_read_all_data, pg_write_all_data, pg_database_owner, pg_signal_backend
      FROM {{ postgres_warpgate_role }};
  become: true
  become_user: postgres
  changed_when: false
  when:
    - postgres_warpgate_session_enabled | bool
    - not ansible_check_mode

- name: Revoke ALL on schema public from PUBLIC in keycloak database
  community.postgresql.postgresql_query:
    db: keycloak
    query: "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Revoke ALL on schema public from PUBLIC in verify_db database
  community.postgresql.postgresql_query:
    db: verify_db
    query: "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode

- name: Revoke ALL on schema public from PUBLIC in gitea database
  community.postgresql.postgresql_query:
    db: gitea
    query: "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when:
    - not ansible_check_mode
    - pg_gitea_password | length > 0

- name: Revoke ALL on schema public from PUBLIC in postgres database
  community.postgresql.postgresql_query:
    db: postgres
    query: "REVOKE ALL ON SCHEMA public FROM PUBLIC;"
  become: true
  become_user: postgres
  changed_when: false
  when: not ansible_check_mode
