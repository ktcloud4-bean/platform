---

- name: NetBird native backup 대상과 경계 확인
  ansible.builtin.assert:
    that:
      - ansible_facts.hostname == 'netbird-01'
      - bkp03_backup_kind == 'netbird'
      - bkp03_s3_bucket == 'bkp-08-netbird'
    fail_msg: netbird-01과 전용 bucket을 확인한다.

- name: NetBird systemd service active 확인
  ansible.builtin.command:
    argv: [systemctl, is-active, netbird-compose.service]
  register: netbird_backup_service_active
  changed_when: false
  check_mode: false

- name: NetBird 서비스 active 상태 판정
  ansible.builtin.assert:
    that:
      - netbird_backup_service_active.stdout == 'active'
    fail_msg: netbird-compose.service가 실행 중이어야 한다.

- name: 로컬 백업 디렉터리 선언
  ansible.builtin.file:
    path: "{{ bkp08_netbird_local_backup_dir }}"
    state: directory
    owner: "{{ bkp03_backup_user }}"
    group: "{{ bkp03_backup_group }}"
    mode: "0750"

- name: NetBird 데이터 및 설정 디렉터리에 backup 사용자 읽기 ACL 적용
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      setfacl -R -m u:{{ bkp03_backup_user }}:rX /var/lib/netbird /etc/netbird
      setfacl -R -d -m u:{{ bkp03_backup_user }}:rX /var/lib/netbird /etc/netbird
      setfacl -m u:{{ bkp03_backup_user }}:r /etc/systemd/system/netbird-compose.service
    executable: /bin/bash
  register: netbird_backup_setfacl
  changed_when: false
  when: not ansible_check_mode

- name: NetBird native backup·격리 restore 스크립트 선언
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: netbird-native-backup.sh.j2
      dest: /usr/local/libexec/netbird-native-backup.sh
      group: "{{ bkp03_backup_group }}"
      mode: "0750"
    - src: netbird-native-restore-verify.sh.j2
      dest: /usr/local/sbin/netbird-native-restore-verify
      group: root
      mode: "0750"

- name: NetBird native backup systemd unit 선언
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - netbird-native-backup.service
    - netbird-native-backup.timer
    - netbird-native-restore-verify.service
  notify: NetBird native backup systemd 재적재

- name: NetBird native backup executable SELinux 기본 label 적용
  ansible.builtin.command:
    argv: [restorecon, -Fv, "{{ item }}"]
  loop:
    - /usr/local/libexec/netbird-native-backup.sh
    - /usr/local/sbin/netbird-native-restore-verify
  register: netbird_backup_restorecon
  changed_when: "'Relabeled' in netbird_backup_restorecon.stdout"
  when: not ansible_check_mode

- name: NetBird native backup systemd handler 반영
  ansible.builtin.meta: flush_handlers

- name: NetBird native backup timer 활성화
  ansible.builtin.systemd:
    name: netbird-native-backup.timer
    enabled: true
    state: started
  when: not ansible_check_mode
