---

- name: BKP-03/08 공통 입력 확인
  ansible.builtin.assert:
    that:
      - bkp03_backup_kind in ['postgres', 'vault', 'netbird', 'warpgate']
      - bkp03_backup_user | length > 0
      - bkp03_service_name | length > 0
      - bkp03_s3_bucket is regex('^bkp-(03|08)-(postgres|vault|netbird|warpgate)$')
      - bkp03_s3_access_key | length >= 16
      - bkp03_s3_secret_key | length >= 32
      - bkp03_s3_ca_b64 | length > 0
      - bkp03_retention_count | int >= 2
      - bkp03_backup_ip_allow | length > 0
      - bkp03_rclone_version == '1.74.4'
      - bkp03_rclone_sha256 | length == 64
    fail_msg: BKP-03/08 전용 identity, bucket, CA, 고정 rclone 입력과 허용 주소를 확인한다.
  no_log: true

- name: BKP-03/08 필수 패키지 설치
  ansible.builtin.dnf:
    name:
      - acl
      - coreutils
      - curl
      - gzip
      - openssl
      - sqlite
      - tar
      - unzip
    state: present

- name: BKP-03 전용 system group 선언
  ansible.builtin.group:
    name: "{{ bkp03_backup_group }}"
    system: true
    state: present

- name: BKP-03 전용 비로그인 system user 선언
  ansible.builtin.user:
    name: "{{ bkp03_backup_user }}"
    group: "{{ bkp03_backup_group }}"
    home: "{{ bkp03_state_dir }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    password_lock: true
    state: present

- name: BKP-03 공통 디렉터리 선언
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bkp03_config_dir }}", owner: root, group: "{{ bkp03_backup_group }}", mode: "0750" }
    - { path: "{{ bkp03_state_dir }}", owner: "{{ bkp03_backup_user }}", group: "{{ bkp03_backup_group }}", mode: "0700" }
    - { path: "{{ bkp03_cache_dir }}", owner: "{{ bkp03_backup_user }}", group: "{{ bkp03_backup_group }}", mode: "0700" }
    - { path: "{{ bkp03_cache_dir }}/download", owner: root, group: root, mode: "0755" }
    - { path: /usr/share/licenses/rclone, owner: root, group: root, mode: "0755" }
    - { path: /usr/local/libexec, owner: root, group: root, mode: "0755" }

- name: 고정 rclone archive 다운로드와 SHA-256 강제
  ansible.builtin.get_url:
    url: "{{ bkp03_rclone_url }}"
    dest: "{{ bkp03_cache_dir }}/download/{{ bkp03_rclone_archive }}"
    checksum: "sha256:{{ bkp03_rclone_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: 고정 rclone archive 압축 해제
  ansible.builtin.unarchive:
    src: "{{ bkp03_cache_dir }}/download/{{ bkp03_rclone_archive }}"
    dest: "{{ bkp03_cache_dir }}/download"
    remote_src: true
    creates: "{{ bkp03_cache_dir }}/download/rclone-v{{ bkp03_rclone_version }}-linux-amd64/rclone"
  when: not ansible_check_mode

- name: 압축 해제한 rclone 확인
  ansible.builtin.stat:
    path: "{{ bkp03_cache_dir }}/download/rclone-v{{ bkp03_rclone_version }}-linux-amd64/rclone"
  register: bkp03_rclone_extracted

- name: 고정 rclone binary 설치
  ansible.builtin.copy:
    src: "{{ bkp03_cache_dir }}/download/rclone-v{{ bkp03_rclone_version }}-linux-amd64/rclone"
    dest: "{{ bkp03_rclone_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: bkp03_rclone_extracted.stat.exists

- name: rclone MIT license 설치와 SHA-256 강제
  ansible.builtin.get_url:
    url: "{{ bkp03_rclone_license_url }}"
    dest: /usr/share/licenses/rclone/COPYING
    checksum: "sha256:{{ bkp03_rclone_license_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: 인증된 SeaweedFS S3 public certificate 배치
  ansible.builtin.copy:
    content: "{{ bkp03_s3_ca_b64 | b64decode }}"
    dest: "{{ bkp03_s3_ca_path }}"
    owner: root
    group: "{{ bkp03_backup_group }}"
    mode: "0644"

- name: BKP-03 S3 설정과 자격증명 선언
  ansible.builtin.template:
    src: s3.env.j2
    dest: "{{ bkp03_config_dir }}/s3.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: 의도적으로 빈 rclone 설정 파일 선언
  ansible.builtin.copy:
    content: |
      # remote는 systemd EnvironmentFile의 RCLONE_CONFIG_* 변수로만 정의한다.
    dest: "{{ bkp03_config_dir }}/rclone.conf"
    owner: root
    group: "{{ bkp03_backup_group }}"
    mode: "0640"

- name: BKP-03 공통 실패·freshness 검사 스크립트 선언
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/libexec/{{ bkp03_service_name }}-{{ item }}"
    owner: root
    group: "{{ bkp03_backup_group }}"
    mode: "0750"
  loop:
    - failure-marker.sh
    - health-check.sh

- name: BKP-03 공통 failure template systemd unit 선언
  ansible.builtin.template:
    src: failure.service.j2
    dest: "/etc/systemd/system/{{ bkp03_service_name }}-failure@.service"
    owner: root
    group: root
    mode: "0644"
  notify: BKP-03 systemd 재적재

- name: BKP-03 공통 health systemd unit 선언
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ bkp03_service_name }}-{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - health.service
    - health.timer
  notify: BKP-03 systemd 재적재

- name: BKP-03 executable SELinux 기본 label 적용
  ansible.builtin.command:
    argv: [restorecon, -Fv, "{{ item }}"]
  loop:
    - "{{ bkp03_rclone_path }}"
    - "/usr/local/libexec/{{ bkp03_service_name }}-failure-marker.sh"
    - "/usr/local/libexec/{{ bkp03_service_name }}-health-check.sh"
  register: bkp03_common_restorecon
  changed_when: "'Relabeled' in bkp03_common_restorecon.stdout"
  when: not ansible_check_mode

- name: 대기 중인 BKP-03 systemd handler 반영
  ansible.builtin.meta: flush_handlers

- name: BKP-03 freshness timer 활성화
  ansible.builtin.systemd:
    name: "{{ bkp03_service_name }}-health.timer"
    enabled: true
    state: started
  when: not ansible_check_mode

- name: 설치한 rclone version 확인
  ansible.builtin.command:
    argv: ["{{ bkp03_rclone_path }}", version, --check=false]
  register: bkp03_rclone_version_output
  changed_when: false
  check_mode: false
  when: bkp03_rclone_extracted.stat.exists

- name: 고정한 rclone version 검증
  ansible.builtin.assert:
    that:
      - "'rclone v' + bkp03_rclone_version in bkp03_rclone_version_output.stdout"
    fail_msg: 설치된 rclone version이 BKP-03 고정값과 다르다.
  when: bkp03_rclone_extracted.stat.exists
