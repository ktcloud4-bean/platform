---
# ==============================================================================
# infra/ansible/roles/common_baseline/tasks/main.yml
# Rocky Linux 9 공통 baseline 역할
#
# 읽기 전용 조회 태스크에는 check_mode: false 를 둔다. --check 에서도 실제로
# 조회해야 뒤따르는 assert 와 when 조건이 의미를 가진다. changed_when: false 이므로
# 이 태스크들은 변경으로 집계되지 않는다.
# ==============================================================================

- name: 1. 현재 Timezone 조회
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: current_tz
  changed_when: false
  check_mode: false

# timedatectl 은 /etc/localtime 심볼릭 링크에서 timezone 을 읽는다. 링크를 직접
# 선언하면 같은 결과를 얻으면서 --check 가 변경을 정확히 예고한다.
#
# `timedatectl set-timezone` 은 쓰지 않는다. 그 명령은 polkit 의
# org.freedesktop.timedate1.set-timezone (auth_admin_keep) 을 지나므로 인증
# agent 가 없는 비대화형 sudo 에서 "Failed to set time zone: Access denied" 로
# 실패한다. 실제 VM 5대에서 확인했다.
- name: 1.1. Timezone을 Asia/Seoul로 설정
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ system_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  register: timezone_link

- name: 1.1.1. systemd-timedated timezone cache 새로고침
  ansible.builtin.systemd:
    name: systemd-timedated.service
    state: restarted
  when:
    - not ansible_check_mode
    - timezone_link.changed or current_tz.stdout != system_timezone

- name: 1.2. 적용된 Timezone 재확인
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: applied_tz
  changed_when: false
  check_mode: false

- name: 1.3. Timezone 이 목표값인지 검증
  ansible.builtin.assert:
    that:
      - applied_tz.stdout == system_timezone
    fail_msg: "timezone 이 {{ system_timezone }} 이 아니다: {{ applied_tz.stdout }}"
  when: not ansible_check_mode

- name: 2. 필수 패키지 (cloud-init, qemu-guest-agent, chrony) 설치
  ansible.builtin.dnf:
    name:
      - cloud-init
      - qemu-guest-agent
      - chrony
    state: present

- name: 3. qemu-guest-agent 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# --- 시간 동기화 -------------------------------------------------------------
# NET-03 은 공개 NTP 를 차단하고 해당 VLAN gateway 의 UDP 123 만 허용한다.
# 배포판 기본 설정의 공개 pool 을 그대로 두면 chronyd 가 동기화되지 않는다.
# 주소는 이 저장소에 고정하지 않고 defaults/main.yml 의 chrony_ntp_server 로 받는다.

- name: 4. chrony source 디렉터리 생성
  ansible.builtin.file:
    path: "{{ chrony_sources_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: 4.1. chrony.conf 에 sourcedir 지시자 보장
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    regexp: '^sourcedir\s+{{ chrony_sources_dir | regex_escape }}\s*$'
    line: "sourcedir {{ chrony_sources_dir }}"
    insertafter: '^sourcedir\s+/run/chrony-dhcp\s*$'
    owner: root
    group: root
    mode: '0644'
  notify: restart chronyd

- name: 4.2. 배포판 기본 공개 NTP pool 비활성화
  ansible.builtin.replace:
    path: /etc/chrony.conf
    regexp: '^(pool\s+\S+.*)$'
    replace: '# \1'
  notify: restart chronyd

- name: 4.3. VLAN gateway 를 NTP source 로 배치
  ansible.builtin.copy:
    dest: "{{ chrony_sources_dir }}/vlan-gateway.sources"
    content: |
      # NET-03: 각 VLAN 은 자기 OPNsense gateway 의 UDP 123 만 사용할 수 있다.
      # 값의 원본은 docs/ip-plan.md 이며 여기에는 복제하지 않는다.
      server {{ chrony_ntp_server }} iburst
    owner: root
    group: root
    mode: '0644'
  notify: restart chronyd

- name: 4.4. chronyd 시간 동기화 서비스 활성화 및 시작
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: 5. 공식 dnf repository 접근 및 동기화 상태 검증
  ansible.builtin.command:
    cmd: dnf repolist
  register: dnf_repolist_result
  changed_when: false
  check_mode: false

- name: 5.1. 공식 Rocky 9 저장소 활성 상태 확인
  ansible.builtin.assert:
    that:
      - "'baseos' in dnf_repolist_result.stdout"
      - "'appstream' in dnf_repolist_result.stdout"
    fail_msg: "공식 Rocky 9 repolist (baseos, appstream)가 정상적으로 활성화되지 않았습니다."

- name: 6. SSH 공개키 기반 bootstrap 접근 환경 확인
  ansible.builtin.stat:
    path: /home/rocky/.ssh/authorized_keys
  register: auth_keys_stat
  check_mode: false

- name: 6.1. authorized_keys 존재 검증
  ansible.builtin.assert:
    that:
      - auth_keys_stat.stat.exists
      - auth_keys_stat.stat.size > 0
    fail_msg: "/home/rocky/.ssh/authorized_keys 파일이 비어있거나 존재하지 않습니다."

- name: 7. active swap 목록 확인
  ansible.builtin.command:
    cmd: swapon --show --noheadings
  register: active_swaps
  changed_when: false
  check_mode: false

- name: 7.1. Swap 메모리 비활성화
  ansible.builtin.command:
    cmd: swapoff -a
  when: active_swaps.stdout != ""

- name: 7.1. /etc/fstab 내 Swap 항목 주석 처리 또는 제거
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]+\s+[^#\s]+\s+swap\s+.*)$'
    replace: '# \1'

- name: 7.2. Swap 사용 중이지 않음을 검증
  ansible.builtin.command:
    cmd: free -b
  register: free_output
  changed_when: false
  check_mode: false

- name: 7.3. Swap Total 0 bytes 확인
  ansible.builtin.assert:
    that:
      - "'Swap:\n' in free_output.stdout or 'Swap:' in free_output.stdout"
    fail_msg: "Swap 상태 확인 실패"

- name: 8. Failed systemd unit 존재 여부 검증
  ansible.builtin.command:
    cmd: systemctl list-units --failed --no-legend
  register: failed_units
  changed_when: false
  check_mode: false

- name: 8.1. 실패한 systemd 서비스 0개 확인
  ansible.builtin.assert:
    that:
      - failed_units.stdout == ""
    fail_msg: "실패한 systemd 유닛이 존재합니다: {{ failed_units.stdout }}"
