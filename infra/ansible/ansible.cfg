[defaults]
inventory = inventory/hosts.example
roles_path = roles
remote_user = rocky
# False 는 SSH host key 검증을 완전히 끈다. 실제 VM 에 적용할 때는 켜 두고,
# 게스트 host key 는 인증된 경로(Proxmox 콘솔·QGA)로 확인해 known_hosts 에 넣는다.
# 저장소 밖 known_hosts 는 ANSIBLE_SSH_COMMON_ARGS 의 UserKnownHostsFile 로 지정한다.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
