apiVersion: v1
kind: Namespace
metadata:
  name: bkp-03-vault-restore
  labels:
    app.kubernetes.io/part-of: bkp-03
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: bkp-03-vault-restore
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-restore-config
  namespace: bkp-03-vault-restore
data:
  restore.hcl: |
    ui = false
    disable_mlock = true
    api_addr = "http://127.0.0.1:18200"
    cluster_addr = "http://127.0.0.1:18201"

    listener "tcp" {
      address = "127.0.0.1:18200"
      cluster_address = "127.0.0.1:18201"
      tls_disable = true
    }

    storage "raft" {
      path = "/vault/restore"
      node_id = "bkp03-isolated"
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-restore
  namespace: bkp-03-vault-restore
  labels:
    app.kubernetes.io/name: vault-restore
    app.kubernetes.io/part-of: bkp-03
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: vault
      image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
      imagePullPolicy: IfNotPresent
      command:
        - /bin/vault
      args:
        - server
        - -config=/vault/config/restore.hcl
      env:
        - name: VAULT_ADDR
          value: http://127.0.0.1:18200
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: config
          mountPath: /vault/config
          readOnly: true
        - name: restore
          mountPath: /vault/restore
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: config
      configMap:
        name: vault-restore-config
    - name: restore
      emptyDir:
        sizeLimit: 1Gi
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
