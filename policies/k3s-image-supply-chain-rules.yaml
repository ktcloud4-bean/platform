apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: k3s-image-supply-chain-rules
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: k3s Image Supply Chain Enforce Rules
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission
    app.kubernetes.io/part-of: platform-gitops
spec:
  validationFailureAction: Enforce
  background: true
  failurePolicy: Fail
  rules:
    - name: check-curated-harbor-registry
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
                - wazuh
                - harbor
                - e2e-01
      validate:
        allowExistingViolations: true
        message: "[SUPPLY-05 Enforce] 외부 upstream 레지스트리 직접 참조가 차단되었습니다 (harbor.imcherry5778.xyz/curated-platform/ 승격 필요)"
        pattern:
          spec:
            =(containers):
              - image: "harbor.imcherry5778.xyz/curated-platform/*"
            =(initContainers):
              - image: "harbor.imcherry5778.xyz/curated-platform/*"
            =(ephemeralContainers):
              - image: "harbor.imcherry5778.xyz/curated-platform/*"

    - name: check-sha256-digest-pinning
      skipBackgroundRequests: true
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - falco
                - wazuh
                - harbor
                - e2e-01
      validate:
        allowExistingViolations: true
        message: "[SUPPLY-05 Enforce] sha256 다이제스트 미고정 태그(tag-only) 이미지가 차단되었습니다 (@sha256 고정 필요)"
        pattern:
          spec:
            =(containers):
              - image: "*@sha256:*"
            =(initContainers):
              - image: "*@sha256:*"
            =(ephemeralContainers):
              - image: "*@sha256:*"
