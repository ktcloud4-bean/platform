apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: k3s-image-supply-chain-policy
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    policies.kyverno.io/title: k3s Image Supply Chain Admission Policy
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission
    app.kubernetes.io/part-of: platform-gitops
spec:
  failurePolicy: Fail
  evaluation:
    mode: Kubernetes
    admission:
      enabled: true
    background:
      enabled: false
  validationActions:
  - Deny
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers: []
  credentials:
    secrets:
    - board-demo-registry
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchImageReferences:
  - glob: '*'
  matchConditions:
  - name: exclude-exact-system-components
    expression: "!(\n  (\n    object.metadata.namespace == \"kube-system\" &&\n    (\n      object.spec.serviceAccountName in [\"coredns\", \"local-path-provisioner-service-account\", \"metrics-server\", \"traefik\", \"svclb\", \"helm-traefik\", \"helm-traefik-crd\"] ||\n      (has(object.metadata.labels) && \"k8s-app\" in object.metadata.labels && object.metadata.labels[\"k8s-app\"] in [\"kube-dns\", \"local-path-provisioner\", \"metrics-server\", \"traefik\", \"svclb-traefik\"])\n    ) &&\n    images.containers.map(img, img.startsWith(\"rancher/\")).all(e, e) &&\n    images.initContainers.map(img, img.startsWith(\"rancher/\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"rancher/\")).all(e, e)\n  ) ||\n  (\n    object.metadata.namespace == \"kyverno\" &&\n    object.spec.serviceAccountName in [\"kyverno-admission-controller\", \"kyverno-reports-controller\"] &&\n    images.containers.map(img, img.startsWith(\"reg.kyverno.io/kyverno/\")).all(e, e) &&\n    images.initContainers.map(img,\
      \ img.startsWith(\"reg.kyverno.io/kyverno/\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"reg.kyverno.io/kyverno/\")).all(e, e)\n  ) ||\n  (\n    object.metadata.namespace == \"falco\" &&\n    object.spec.serviceAccountName == \"falco\" &&\n    images.containers.map(img, img.startsWith(\"docker.io/falcosecurity/falco\")).all(e, e) &&\n    images.initContainers.map(img, img.startsWith(\"docker.io/falcosecurity/falco\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"docker.io/falcosecurity/falco\")).all(e, e)\n  ) ||\n  (\n    object.metadata.namespace == \"wazuh\" &&\n    object.spec.serviceAccountName in [\"wazuh-manager\", \"wazuh-indexer\", \"wazuh-dashboard\", \"wazuh-06-notifier\", \"wazuh-bootstrap\"] &&\n    images.containers.map(img, img.startsWith(\"docker.io/wazuh/\") || img.startsWith(\"docker.io/library/python:\")).all(e, e) &&\n    images.initContainers.map(img, img.startsWith(\"docker.io/wazuh/\") || img.startsWith(\"\
      docker.io/library/python:\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"docker.io/wazuh/\") || img.startsWith(\"docker.io/library/python:\")).all(e, e)\n  ) ||\n  (\n    object.metadata.namespace == \"harbor\" &&\n    object.spec.serviceAccountName in [\"harbor\", \"default\"] &&\n    images.containers.map(img, img.startsWith(\"docker.io/goharbor/\")).all(e, e) &&\n    images.initContainers.map(img, img.startsWith(\"docker.io/goharbor/\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"docker.io/goharbor/\")).all(e, e)\n  ) ||\n  (\n    object.metadata.namespace == \"e2e-01\" &&\n    images.containers.map(img, img.startsWith(\"harbor.imcherry5778.xyz/ci01-evidence/\")).all(e, e) &&\n    images.initContainers.map(img, img.startsWith(\"harbor.imcherry5778.xyz/ci01-evidence/\")).all(e, e) &&\n    images.ephemeralContainers.map(img, img.startsWith(\"harbor.imcherry5778.xyz/ci01-evidence/\")).all(e, e)\n  )\n)"
  attestors:
  - name: current
    cosign:
      key:
        data: '-----BEGIN PUBLIC KEY-----

          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEQa4Ut0QCl60HNt2ZdEu1qVtoU/mL

          wgP4DwVaOUntkbS76xmB9xPxkVRWlhVoYGzsYcvVU3Bn7SzL/8FgV9C99A==

          -----END PUBLIC KEY-----

          '
      ctlog:
        url: https://rekor.sigstore.dev
        insecureIgnoreTlog: true
        insecureIgnoreSCT: true
  - name: previous
    cosign:
      key:
        data: '-----BEGIN PUBLIC KEY-----

          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYDJs7Lrkaw8AKYul3sSYsMKjCQhd

          lFqwV0eLn3byybjj+CMZUEoH5s8grTsmikhYeF0QVPzpVpMQNxbT6shc/w==

          -----END PUBLIC KEY-----

          '
      ctlog:
        url: https://rekor.sigstore.dev
        insecureIgnoreTlog: true
        insecureIgnoreSCT: true
  validations:
  - expression: 'images.containers.map(img, img.startsWith("harbor.imcherry5778.xyz/curated-platform/")).all(e, e) &&

      images.initContainers.map(img, img.startsWith("harbor.imcherry5778.xyz/curated-platform/")).all(e, e) &&

      images.ephemeralContainers.map(img, img.startsWith("harbor.imcherry5778.xyz/curated-platform/")).all(e, e)'
    message: "[SUPPLY-05 Enforce] \uC678\uBD80 upstream \uB808\uC9C0\uC2A4\uD2B8\uB9AC \uC9C1\uC811 \uCC38\uC870\uAC00 \uCC28\uB2E8\uB418\uC5C8\uC2B5\uB2C8\uB2E4 (harbor.imcherry5778.xyz/curated-platform/ \uC2B9\uACA9 \uD544\uC694)"
  - expression: 'images.containers.map(img, img.contains("@sha256:")).all(e, e) &&

      images.initContainers.map(img, img.contains("@sha256:")).all(e, e) &&

      images.ephemeralContainers.map(img, img.contains("@sha256:")).all(e, e)'
    message: "[SUPPLY-05 Enforce] sha256 \uB2E4\uC774\uC81C\uC2A4\uD2B8 \uBBF8\uACE0\uC815 \uD0DC\uADF8(tag-only) \uC774\uBBF8\uC9C0\uAC00 \uCC28\uB2E8\uB418\uC5C8\uC2B5\uB2C8\uB2E4 (@sha256 \uACE0\uC815 \uD544\uC694)"
  - expression: 'images.containers.map(image, verifyImageSignatures(image, [attestors.current, attestors.previous])).all(e, e > 0) &&

      images.initContainers.map(image, verifyImageSignatures(image, [attestors.current, attestors.previous])).all(e, e > 0) &&

      images.ephemeralContainers.map(image, verifyImageSignatures(image, [attestors.current, attestors.previous])).all(e, e > 0)'
    message: "[SUPPLY-05 Enforce] current \uB610\uB294 previous \uACF5\uAC1C\uD0A4\uB85C Cosign image signature\uB97C \uAC80\uC99D\uD558\uC9C0 \uBABB\uD588\uC2B5\uB2C8\uB2E4"
