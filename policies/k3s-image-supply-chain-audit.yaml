apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: k3s-image-supply-chain-audit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: k3s Image Supply Chain Audit Policy
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: admission
    app.kubernetes.io/part-of: platform-gitops
spec:
  attestors:
    - name: cosign-root
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE9wQo014X5G+rC6j5J7n8kY2p0Z1/
            e3m9K0l4n2j8P5q1v7s4x2z9a3c5e7g1i3k5m7o9q1s3u5w7y9a1c3e5g7i9k==
            -----END PUBLIC KEY-----
  failurePolicy: Ignore
  evaluation:
    mode: Kubernetes
    admission:
      enabled: true
    background:
      enabled: true
  validationActions:
    - Audit
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers:
        - DaemonSet
        - Deployment
        - Job
        - StatefulSet
        - CronJob
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "*"
  validations:
    - expression: >-
        images.containers.all(img, img.startsWith("harbor.imcherry5778.xyz/")) &&
        images.initContainers.all(img, img.startsWith("harbor.imcherry5778.xyz/")) &&
        images.ephemeralContainers.all(img, img.startsWith("harbor.imcherry5778.xyz/"))
      message: "외부 upstream 레지스트리 이미지가 감지되었습니다 (Harbor 내부 레포지토리 승격 필요)"
    - expression: >-
        images.containers.all(img, img.contains("@sha256:")) &&
        images.initContainers.all(img, img.contains("@sha256:")) &&
        images.ephemeralContainers.all(img, img.contains("@sha256:"))
      message: "sha256 digest 미고정 tag-only 이미지가 감지되었습니다 (@sha256 고정 필요)"
