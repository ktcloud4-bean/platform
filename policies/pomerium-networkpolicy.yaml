apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-default-deny
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-dns-egress
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-pomerium-from-traefik
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-dashy-from-pomerium
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashy
      app.kubernetes.io/component: portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
              app.kubernetes.io/component: server
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-pomerium-required-egress
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dashy
              app.kubernetes.io/component: portal
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: headlamp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: headlamp
              app.kubernetes.io/component: server
      ports:
        - port: 4466
          protocol: TCP
    # REG-01 browser route. Service/harbor:80은 nginx Pod의 8080으로 전달된다.
    # OCI /v2/와 /service/는 Traefik에서 Harbor로 직접 가므로 이 경로를 쓰지 않는다.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
          podSelector:
            matchLabels:
              app.kubernetes.io/name: harbor
              app.kubernetes.io/component: nginx
      ports:
        - port: 8080
          protocol: TCP
    # Pomerium의 OIDC provider와 authenticate URL은 기존 Traefik HTTPS
    # hostname 경로를 사용한다. Service ClusterIP를 경유하는 호출은 kube-proxy
    # DNAT 뒤 Traefik의 websecure target port 8443으로 평가된다.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8443
          protocol: TCP
    # 랩 DNS는 sso·authenticate hostname을 k3s 노드 IP로 해석하고 그 443은
    # svclb-traefik Pod의 hostPort가 받는다. 이 경로는 목적지를 좁힐 수 없다.
    # POL-01-FIX-01에서 svclb podSelector와 노드 IP ipBlock을 각각 적용해
    # 실측한 결과 둘 다 차단됐고, 목적 port만 제한할 때만 통과했다.
    # 모든 route upstream이 내부 http Service이므로 외부 443은 이 경로뿐이다.
    - ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pol-01-dashy-required-egress
  namespace: pomerium
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dashy
      app.kubernetes.io/component: portal
  policyTypes:
    - Egress
  egress:
    # Dashy는 [ADR-0014](../docs/adr/0014-dashy-access-portal.md)의 공개 PKCE
    # client로 자체 로그인하고, 서버가 Keycloak 서명 키로 그 토큰을 검증한다.
    # 이 egress가 없으면 검증이 fail되어 포털이 로그인 상태를 유지하지 못한다.
    # 목적지를 좁힐 수 없는 근거는 위 pomerium Keycloak 경로 주석과 같다.
    # Dashy는 이 443 외의 egress가 없어 Vault·다른 namespace로 나가지 못한다.
    - ports:
        - port: 443
          protocol: TCP
