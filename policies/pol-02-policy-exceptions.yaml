apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: pol-02-argocd-run-as-non-root
  namespace: kyverno
  annotations:
    pol-02.imcherry5778.xyz/owner: platform-operations
    pol-02.imcherry5778.xyz/reason: Argo CD upstream workloads need Pod-level securityContext remediation.
    pol-02.imcherry5778.xyz/expires-at: "2026-09-02T15:00:00Z"
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  background: false
  exceptions:
    - policyName: pol-01-require-pod-run-as-non-root
      ruleNames:
        - require-pod-run-as-non-root
        - autogen-require-pod-run-as-non-root
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - argocd
          names:
            - argocd-application-controller-*
            - argocd-applicationset-controller-*
            - argocd-dex-server-*
            - argocd-repo-server-*
            - argocd-server-*
      - resources:
          kinds:
            - Deployment
          namespaces:
            - argocd
          names:
            - argocd-applicationset-controller
            - argocd-dex-server
            - argocd-repo-server
            - argocd-server
      - resources:
          kinds:
            - ReplicaSet
          namespaces:
            - argocd
          names:
            - argocd-applicationset-controller-*
            - argocd-dex-server-*
            - argocd-repo-server-*
            - argocd-server-*
      - resources:
          kinds:
            - StatefulSet
          namespaces:
            - argocd
          names:
            - argocd-application-controller
  conditions:
    all:
      - key: "{{ time_before('{{ time_now_utc() }}','2026-09-02T15:00:00Z') }}"
        operator: Equals
        value: true
---
