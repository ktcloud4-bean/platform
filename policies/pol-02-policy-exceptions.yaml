apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: pol-03-velero-pvb-hosting-run-as-non-root
  namespace: kyverno
  annotations:
    pol-02.imcherry5778.xyz/owner: platform-operations
    pol-02.imcherry5778.xyz/reason: >-
      Velero v1.18.2 PodVolumeBackup controller creates a transient root hosting Pod for
      filesystem backup. The exception is limited to the controller's PodVolumeBackup
      label/name relation, owner reference, and velero-server ServiceAccount request.
    pol-02.imcherry5778.xyz/review-trigger: Velero PodVolumeBackup hosting Pod label, owner reference, ServiceAccount, or image change.
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  background: false
  exceptions:
    - policyName: pol-01-require-pod-run-as-non-root
      ruleNames:
        - require-pod-run-as-non-root
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - velero
          selector:
            matchExpressions:
              - key: velero.io/pod-volume-backup
                operator: Exists
        subjects:
          - kind: ServiceAccount
            name: velero-server
            namespace: velero
  conditions:
    all:
      - key: '{{ request.object.metadata.labels."velero.io/pod-volume-backup" || '''' }}'
        operator: Equals
        value: '{{ request.object.metadata.name }}'
      - key: '{{ request.object.spec.serviceAccountName || '''' }}'
        operator: Equals
        value: velero-server
      - key: '{{ request.object.metadata.ownerReferences[?kind==''PodVolumeBackup'' && controller==`true`].apiVersion | [0] || '''' }}'
        operator: Equals
        value: velero.io/v1
      - key: '{{ request.object.metadata.ownerReferences[?kind==''PodVolumeBackup'' && controller==`true`].name | [0] || '''' }}'
        operator: Equals
        value: '{{ request.object.metadata.name }}'
---
