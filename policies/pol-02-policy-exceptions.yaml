apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: pol-02-crowdsec-run-as-non-root
  namespace: kyverno
  annotations:
    pol-02.imcherry5778.xyz/owner: platform-operations
    pol-02.imcherry5778.xyz/reason: CrowdSec LAPI and AppSec upstream entrypoint /docker_start.sh requires UID 0 for config prestaging and permission handling.
    pol-02.imcherry5778.xyz/review-trigger: CrowdSec LAPI/AppSec image digest, Linux capabilities, or ServiceAccount change.
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  background: false
  exceptions:
    - policyName: pol-01-require-pod-run-as-non-root
      ruleNames:
        - require-pod-run-as-non-root
        - autogen-require-pod-run-as-non-root
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - crowdsec-01
          names:
            - crowdsec-appsec-*
            - crowdsec-lapi-*
      - resources:
          kinds:
            - Deployment
          namespaces:
            - crowdsec-01
          names:
            - crowdsec-appsec
            - crowdsec-lapi
      - resources:
          kinds:
            - ReplicaSet
          namespaces:
            - crowdsec-01
          names:
            - crowdsec-appsec-*
            - crowdsec-lapi-*
---
