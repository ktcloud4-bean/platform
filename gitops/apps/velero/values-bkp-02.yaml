image:
  repository: docker.io/velero/velero
  tag: v1.18.2
  digest: sha256:a77d493b80f622e0bed1b9a19fea40a48d427de24e82be3f64824528b1ab7ecb
  pullPolicy: IfNotPresent

initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws@sha256:abe29a7b360231e359f7aaee79668141bd619ab6989c7cc78d041110987f6ca2
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    volumeMounts:
      - mountPath: /target
        name: plugins

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

extraVolumes:
  - name: udmrepo
    emptyDir: {}

extraVolumeMounts:
  - name: udmrepo
    mountPath: /udmrepo

upgradeCRDs: false
cleanUpCRDs: false

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: bkp-02-velero
      caCert: 
      prefix: cluster-k3s-01
      default: true
      validationFrequency: 1m
      accessMode: ReadWrite
      credential:
        name: bkp-02-s3-credentials
        key: cloud
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: https://s3.imcherry5778.xyz:8333
  uploaderType: kopia
  defaultBackupStorageLocation: default
  defaultVolumesToFsBackup: false
  defaultSnapshotMoveData: false
  storeValidationFrequency: 1m
  defaultRepoMaintainFrequency: 24h
  extraEnvVars:
    - name: HOME
      value: /scratch
  repositoryMaintenanceJob:
    repositoryConfigData:
      name: velero-repo-maintenance
      global:
        keepLatestMaintenanceJobs: 1
        podResources:
          cpuRequest: 100m
          cpuLimit: 500m
          memoryRequest: 128Mi
          memoryLimit: 512Mi

credentials:
  useSecret: true
  existingSecret: bkp-02-s3-credentials

backupsEnabled: true
snapshotsEnabled: false
deployNodeAgent: true

nodeAgent:
  disableHostPath: false
  podVolumePath: /var/lib/kubelet/pods
  useScratchEmptyDir: true
  extraArgs:
    - --node-agent-configmap=velero-bkp-02-node-agent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    privileged: true
    allowPrivilegeEscalation: true

configMaps:
  bkp-02-node-agent:
    data:
      node-agent-config.json: |
        {
          "loadConcurrency": {
            "globalConfig": 1,
            "prepareQueueLength": 1
          },
          "podResources": {
            "cpuRequest": "100m",
            "cpuLimit": "500m",
            "memoryRequest": "128Mi",
            "memoryLimit": "512Mi"
          },
          "privilegedFsBackup": true
        }

rbac:
  create: true
  clusterAdministrator: true
  clusterAdministratorName: cluster-admin

# BKP-07: BKP-02는 메커니즘 검증(PoC)만 하고 정기 schedule은 만들지 않았다.
# 실제 namespace resource·PVC 데이터를 지키려면 schedule이 있어야 한다.
# 다른 네이티브 백업(postgres 02:15, vault 02:40, offsite 03:30, k3s-datastore
# 03:50 KST)과 겹치지 않도록 02:00 KST(UTC 17:00 전날)에 돌린다. defaultVolumesToFsBackup은
# BKP-02가 이미 검증한 Kopia PV backup 경로를 그대로 켠다. 실패·부분 실패는 기존
# obs-13-backup의 VeleroBackupFailed alert가 이미 감시한다(새 alert 불필요).
schedules:
  daily:
    schedule: "0 17 * * *"
    template:
      ttl: 168h0m0s
      storageLocation: default
      defaultVolumesToFsBackup: true

extraObjects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: velero
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/part-of: platform-gitops
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
