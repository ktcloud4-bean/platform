apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-01-whoami
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crowdsec-01-whoami
    app.kubernetes.io/part-of: crowdsec-01
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-01-whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-01-whoami
        app.kubernetes.io/part-of: crowdsec-01
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
          imagePullPolicy: IfNotPresent
          args:
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-01-whoami
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: crowdsec-01-whoami
    app.kubernetes.io/part-of: crowdsec-01
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowdsec-01-whoami
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-01-appsec
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
spec:
  plugin:
    crowdsec:
      enabled: true
      crowdsecMode: appsec
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec-01.svc.cluster.local:8080
      crowdsecLapiKeyFile: /run/secrets/crowdsec-01/bouncer-key
      crowdsecAppsecEnabled: true
      crowdsecAppsecScheme: http
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec-01.svc.cluster.local:7422
      crowdsecAppsecPath: /
      crowdsecAppsecKeyFile: /run/secrets/crowdsec-01/bouncer-key
      crowdsecAppsecFailureBlock: true
      crowdsecAppsecUnreachableBlock: true
      crowdsecAppsecUnreadableBodyBlock: true
      crowdsecAppsecBodyLimit: 1048576
      remediationStatusCode: 403
      httpTimeoutSeconds: 2
      updateIntervalSeconds: 60
      metricsUpdateIntervalSeconds: 0
      forwardedHeadersTrustedIps: []
      clientTrustedIps: []
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crowdsec-01-test
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`k3s-01.imcherry5778.xyz`) && PathPrefix(`/crowdsec-01/control`)
      priority: 120
      services:
        - name: crowdsec-01-whoami
          port: 80
    - kind: Rule
      match: Host(`k3s-01.imcherry5778.xyz`) && PathPrefix(`/crowdsec-01/waf`)
      priority: 120
      middlewares:
        - name: crowdsec-01-appsec
          namespace: {{ .Release.Namespace }}
      services:
        - name: crowdsec-01-whoami
          port: 80
  tls: {}
