apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-01-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-01-dns-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crowdsec-01-appsec-to-lapi
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: crowdsec-01
spec:
  podSelector:
    matchLabels:
      k8s-app: {{ .Release.Name }}
      type: appsec
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              k8s-app: {{ .Release.Name }}
              type: lapi
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
