container_runtime: containerd

image:
  repository: harbor.imcherry5778.xyz/curated-platform/crowdsec
  tag: v1.7.8@sha256:95a25d0f0fb92d96204e74fd48a5c4bd2c949b1b2a31769fa3487ad4769314e1
  pullPolicy: IfNotPresent
  pullSecrets: []

config:
  profiles.yaml: |
    name: crowdsec-01-no-remediation
    filters:
      - "false"
    decisions: []
    on_success: continue
  console.yaml: |
    share_manual_decisions: false
    share_custom: false
    share_tainted: false
    share_context: false

secrets:
  externalSecret:
    name: crowdsec-01-bootstrap
    csLapiSecretKey: CS_LAPI_SECRET
    registrationTokenKey: REGISTRATION_TOKEN

tls:
  enabled: true
  caBundle: true
  insecureSkipVerify: false
  certManager:
    enabled: false
  pki01:
    enabled: true
    agentIssuerRef: vault-crowdsec-agent
    lapiIssuerRef: vault-crowdsec-lapi
    duration: 720h
    renewBefore: 240h
    crlURL: https://vault.vault.svc.cluster.local:8200/v1/pki/crl/pem
    crlRefreshSeconds: 10
    crlCacheExpiration: 1s
    reloadOnChange: true
  agent:
    tlsClientAuth: true
  appsec:
    tlsClientAuth: false

lapi:
  enabled: true
  replicas: 1
  ingress:
    enabled: false
  env:
    - name: DISABLE_ONLINE_API
      value: "true"
    - name: NO_HUB_UPGRADE
      value: "true"
  envFrom:
    - secretRef:
        name: crowdsec-01-bootstrap
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  persistentVolume:
    data:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      size: 1Gi
    config:
      enabled: false
  storeCAPICredentialsInSecret: false
  storeLAPICscliCredentialsInSecret: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
    podMonitor:
      enabled: false

agent:
  enabled: true
  isDeployment: true
  replicas: 1
  lapiURL: https://crowdsec-service.crowdsec-01.svc.cluster.local:8080
  hostVarLog: false
  acquisition: []
  additionalAcquisition:
    - source: file
      filenames:
        - /dev/null
      labels:
        type: syslog
  wait_for_lapi:
    image:
      repository: harbor.imcherry5778.xyz/curated-platform/crowdsec
      tag: v1.7.8@sha256:95a25d0f0fb92d96204e74fd48a5c4bd2c949b1b2a31769fa3487ad4769314e1
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      capabilities:
        drop:
          - ALL
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
    podMonitor:
      enabled: false
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  extraVolumes:
    - name: pki-01-agent-config
      emptyDir: {}
    - name: pki-01-agent-data
      emptyDir: {}
  extraVolumeMounts:
    - name: pki-01-agent-config
      mountPath: /etc/crowdsec
    - name: pki-01-agent-data
      mountPath: /var/lib/crowdsec/data

appsec:
  enabled: true
  replicas: 1
  lapiURL: https://crowdsec-service.crowdsec-01.svc.cluster.local:8080
  acquisitions: []
  configs: {}
  rules: {}
  env:
    - name: NO_HUB_UPGRADE
      value: "true"
    - name: COLLECTIONS
      value: ""
    - name: PARSERS
      value: ""
    - name: SCENARIOS
      value: ""
    - name: POSTOVERFLOWS
      value: ""
    - name: APPSEC_CONFIGS
      value: ""
    - name: APPSEC_RULES
      value: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  extraVolumes:
    - name: crowdsec-01-appsec-configs
      configMap:
        name: crowdsec-01-appsec-configs
    - name: crowdsec-01-appsec-rules
      configMap:
        name: crowdsec-01-appsec-rules
    - name: crowdsec-01-crs-snapshot
      configMap:
        name: crowdsec-01-crs-snapshot
    - name: crowdsec-01-appsec-data
      emptyDir: {}
  extraVolumeMounts:
    - name: crowdsec-01-appsec-configs
      mountPath: /etc/crowdsec/appsec-configs/crowdsec-01-crs-inband.yaml
      subPath: crowdsec-01-crs-inband.yaml
      readOnly: true
    - name: crowdsec-01-appsec-rules
      mountPath: /etc/crowdsec/appsec-rules/crowdsec-01-exact-913100-exception.yaml
      subPath: crowdsec-01-exact-913100-exception.yaml
      readOnly: true
    - name: crowdsec-01-appsec-rules
      mountPath: /etc/crowdsec/appsec-rules/crowdsec-01-crs.yaml
      subPath: crowdsec-01-crs.yaml
      readOnly: true
    - name: crowdsec-01-appsec-data
      # docker_start writes GeoIP links here; the init container verifies and copies the immutable snapshot.
      mountPath: /var/lib/crowdsec/data
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
    podMonitor:
      enabled: false
