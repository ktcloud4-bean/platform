apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: platform-gitops
    app.kubernetes.io/name: vault
spec:
  serviceName: vault-internal
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: platform-gitops
    spec:
      serviceAccountName: vault
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: harbor.imcherry5778.xyz/curated-platform/vault@sha256:18ceda087817a9e0dbed22fb632225fdc079f1b909bc0ff94d00ade4c4990e9f
          imagePullPolicy: IfNotPresent
          # 공식 entrypoint는 "server" 인자만 주면 자동으로
          # -config=/vault/config(디렉터리 전체)를 지정한다.
          # 여기에 -config를 추가로 넘기면 같은 리스너가 두 번 로드되어
          # "address already in use"로 즉시 crash한다.
          args:
            - server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_API_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_CLUSTER_ADDR
              value: https://vault-0.vault-internal.vault.svc.cluster.local:8201
            - name: VAULT_CACERT
              value: /vault/data/tls/vault.crt
            # 온프레미스 Pod에는 instance profile이 없다. 저장소 밖 원본을
            # KMS-01 절차로 주입한 전용 Secret의 두 key만 사용한다.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vault-awskms
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-awskms
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8200
            - name: https-internal
              containerPort: 8201
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
            # Kubernetes auth의 TokenReview 호출에 쓰는 자기 신분증.
            # SA의 automountServiceAccountToken 은 false 로 두고 여기서만 명시적으로 준다.
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            # database engine이 postgres-01에 sslmode=verify-full 로 붙을 때 쓰는 신뢰 앵커.
            - name: postgres-ca
              mountPath: /vault/userconfig/postgres-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
        # 만료 1시간짜리 ServiceAccount token. kubelet이 자동 갱신하므로
        # 만료 없는 token을 Secret에 저장할 필요가 없다.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: postgres-ca
          configMap:
            name: vault-postgres-ca
