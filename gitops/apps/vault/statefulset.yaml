apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: platform-gitops
    app.kubernetes.io/name: vault
spec:
  serviceName: vault-internal
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/part-of: platform-gitops
    spec:
      serviceAccountName: vault
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          # 공식 entrypoint는 "server" 인자만 주면 자동으로
          # -config=/vault/config(디렉터리 전체)를 지정한다.
          # 여기에 -config를 추가로 넘기면 같은 리스너가 두 번 로드되어
          # "address already in use"로 즉시 crash한다.
          args:
            - server
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: VAULT_ADDR
              value: https://127.0.0.1:8200
            - name: VAULT_API_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_CLUSTER_ADDR
              value: https://vault-0.vault-internal.vault.svc.cluster.local:8201
            - name: VAULT_CACERT
              value: /vault/data/tls/vault.crt
          ports:
            - name: https
              containerPort: 8200
            - name: https-internal
              containerPort: 8201
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
