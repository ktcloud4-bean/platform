apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
  labels:
    app.kubernetes.io/part-of: platform-gitops
    app.kubernetes.io/name: vault
data:
  vault.hcl: |
    ui = true

    # hashicorp/vault:2.0.2부터 이미지에 CAP_IPC_LOCK이 없다.
    # mlock 호출이 실패하지 않도록 명시적으로 비활성화한다(컨테이너 표준 관행).
    disable_mlock = true

    listener "tcp" {
      address         = "0.0.0.0:8200"
      tls_cert_file   = "/vault/data/tls/vault.crt"
      tls_key_file    = "/vault/data/tls/vault.key"
      tls_min_version = "tls12"
    }

    storage "raft" {
      path    = "/vault/data/raft"
      node_id = "vault-0"
    }

    cluster_addr = "https://vault-0.vault-internal.vault.svc.cluster.local:8201"
    api_addr     = "https://vault.vault.svc.cluster.local:8200"

    log_level = "info"
