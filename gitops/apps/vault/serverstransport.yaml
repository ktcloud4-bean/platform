apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vault-backend-tls
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: platform-gitops
spec:
  # Service ClusterIP로 접속하므로 hostname 기반 SAN 검증은 이 이름을 명시해야 통과한다.
  # 인증서 SAN에 있는 이름이며 vault-internal 소비자가 쓰는 것과 같다.
  serverName: vault.vault.svc.cluster.local
  rootCAsSecrets:
    - vault-ingress-ca
