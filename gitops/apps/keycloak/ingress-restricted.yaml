apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-restricted
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: keycloak-sso-internal-only@kubernetescrd
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: platform-gitops
spec:
  ingressClassName: traefik
  rules:
    # issuer/hostname의 단일 원본은 docs/ip-plan.md다.
    # EDGE-02: ingress.yaml의 두 path(/realms/platform, /resources)를 뺀 나머지
    # 전부(/admin, /realms/master, root, health 등)를 내부 source로만 제한한다.
    # Traefik은 더 구체적인 path prefix를 우선하므로 ingress.yaml의 두 route가 먼저 매칭된다.
    - host: sso.imcherry5778.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
  tls:
    - hosts:
        - sso.imcherry5778.xyz
