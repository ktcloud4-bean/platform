apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-production
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: platform-gitops
spec:
  ingressClassName: traefik
  rules:
    # issuer/hostname의 단일 원본은 docs/ip-plan.md다.
    - host: sso.imcherry5778.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
  tls:
    - hosts:
        - sso.imcherry5778.xyz
