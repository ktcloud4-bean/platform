apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap-v2
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: platform-gitops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: platform-gitops
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: harbor.imcherry5778.xyz/curated-platform/vault@sha256:18ceda087817a9e0dbed22fb632225fdc079f1b909bc0ff94d00ade4c4990e9f
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - -config=/vault/config/bootstrap.hcl
          securityContext:
            # bootstrap 컨테이너와 같은 UID로 렌더링해야 종료 시 원문 파일을
            # 삭제할 수 있다. runtime Pod는 읽기 전용이므로 UID 100을 유지한다.
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config
              readOnly: true
            - name: vault-trust
              mountPath: /vault/tls
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: vault-agent-tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      containers:
        - name: bootstrap
          image: harbor.imcherry5778.xyz/curated-platform/keycloak@sha256:26939e1318d6f008fc2ee6e10cec1cf8f1ba8a21846c1bc81b91ed0506bc2a7a
          imagePullPolicy: IfNotPresent
          command: ["/opt/keycloak/scripts/bootstrap.sh"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-01.imcherry5778.xyz:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak_user
            - name: KC_DB_TLS_MODE
              value: verify-server
            - name: KC_DB_TLS_TRUST_STORE_FILE
              value: /etc/keycloak/trust/postgres-01.crt
            - name: KC_HOSTNAME
              value: https://sso.imcherry5778.xyz
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: 10.42.0.0/24
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_SCHEME
              value: http
            - name: KC_CACHE
              value: ispn
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: scripts
              mountPath: /opt/keycloak/scripts
              readOnly: true
            - name: trust-bundles
              mountPath: /etc/keycloak/trust
              readOnly: true
            - name: vault-secrets
              mountPath: /vault/secrets
            - name: vault-secrets
              mountPath: /opt/keycloak/data/import/platform-realm.json
              subPath: platform-realm.json
              readOnly: true
            - name: keycloak-tmp
              mountPath: /tmp
      volumes:
        - name: vault-agent-config
          configMap:
            name: keycloak-vault-agent
            items:
              - key: bootstrap.hcl
                path: bootstrap.hcl
        - name: scripts
          configMap:
            name: keycloak-scripts
            defaultMode: 0550
        - name: trust-bundles
          configMap:
            name: keycloak-trust-bundles
        - name: vault-trust
          configMap:
            name: keycloak-trust-bundles
            items:
              - key: vault.crt
                path: vault.crt
        - name: vault-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: vault-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: keycloak-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
