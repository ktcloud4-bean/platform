apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-vault-agent
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: secret-consumer
    app.kubernetes.io/part-of: platform-gitops
data:
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "renovate"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/renovate/runtime/github-token"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/renovate/runtime" -}}{{ .Data.data.github_token }}{{- end -}}
    EOT
    }
