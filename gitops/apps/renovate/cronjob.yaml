apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-update
    app.kubernetes.io/part-of: platform-gitops
spec:
  schedule: "17 3 * * 0"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          annotations:
            update.imcherry5778.xyz/runtime-config-sha256: 74f01fcc3314bf84b15fbb25af35d8414b185fe161fb2229215b957a337586f0
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/component: dependency-update
            app.kubernetes.io/part-of: platform-gitops
        spec:
          serviceAccountName: renovate
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 12021
            fsGroup: 12021
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: vault-agent
              image: harbor.imcherry5778.xyz/curated-platform/vault@sha256:18ceda087817a9e0dbed22fb632225fdc079f1b909bc0ff94d00ade4c4990e9f
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - exec vault agent -config=/vault/config/runtime.hcl
              securityContext:
                runAsUser: 12021
                runAsGroup: 12021
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: vault-agent-config
                  mountPath: /vault/config
                  readOnly: true
                - name: trust-bundle
                  mountPath: /vault/tls
                  readOnly: true
                - name: renovate-runtime
                  mountPath: /renovate/runtime
                - name: vault-agent-tmp
                  mountPath: /tmp
                - name: vault-token
                  mountPath: /var/run/secrets/vault
                  readOnly: true
          containers:
            - name: renovate
              image: harbor.imcherry5778.xyz/curated-platform/renovate:44.6.0@sha256:6a5cebec637d64eca7e7d4072a311016f8189f1a95cb349cf2c18750ef2fa775
              imagePullPolicy: IfNotPresent
              env:
                - name: RENOVATE_CONFIG_FILE
                  value: /renovate/config/config.js
                - name: LOG_LEVEL
                  value: info
                - name: HOME
                  value: /tmp/renovate-home
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: renovate-config
                  mountPath: /renovate/config
                  readOnly: true
                - name: renovate-runtime
                  mountPath: /renovate/runtime
                  readOnly: true
                - name: renovate-tmp
                  mountPath: /tmp
          volumes:
            - name: renovate-config
              configMap:
                name: renovate-config
            - name: vault-agent-config
              configMap:
                name: renovate-vault-agent
                items:
                  - key: runtime.hcl
                    path: runtime.hcl
            - name: trust-bundle
              configMap:
                name: renovate-trust-bundle
                items:
                  - key: vault.crt
                    path: vault.crt
            - name: renovate-runtime
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: vault-agent-tmp
              emptyDir:
                medium: Memory
                sizeLimit: 8Mi
            - name: renovate-tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: vault-token
              projected:
                defaultMode: 0440
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
                      audience: vault
