apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: platform-gitops
data:
  config.js: |
    const fs = require('node:fs');

    // Patch GithubHttp for fine-grained PAT compatibility (Issues scope isolation)
    try {
      const githubHttp = require('/usr/local/renovate/dist/util/http/github.js');
      if (githubHttp && githubHttp.GithubHttp && githubHttp.GithubHttp.prototype.postJson) {
        const origPostJson = githubHttp.GithubHttp.prototype.postJson;
        githubHttp.GithubHttp.prototype.postJson = async function(url, options) {
          if (url === 'graphql' && options && options.body && typeof options.body.query === 'string') {
            const q = options.body.query;
            if (q.includes('autoMergeAllowed') && q.includes('issues(')) {
              options.body.query = q
                .replace(/,\s*\$user:\s*String/, '')
                .replace(/issues\s*\([^)]*\)\s*\{[\s\S]*?\}\s*\}/g, '');
              if (options.body.variables && 'user' in options.body.variables) {
                delete options.body.variables.user;
              }
            } else if (q.includes('$count: Int') && q.includes('issues(')) {
              return {
                statusCode: 200,
                body: {
                  data: {
                    repository: {
                      issues: {
                        pageInfo: {
                          endCursor: null,
                          hasNextPage: false,
                        },
                        nodes: [],
                      },
                    },
                  },
                },
              };
            }
          }
          return await origPostJson.call(this, url, options);
        };
      }
    } catch (e) {
      // ignore
    }

    const runtimeValue = (name) =>
      fs.readFileSync(`/renovate/runtime/${name}`, 'utf8').trim();

    module.exports = {
      platform: 'github',
      token: runtimeValue('github-token'),
      gitAuthor: 'Renovate Bot <renovate-bot@imcherry5778.xyz>',
      repositories: ['ktcloud4-bean/hr-system'],
      autodiscover: false,
      onboarding: false,
      requireConfig: 'ignored',
      enabledManagers: ['npm', 'pip_requirements'],
      dependencyDashboard: false,
      baseBranchPatterns: ['main'],
      prCreation: 'immediate',
      branchPrefix: 'renovate/',
      branchConcurrentLimit: 1,
      prConcurrentLimit: 1,
      prHourlyLimit: 0,
      automerge: false,
      platformAutomerge: false,
      allowScripts: false,
      baseDir: '/tmp/renovate/repos',
      cacheDir: '/tmp/renovate/cache',
      packageRules: [
        {
          matchManagers: ['npm', 'pip_requirements'],
          automerge: false,
          platformAutomerge: false,
        },
      ],
    };
