pageInfo:
  title: Platform Access
  description: 그룹별 온프레미스 애플리케이션 포털

appConfig:
  theme: dashy-docs
  layout: auto
  startingView: minimal
  customCss: "body,h1,h2,h3,p,a,input,.tile-title .text,.description,.item-url{color:#fff!important}::placeholder{color:#fff!important;opacity:.7}"
  preventWriteToDisk: true
  disableConfigurationForNonAdmin: true
  enableServiceWorker: false
  auth:
    enableKeycloak: true
    enableGuestAccess: false
    keycloak:
      serverUrl: https://sso.imcherry5778.xyz
      realm: platform
      clientId: dashy-portal

sections:
  - name: Platform
    icon: fas fa-shield-halved
    items:
      - title: Headlamp
        description: 사용자 OIDC token과 Kubernetes RBAC 기반 클러스터 콘솔
        icon: favicon-local
        url: https://headlamp.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
            - /platform-privileged
      - title: Gitea
        description: Pomerium groups claim과 Gitea OIDC로 보호된 소스 저장소 UI
        icon: si-gitea
        color: "#609926"
        url: https://git.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
      - title: HR 직원 포털
        description: Keycloak HR 사용자 그룹으로 제한된 직원 셀프서비스 포털
        icon: fas fa-id-card
        url: https://www.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /hr-users
            - /hr-admins
      - title: HR 관리자
        description: Keycloak HR 관리자 그룹과 애플리케이션 HR 권한이 모두 필요한 관리 포털
        icon: fas fa-user-tie
        url: https://admin.imcherry5778.xyz
