        displayData:
          showForGroups:
            - /hr-admins
      - title: AWX
        description: check 기본값과 사람 승인 apply 경계의 자동화 UI
        icon: favicon-local
        url: https://awx.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
