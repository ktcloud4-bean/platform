pageInfo:
  title: Platform Access
  description: 그룹별 온프레미스 애플리케이션 포털

appConfig:
  theme: dashy-docs
  layout: auto
  preventWriteToDisk: true
  disableConfigurationForNonAdmin: true
  enableServiceWorker: false
  auth:
    enableKeycloak: true
    enableGuestAccess: false
    keycloak:
      serverUrl: https://sso.imcherry5778.xyz
      realm: platform
      clientId: dashy-portal

sections:
  - name: Platform
    icon: fas fa-shield-halved
    items:
      - title: POM-01 보호 Route
        description: /platform-users groups claim 검증
        icon: fas fa-user-shield
        url: https://access.imcherry5778.xyz/pom01-platform-user-check
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
      - title: Headlamp
        description: 사용자 OIDC token과 Kubernetes RBAC 기반 클러스터 콘솔
        icon: fas fa-compass
        url: https://headlamp.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
            - /platform-privileged
      - title: Gitea
        description: Pomerium groups claim과 Gitea OIDC로 보호된 소스 저장소 UI
        icon: fab fa-git-alt
        url: https://git.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
      - title: AWX
        description: check 기본값과 사람 승인 apply 경계의 자동화 UI
        icon: fas fa-robot
        url: https://awx.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
            - /platform-privileged
      - title: Harbor
        description: 내부 OCI registry와 project 관리 UI
        icon: fas fa-boxes-stacked
        url: https://harbor.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
            - /platform-privileged
      - title: SonarQube
        description: 정적 분석과 quality gate UI
        icon: fas fa-magnifying-glass-chart
        url: https://sonar.imcherry5778.xyz
        target: sametab
        displayData:
          showForGroups:
            - /platform-users
