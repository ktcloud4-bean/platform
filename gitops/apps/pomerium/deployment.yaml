apiVersion: apps/v1
kind: Deployment
metadata:
  name: pomerium
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pomerium
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: platform-gitops
    spec:
      serviceAccountName: pomerium
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: harbor.imcherry5778.xyz/curated-platform/vault@sha256:18ceda087817a9e0dbed22fb632225fdc079f1b909bc0ff94d00ade4c4990e9f
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - -config=/vault/config/runtime.hcl
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config
              readOnly: true
            - name: vault-trust
              mountPath: /vault/tls
              readOnly: true
            - name: pomerium-secrets
              mountPath: /pomerium/secrets
            - name: vault-agent-tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      containers:
        - name: pomerium
          image: harbor.imcherry5778.xyz/curated-platform/pomerium@sha256:9f0ba711a72d9b15d4d8d037e47c88a5b5e2294be53d862c8cfde30f251bc139
          imagePullPolicy: IfNotPresent
          env:
            - name: XDG_CACHE_HOME
              value: /data/cache
          args:
            - --config
            - /pomerium/config/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 28080
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/pomerium
                - health
                - --health-addr
                - 127.0.0.1:28080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /bin/pomerium
                - health
                - --health-addr
                - 127.0.0.1:28080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/pomerium
                - health
                - --health-addr
                - 127.0.0.1:28080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: pomerium-config
              mountPath: /pomerium/config
              readOnly: true
            - name: pomerium-secrets
              mountPath: /pomerium/secrets
              readOnly: true
            - name: pomerium-data
              mountPath: /data
            - name: pomerium-tmp
              mountPath: /tmp
      volumes:
        - name: pomerium-config
          configMap:
            name: pomerium-config
        - name: vault-agent-config
          configMap:
            name: pomerium-vault-agent
            items:
              - key: runtime.hcl
                path: runtime.hcl
        - name: vault-trust
          configMap:
            name: pomerium-vault-trust
        - name: pomerium-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: vault-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: pomerium-data
          emptyDir:
            sizeLimit: 64Mi
        - name: pomerium-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
                  audience: vault
