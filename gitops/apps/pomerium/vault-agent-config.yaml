apiVersion: v1
kind: ConfigMap
metadata:
  name: pomerium-vault-agent
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: secret-consumer
    app.kubernetes.io/part-of: platform-gitops
data:
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "pomerium"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/pomerium/secrets/idp-client-secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/pomerium/runtime" -}}{{ .Data.data.idp_client_secret }}{{- end -}}
    EOT
    }

    template {
      destination          = "/pomerium/secrets/shared-secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/pomerium/runtime" -}}{{ .Data.data.shared_secret }}{{- end -}}
    EOT
    }

    template {
      destination          = "/pomerium/secrets/cookie-secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/pomerium/runtime" -}}{{ .Data.data.cookie_secret }}{{- end -}}
    EOT
    }

    template {
      destination          = "/pomerium/secrets/signing-key.pem"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/pomerium/runtime" -}}{{ .Data.data.signing_key }}{{- end -}}
    EOT
    }
