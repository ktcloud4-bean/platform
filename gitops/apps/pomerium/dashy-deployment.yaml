apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: dashy
    app.kubernetes.io/component: portal
    app.kubernetes.io/part-of: platform-gitops
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashy
      app.kubernetes.io/component: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashy
        app.kubernetes.io/component: portal
        app.kubernetes.io/part-of: platform-gitops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashy
          image: docker.io/lissy93/dashy:4.5.0@sha256:54d5ba3eff1fe31856fda9eed06e64e3f4ab2a4473c2bbf81b13a9bff6cba7dd
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: DISABLE_CONFIG_BACKUPS
              value: "true"
            - name: DISABLE_PROXY_ENDPOINTS
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: dashy-config
              mountPath: /app/user-data
              readOnly: true
            - name: dashy-tmp
              mountPath: /tmp
            - name: dashy-cache
              mountPath: /app/.cache
      volumes:
        - name: dashy-config
          configMap:
            name: dashy-config
        - name: dashy-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: dashy-cache
          emptyDir:
            sizeLimit: 64Mi
