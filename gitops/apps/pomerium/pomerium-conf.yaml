address: :8080
insecure_server: true
health_check_addr: :28080
log_level: info

# Pomerium은 보호 Route와 다른 authenticate URL을 요구한다. access alias 외의
# DNS 변경을 만들지 않기 위해 이미 내부 DNS와 공인 인증서가 있는 k3s canonical
# 이름을 OIDC callback에만 사용한다.
authenticate_service_url: https://k3s-01.imcherry5778.xyz
signout_redirect_url: https://access.imcherry5778.xyz/

shared_secret_file: /pomerium/secrets/shared-secret
cookie_secret_file: /pomerium/secrets/cookie-secret
signing_key_file: /pomerium/secrets/signing-key.pem
cookie_expire: 5m
cookie_http_only: true
cookie_same_site: lax

idp_provider: oidc
idp_provider_url: https://sso.imcherry5778.xyz/realms/platform
idp_client_id: pomerium
idp_client_secret_file: /pomerium/secrets/idp-client-secret
idp_scopes:
  - openid
  - profile
  - email

# AWS-HR-01-FIX-03: `pass_identity_headers`는 signed assertion만으로는
# 애플리케이션이 요구하는 claim header를 만들지 않는다. 이 mapping으로 OIDC email
# claim을 명시적으로 header화한다. 전달은 `pass_identity_headers`를 켠 HR 두 Route에만
# 한정되며, application 권한 판정은 계속 upstream이 소유한다.
jwt_claims_headers:
  X-Pomerium-Claim-Email: email

# 외부 X-Forwarded-For는 Traefik이 버리고 자기 관측값으로 다시 만들며,
# Pomerium은 바로 앞 Traefik 한 hop만 신뢰한다.
xff_num_trusted_hops: 1

routes:
  # Core에서는 Enterprise Directory Sync 전용 groups criterion이 아니라
  # Keycloak이 발급한 OIDC claim 자체를 claim/groups로 판정한다.
  - name: platform-user-check
    description: POM-01 platform-users 최소권한 검증 Route
    from: https://access.imcherry5778.xyz
    path: /pom01-platform-user-check
    response:
      status: 200
      body: "POM-01 protected route\n"
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # Dashy는 포털 UI만 제공한다. 포털 자체도 Pomerium 뒤에 두고 명시적
  # 그룹이 없는 사용자는 로그인 성공 여부와 무관하게 통과시키지 않는다.
  - name: access-portal
    description: POM-01 Dashy application portal
    from: https://access.imcherry5778.xyz
    to: http://dashy.pomerium.svc.cluster.local:8080
    policy:
      - allow:
          or:
            - claim/groups: /platform-users
            - claim/groups: /platform-privileged

  # AWS-HR-01: browser identity admission은 Pomerium의 OIDC groups claim으로 먼저
  # 제한한다. internal ALB에는 IPsec으로만 도달하며, DB role/is_hr 판정은 upstream
  # application이 다시 수행한다. stable private alias는 tofu-app-routing이 소유한다.
  - name: hr-system-www
    description: AWS-HR-02 HR-user or HR-admin employee self-service through private EKS ALB
    from: https://www.imcherry5778.xyz
    to: http://hr-system.alb.aws.imcherry5778.xyz
    preserve_host_header: true
    pass_identity_headers: true
    policy:
      - allow:
          or:
            - claim/groups: /hr-users
            - claim/groups: /hr-admins

  - name: hr-system-admin
    description: AWS-HR-01 HR administration through private EKS ALB
    from: https://admin.imcherry5778.xyz
    to: http://hr-system.alb.aws.imcherry5778.xyz
    preserve_host_header: true
    pass_identity_headers: true
    policy:
      - allow:
          or:
            - claim/groups: /hr-admins

  # HEADLAMP-02: Pomerium은 browser Route 입장만 groups claim으로 판정한다.
  # upstream Headlamp에는 Pomerium token/header를 권한으로 전달하지 않으며,
  # Keycloak OIDC ID token과 Kubernetes RBAC가 API 요청마다 별도로 판정한다.
  - name: headlamp
    description: HEADLAMP-02 Keycloak OIDC Kubernetes RBAC console
    from: https://headlamp.imcherry5778.xyz
    to: http://headlamp.headlamp.svc.cluster.local:80
    # Headlamp terminal은 Kubernetes exec의 WebSocket upgrade를 사용한다.
    # 다른 Route에는 upgrade를 열지 않고 이 웹 Route에만 한정한다.
    allow_websockets: true
    policy:
      - allow:
          or:
            - claim/groups: /platform-users
            - claim/groups: /platform-privileged

  # SCM-01: 브라우저 UI만 Pomerium이 보호한다. Git clone/push는 HTTP Git을
  # 비활성화한 Gitea의 별도 SSH NodePort 경로가 소유한다.
  - name: gitea
    description: SCM-01 Gitea browser UI
    from: https://git.imcherry5778.xyz
    to: http://gitea-http.gitea.svc.cluster.local:3000
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # AWX-01: browser 진입은 정확한 Keycloak groups claim만 허용한다.
  # authenticated_user, email/domain 같은 fallback 정책은 두지 않는다.
  - name: awx
    description: AWX-01 Keycloak OIDC 및 AWX 조직·팀 RBAC 자동화 UI
    from: https://awx.imcherry5778.xyz
    to: http://awx-service.awx.svc.cluster.local:80
    preserve_host_header: true
    allow_websockets: true
    policy:
      - allow:
          or:
            - claim/groups: /platform-users
            - claim/groups: /platform-privileged

  # REG-01: browser UI만 Pomerium이 판정한다. Docker/OCI client의 /v2/와
  # /service/ token service는 별도 Traefik Ingress가 Harbor로 직접 전달한다.
  - name: harbor-ui
    description: REG-01 Harbor browser UI
    from: https://harbor.imcherry5778.xyz
    to: http://harbor.harbor.svc.cluster.local:80
    policy:
      - allow:
          or:
            - claim/groups: /platform-users
            - claim/groups: /platform-privileged

  # QUALITY-01: 브라우저 UI만 Pomerium과 Keycloak OIDC를 먼저 통과한다.
  # scanner/Web API는 이 Route를 쓰지 않고 cluster-internal Service와 Sonar token을 쓴다.
  - name: sonarqube
    description: QUALITY-01 SonarQube Community Build browser UI
    from: https://sonar.imcherry5778.xyz
    to: http://sonarqube.sonarqube.svc.cluster.local:9000
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # CI-01: browser UI만 Pomerium이 판정한다. Jenkins 자체 local realm이 뒤에서
  # 다시 판정하며, 동적 agent의 inbound JNLP는 이 Route를 쓰지 않고 cluster
  # 내부 Service/jenkins-agent:50000만 쓴다.
  - name: jenkins
    description: CI-01 Jenkins controller browser UI
    from: https://jenkins.imcherry5778.xyz
    to: http://jenkins.jenkins.svc.cluster.local:8080
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # GITOPS-02: browser UI만 Pomerium이 판정하며 이 claim은 argo.imcherry5778.xyz
  # 웹 route 진입만 허용한다. Argo CD 자체 권한은 argocd-cm/argocd-rbac-cm의
  # 자체 OIDC·RBAC(gitops/bootstrap/argocd/argocd-rbac-cm.patch.yaml)가 별도로
  # 판정하며 이 Route policy가 대신하지 않는다. argocd-server는 자체서명 TLS로만
  # 서비스하므로 이 Route에서만 tls_skip_verify를 둔다.
  - name: argocd
    description: GITOPS-02 Argo CD browser UI; 실제 권한은 Argo 자체 OIDC·RBAC가 판정
    from: https://argo.imcherry5778.xyz
    to: https://argocd-server.argocd.svc.cluster.local
    tls_skip_verify: true
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # OBS-02: 세 UI는 Pomerium과 Keycloak OIDC를 먼저 통과한다. Grafana는
  # 자체 admin login을 계속 사용하며 그 credential은 Vault Agent 경로만 소유한다.
  - name: grafana
    description: OBS-02 Grafana node PVC Loki 운영 대시보드
    from: https://grafana.imcherry5778.xyz
    to: http://obs-grafana.obs.svc.cluster.local:80
    allow_websockets: true
    preserve_host_header: true
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  - name: prometheus
    description: OBS-02 Prometheus targets and PromQL UI
    from: https://prometheus.imcherry5778.xyz
    to: http://obs-prometheus.obs.svc.cluster.local:9090
    policy:
      - allow:
          or:
            - claim/groups: /platform-users

  # Alertmanager UI의 조회는 platform-users에 열되, silence 생성·삭제 같은
  # HTTP write는 platform-privileged claim만 통과시킨다.
  - name: alertmanager
    description: OBS-02 Alertmanager UI and privileged silence writes
    from: https://alertmanager.imcherry5778.xyz
    to: http://obs-alertmanager.obs.svc.cluster.local:9093
    policy:
      - allow:
          and:
            - claim/groups: /platform-users
            - http_method:
                in: [GET, HEAD]
      - allow:
          or:
            - claim/groups: /platform-privileged

  # WAZUH-02: 사고 조사 도구라 일상 계정(/platform-users)은 통과시키지 않는다.
  # /platform-privileged만 허용하고, indexer·API 자격증명은 Dashboard Pod의 Vault Agent가
  # 별도로 판정한다(이 Route policy는 Pomerium 진입만 판정한다).
  - name: wazuh
    description: WAZUH-02 Wazuh Dashboard security investigation UI; privileged accounts only
    from: https://wazuh.imcherry5778.xyz
    to: http://wazuh-dashboard.wazuh.svc.cluster.local:5601
    policy:
      - allow:
          or:
            - claim/groups: /platform-privileged

  # IAM-01: Route 진입은 세 SOAR 그룹만 허용하고 Shuffle이 전용 client role로
  # 내부 인가를 다시 판정한다. 일반 platform-users membership만으로는 통과할 수 없다.
  - name: shuffle
    description: IAM-01 Shuffle SOAR route; reader, operator, privileged groups only
    from: https://shuffle.imcherry5778.xyz
    to: http://shuffle-frontend.shuffle.svc.cluster.local:8080
    policy:
      - allow:
          or:
            - claim/groups: /soar-readers
            - claim/groups: /soar-operators
            - claim/groups: /platform-privileged
