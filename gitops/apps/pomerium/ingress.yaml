apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pomerium
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt-production
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: platform-gitops
spec:
  ingressClassName: traefik
  rules:
    - host: access.imcherry5778.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pomerium
                port:
                  name: http
    - host: k3s-01.imcherry5778.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pomerium
                port:
                  name: http
  tls:
    - hosts:
        - access.imcherry5778.xyz
        - k3s-01.imcherry5778.xyz
