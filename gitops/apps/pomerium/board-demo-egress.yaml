apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-pomerium-egress
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: board-demo}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: board-demo
              app.kubernetes.io/component: application
      ports: [{protocol: TCP, port: 3000}]
