apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aws-hr-01-pomerium-to-private-alb
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  # NetworkPolicy는 dynamic internal ALB의 security group을 selector로 쓸 수 없다.
  # VPN destination VPC/80만 열고, ALB SG는 on-prem PLATFORM CIDR 하나를 다시 제한한다.
  egress:
    - to: [{ipBlock: {cidr: 10.20.0.0/16}}]
      ports: [{protocol: TCP, port: 80}]
