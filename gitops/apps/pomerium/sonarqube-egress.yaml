apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quality-01-pomerium-to-sonarqube
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sonarqube
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sonarqube
              app.kubernetes.io/component: server
      ports:
        - port: 9000
          protocol: TCP
