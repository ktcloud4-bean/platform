apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-onprem-01-pomerium-to-portal
  namespace: pomerium
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: pomerium
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pomerium
      app.kubernetes.io/component: server
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: demo-onprem
          podSelector:
            matchLabels:
              app.kubernetes.io/name: demo-onprem-portal
      ports:
        - {port: 8080, protocol: TCP}
