apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  # JCasC와 plugin 목록은 hash suffix로 rollout을 강제한다.
  - name: jenkins-casc
    namespace: jenkins
    files:
      - jenkins.yaml
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: platform-gitops
  - name: jenkins-plugin-list
    namespace: jenkins
    files:
      - plugins.txt
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: platform-gitops
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - trust-bundle.yaml
  - vault-agent-config.yaml
  - agent-buildah-config.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
