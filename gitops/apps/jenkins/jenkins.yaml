# CI-01 Jenkins Configuration as Code. UI 수동 설정은 정상 상태가 아니다.
# ${key}는 SECRETS 디렉터리(/vault/secrets)의 파일 이름이며 값은 Vault Agent init이
# 메모리 emptyDir에 렌더링한다. 이 파일에는 어떤 비밀 원문도 없다.
jenkins:
  systemMessage: "CI-01 Jenkins controller. 선언은 GitOps와 JCasC가 소유한다."
  # 모든 build는 동적 Kubernetes agent에서만 돈다. controller executor는 0이다.
  numExecutors: 0
  mode: EXCLUSIVE
  quietPeriod: 0
  slaveAgentPort: 50000
  disableRememberMe: true
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
        - id: "admin"
          name: "CI-01 local recovery admin"
          password: "${jenkins_admin_password}"
  # 사용자는 위 admin 하나뿐이고 익명 읽기는 없다. 별도 matrix-auth 플러그인을
  # 추가하지 않고 core 전략으로 같은 경계를 만든다.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer: "standard"
  clouds:
    - kubernetes:
        name: "k3s-01"
        namespace: "jenkins"
        # in-cluster ServiceAccount로만 접속한다. kubeconfig credential은 없다.
        jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
        jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
        directConnection: false
        webSocket: false
        containerCapStr: "2"
        maxRequestsPerHostStr: "32"
        connectTimeout: 60
        readTimeout: 60
        retentionTimeout: 5
        usageRestricted: false
        templates:
          - name: "ci01-buildah"
            label: "ci01-buildah"
            namespace: "jenkins"
            serviceAccount: "jenkins-agent"
            nodeUsageMode: EXCLUSIVE
            idleMinutes: 0
            activeDeadlineSeconds: 1800
            slaveConnectTimeout: 600
            podRetention: "never"
            containers:
              - name: "jnlp"
                image: "docker.io/jenkins/inbound-agent:3384.v60d89463d9e0-1-alpine-jdk21@sha256:359f763a8f3f337690593d6f20e476d77d07d2a7adf9acf5ebcc57f994e0e19f"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                ttyEnabled: false
                resourceRequestCpu: "100m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "1"
                resourceLimitMemory: "1Gi"
              - name: "buildah"
                image: "quay.io/buildah/stable:v1.43.1@sha256:ca4edbaabf71ca330ec9b2714bf8e06c726a6e85ae215cfb1474d2e2c832aacb"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "infinity"
                ttyEnabled: false
                resourceRequestCpu: "200m"
                resourceRequestMemory: "512Mi"
                resourceLimitCpu: "2"
                resourceLimitMemory: "2Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/build"
                  - envVar:
                      key: "BUILDAH_ISOLATION"
                      value: "chroot"
                  - envVar:
                      key: "CONTAINERS_STORAGE_CONF"
                      value: "/etc/ci-01/storage.conf"
                  - envVar:
                      key: "REGISTRY_AUTH_FILE"
                      value: "/home/build/auth.json"
              - name: "trivy"
                image: "docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "infinity"
                ttyEnabled: false
                resourceRequestCpu: "100m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "1"
                resourceLimitMemory: "1Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/trivy"
              - name: "oras"
                image: "ghcr.io/oras-project/oras:v1.3.3@sha256:a4c54befd87d0366e0ba3ac3a9536a5288c8a3735acd3b635cdace59a2c559c8"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "infinity"
                ttyEnabled: false
                resourceRequestCpu: "20m"
                resourceRequestMemory: "64Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "256Mi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/oras"
              - name: "cosign"
                # 공식 dev variant만 shell을 포함한다. release·source·index digest는
                # release-metadata.env가 소유한다.
                image: "ghcr.io/sigstore/cosign/cosign:v3.1.2-dev@sha256:3e3b4a13f159ebfb188744622136a16a079c42d52ce502f6221f27575ee86b7e"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                command: "/busybox/sleep"
                args: "infinity"
                ttyEnabled: false
                resourceRequestCpu: "20m"
                resourceRequestMemory: "64Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "256Mi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/home/cosign"
                  # Cosign 3.1.2는 OCI 1.1 referrer mode를 이 명시적 gate 뒤에 둔다.
                  - envVar:
                      key: "COSIGN_EXPERIMENTAL"
                      value: "1"
              - name: "sonar"
                image: "docker.io/sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1@sha256:23ca0f137965d9dff2198074043fd48d386280bc5d0ccac8c8349cea4cf096a9"
                alwaysPullImage: false
                workingDir: "/home/jenkins/agent"
                command: "sleep"
                args: "infinity"
                ttyEnabled: false
                resourceRequestCpu: "100m"
                resourceRequestMemory: "512Mi"
                resourceLimitCpu: "1"
                resourceLimitMemory: "2Gi"
                envVars:
                  - envVar:
                      key: "HOME"
                      value: "/opt/sonar-scanner/.sonar"
            # ContainerTemplate이 표현하지 못하는 보안 경계는 raw Pod spec으로 덮는다.
            # root·privileged·Docker socket·hostPath는 어느 계층에도 없다.
            yamlMergeStrategy: "merge"
            yaml: |
              apiVersion: v1
              kind: Pod
              spec:
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  runAsGroup: 1000
                  fsGroup: 1000
                  fsGroupChangePolicy: OnRootMismatch
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: jnlp
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: false
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop: ["ALL"]
                  - name: buildah
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: false
                      # rootless builder는 자기 user namespace를 만들어야 하는데
                      # RuntimeDefault profile은 CAP_SYS_ADMIN 없는 unshare(CLONE_NEWUSER)를
                      # 거부한다. 대안인 CAP_SYS_ADMIN 부여가 더 큰 권한이라 이 container
                      # 하나만 완화한다. 근거와 재검토 조건은 README가 소유한다.
                      seccompProfile:
                        type: Unconfined
                      capabilities:
                        drop: ["ALL"]
                        # copier subprocess가 build context를 chroot로 가둔다.
                        # CAP_SYS_ADMIN은 없다.
                        add: ["SYS_CHROOT"]
                    volumeMounts:
                      - name: buildah-home
                        mountPath: /home/build
                      - name: buildah-config
                        mountPath: /etc/ci-01
                        readOnly: true
                  - name: trivy
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: true
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: trivy-cache
                        mountPath: /var/cache/trivy
                        readOnly: true
                      - name: trivy-home
                        mountPath: /home/trivy
                      - name: trivy-tmp
                        mountPath: /tmp
                  - name: oras
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: true
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: oras-home
                        mountPath: /home/oras
                      - name: oras-tmp
                        mountPath: /tmp
                  - name: cosign
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: true
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: cosign-home
                        mountPath: /home/cosign
                      - name: cosign-tmp
                        mountPath: /tmp
                  - name: sonar
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      allowPrivilegeEscalation: false
                      privileged: false
                      readOnlyRootFilesystem: true
                      seccompProfile:
                        type: RuntimeDefault
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - name: sonar-home
                        mountPath: /opt/sonar-scanner/.sonar
                      - name: sonar-tmp
                        mountPath: /tmp
                volumes:
                  - name: buildah-home
                    emptyDir:
                      sizeLimit: 6Gi
                  - name: buildah-config
                    configMap:
                      name: jenkins-agent-buildah
                  - name: trivy-cache
                    persistentVolumeClaim:
                      claimName: trivy-cache
                  - name: trivy-home
                    emptyDir:
                      medium: Memory
                      sizeLimit: 8Mi
                  - name: trivy-tmp
                    emptyDir:
                      sizeLimit: 512Mi
                  - name: oras-home
                    emptyDir:
                      medium: Memory
                      sizeLimit: 8Mi
                  - name: oras-tmp
                    emptyDir:
                      sizeLimit: 64Mi
                  - name: cosign-home
                    emptyDir:
                      medium: Memory
                      sizeLimit: 8Mi
                  - name: cosign-tmp
                    emptyDir:
                      medium: Memory
                      sizeLimit: 16Mi
                  - name: sonar-home
                    emptyDir:
                      sizeLimit: 1Gi
                  - name: sonar-tmp
                    emptyDir:
                      sizeLimit: 1Gi

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "gitea-ci01"
              description: "CI-01 Gitea read-only deploy key"
              username: "git"
              privateKeySource:
                directEntry:
                  privateKey: "${gitea_ssh_private_key}"
          - usernamePassword:
              scope: GLOBAL
              id: "harbor-robot-ci01"
              description: "CI-01 Harbor project-scoped robot"
              username: "${harbor_robot_name}"
              password: "${harbor_robot_secret}"
          - string:
              scope: GLOBAL
              id: "cosign-private-key-sign01"
              description: "SIGN-01 Vault KV encrypted Cosign private key"
              secret: "${cosign_private_key}"
          - string:
              scope: GLOBAL
              id: "cosign-password-sign01"
              description: "SIGN-01 Cosign private key password"
              secret: "${cosign_password}"
          - string:
              scope: GLOBAL
              id: "cosign-public-key-sign01"
              description: "SIGN-01 active Cosign public key"
              secret: "${cosign_public_key}"
          - string:
              scope: GLOBAL
              id: "cosign-reject-public-key-sign01"
              description: "SIGN-01 fixed untrusted public key for the negative test"
              secret: "${cosign_reject_public_key}"
          - string:
              scope: GLOBAL
              id: "sonar-token-e2e01"
              description: "E2E-01 SonarQube project-scoped analysis token"
              secret: "${e2e01_sonar_token}"
          - usernamePassword:
              scope: GLOBAL
              id: "aws-credentials-ci01"
              description: "CI-01 AWS Credentials for OpenTofu Pipelines"
              username: "${aws_access_key_id}"
              password: "${aws_secret_access_key}"

security:
  # Gitea SSH host key는 known_hosts 파일이 아니라 선언한 값으로 고정한다.
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy:
      manuallyProvidedKeyVerificationStrategy:
        approvedHostKeys: "${gitea_known_hosts}"

unclassified:
  location:
    url: "https://jenkins.imcherry5778.xyz/"
    adminAddress: "ci-01@imcherry5778.xyz"
  buildDiscarders:
    configuredBuildDiscarders:
      - "jobBuildDiscarder"

jobs:
  - script: |
      pipelineJob('ci01-image-build') {
        description('E2E-01: Gitea checkout부터 Sonar/Trivy/Harbor/Cosign 동적 digest handoff까지')
        logRotator {
          numToKeep(20)
          artifactNumToKeep(0)
        }
        parameters {
          choiceParam('SCAN01_CASE', ['pass', 'fail'], 'SCAN-01 gate 검증 입력. 기본 pass이며 fail은 push 전에 종료한다.')
          choiceParam('SIGN01_CASE', ['off', 'pass', 'reject'], 'pass는 현재 build digest를 서명하고 reject는 현재 digest를 다른 공개키로 거부한다.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/scm-recovery/ci01-build-smoke.git')
                  credentials('gitea-ci01')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
      pipelineJob('aws-opentofu-pipeline') {
        description('AWS OpenTofu 인프라 GitOps 파이프라인 (tofu-app-network, db, eks, ecr, backend 등)')
        logRotator {
          numToKeep(20)
          artifactNumToKeep(0)
        }
        parameters {
          choiceParam('TARGET_ROOT', [
            'tofu-app-network',
            'tofu-app-db',
            'tofu-app-eks',
            'tofu-app-ecr',
            'tofu-backend',
            'tofu-kms',
            'tofu-identity',
            'tofu-network',
            'tofu'
          ], '실행할 OpenTofu 인프라 대상을 선택하세요.')
          choiceParam('ACTION', ['plan', 'apply'], '수행할 작업을 선택하세요 (plan = Dry-run, apply = 실제 반영)')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/scm-recovery/platform.git')
                  credentials('gitea-ci01')
                }
                branch('*/main')
              }
            }
            scriptPath('infra/aws/Jenkinsfile')
            lightweight(false)
          }
        }
      }
