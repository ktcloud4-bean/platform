apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: platform-gitops
# controller Pod는 kubelet 자동 마운트 대신 명시적 projected volume 두 개만 쓴다.
# 하나는 audience=vault init 전용, 다른 하나는 kubernetes plugin의 API 접근이다.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: platform-gitops
# 동적 build agent는 Kubernetes API도 Vault도 직접 호출하지 않는다.
automountServiceAccountToken: false
