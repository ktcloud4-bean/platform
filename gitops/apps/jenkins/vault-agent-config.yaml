apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-vault-agent
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: secret-consumer
    app.kubernetes.io/part-of: platform-gitops
data:
  # 파일 하나가 JCasC 변수 하나다. JCasC의 directory secret source는
  # SECRETS 디렉터리의 파일 이름을 그대로 ${key}로 치환한다.
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "jenkins"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/vault/secrets/jenkins_admin_password"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.admin_password }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/gitea_ssh_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.gitea_ssh_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/gitea_known_hosts"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.gitea_known_hosts }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/harbor_robot_name"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.harbor_robot_name }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/harbor_robot_secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.harbor_robot_secret }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_password"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_password }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_public_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_public_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_reject_public_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_reject_public_key }}
    {{- end -}}
    EOT
    }
