apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-vault-agent
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: secret-consumer
    app.kubernetes.io/part-of: platform-gitops
data:
  # 파일 하나가 JCasC 변수 하나다. JCasC의 directory secret source는
  # SECRETS 디렉터리의 파일 이름을 그대로 ${key}로 치환한다.
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "jenkins"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/vault/secrets/jenkins_admin_password"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.admin_password }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/gitea_ssh_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.gitea_ssh_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/gitea_known_hosts"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.gitea_known_hosts }}
    {{- end -}}
    EOT
    }

    # SUPPLY-07/08: Gitea source key와 Harbor robot 자격증명만 Vault에서 읽는다.
    template {
      destination          = "/vault/secrets/hr_system_gitea_ssh_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/aws-hr-01/jenkins" -}}
    {{ .Data.data.gitea_ssh_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/hr_system_harbor_robot_name"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/aws-hr-01/jenkins" -}}
    {{ .Data.data.harbor_robot_name }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/hr_system_harbor_robot_secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/aws-hr-01/jenkins" -}}
    {{ .Data.data.harbor_robot_secret }}
    {{- end -}}
    EOT
    }

    # AWX-04은 기존 CI-01 bundle을 넓히지 않고 전용 경로에서 source key와
    # Harbor push robot만 받는다.
    template {
      destination          = "/vault/secrets/awx04_gitea_ssh_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/awx/jenkins" -}}
    {{ .Data.data.gitea_ssh_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/awx04_gitea_known_hosts"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/awx/jenkins" -}}
    {{ .Data.data.gitea_known_hosts }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/awx04_harbor_robot_name"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/awx/jenkins" -}}
    {{ .Data.data.harbor_robot_name }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/awx04_harbor_robot_secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/awx/jenkins" -}}
    {{ .Data.data.harbor_robot_secret }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/harbor_robot_name"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.harbor_robot_name }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/harbor_robot_secret"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.harbor_robot_secret }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_private_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_private_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_password"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_password }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_public_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_public_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/cosign_reject_public_key"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.cosign_reject_public_key }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/e2e01_sonar_token"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/e2e-01/jenkins" -}}
    {{ .Data.data.sonar_token }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/aws_access_key_id"
      perms                = "0400"
      error_on_missing_key = false
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.aws_access_key_id }}
    {{- end -}}
    EOT
    }

    template {
      destination          = "/vault/secrets/aws_secret_access_key"
      perms                = "0400"
      error_on_missing_key = false
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.aws_secret_access_key }}
    {{- end -}}
    EOT
    }

    # AWS-CI-FIX-01은 GitHub platform repository 하나만 읽는 deploy key를 별도 소비한다.
    template {
      destination          = "/vault/secrets/github_platform_ssh_private_key"
      perms                = "0400"
      error_on_missing_key = false
      contents             = <<EOT
    {{- with secret "kv/data/jenkins/runtime" -}}
    {{ .Data.data.github_platform_ssh_private_key }}
    {{- end -}}
    EOT
    }
