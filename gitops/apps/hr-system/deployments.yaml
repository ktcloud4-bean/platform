apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: hr-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: employee-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: hr-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app.kubernetes.io/name: employee-service}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employee-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: hr-system
    spec:
      serviceAccountName: employee-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: employee-service
          image: 465137780685.dkr.ecr.ap-northeast-2.amazonaws.com/hr-system-prod-employee-service@sha256:3fc77838e832d4536c230c11d37149656fd5aa05a64d43fdaf0f43be6ac3f9b4
          imagePullPolicy: IfNotPresent
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - {name: DB_SECRET_ARN, value: hr-system-prod/employee-service/database}
            - {name: DB_SSLMODE, value: require}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports: [{name: http, containerPort: 8000, protocol: TCP}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
