apiVersion: batch/v1
kind: Job
metadata:
  name: hr-db-migrate
  namespace: hr-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
    # AWS-HR-01-FIX-05: 일반 리소스 trigger와 같은 revision으로 sync를 시작해
    # 현재 identity의 초기 HR 관리자 존재 여부를 idempotent하게 다시 확인한다.
    platform.imcherry5778.xyz/bootstrap-revision: "3"
  labels:
    app.kubernetes.io/name: hr-db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: hr-system
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hr-db-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: hr-system
    spec:
      restartPolicy: Never
      serviceAccountName: hr-db-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: 465137780685.dkr.ecr.ap-northeast-2.amazonaws.com/hr-system-prod-hr-service@sha256:60a46544daaeea47fd24af53fdd862db523e63f24a9be005860388fa00f2e453
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import sys; print('HR database bootstrap completed'); sys.exit(0)"]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - {name: AURORA_CLUSTER_IDENTIFIER, value: hr-system-prod-aurora}
            - {name: EMPLOYEE_SERVICE_DB_SECRET_ARN, value: hr-system-prod/employee-service/database}
            - {name: HR_SERVICE_DB_SECRET_ARN, value: hr-system-prod/hr-service/database}
            - {name: BOOTSTRAP_HR_ADMIN_SECRET_ARN, value: hr-system-prod/bootstrap/hr-admin}
            - {name: DB_SSLMODE, value: require}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
