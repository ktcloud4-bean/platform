apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: board-demo-runtime-secret-bootstrap
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: board-demo-runtime-secret-bootstrap
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: board-demo-vault-bootstrap
    namespace: board-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: board-demo-runtime-secret-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: board-demo-kyverno-public-key-reader
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["board-demo-cosign-current", "board-demo-cosign-previous"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: board-demo-kyverno-public-key-reader
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: board-demo-kyverno-public-key-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: board-demo-runtime-registry-bootstrap
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["board-demo-registry"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: board-demo-runtime-registry-bootstrap
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: board-demo-vault-bootstrap
    namespace: board-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: board-demo-runtime-registry-bootstrap
