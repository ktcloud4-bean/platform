apiVersion: v1
kind: ConfigMap
metadata:
  name: board-demo-secret-bootstrap-script
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: board-demo
    app.kubernetes.io/component: runtime-bootstrap
    app.kubernetes.io/part-of: platform-gitops
data:
  bootstrap.py: |
    #!/usr/bin/env python3
    import base64
    import json
    import ssl
    import urllib.error
    import urllib.request

    NAMESPACE = "board-demo"
    REGISTRY = "harbor.imcherry5778.xyz"
    API = "https://kubernetes.default.svc"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    with open(TOKEN_PATH, encoding="utf-8") as handle:
        token = handle.read().strip()
    context = ssl.create_default_context(cafile=CA_PATH)

    def read_value(path):
        with open(path, encoding="utf-8") as handle:
            value = handle.read().strip()
        if not value:
            raise RuntimeError(f"비어 있는 Vault 렌더링 값: {path}")
        return value

    def request(method, path, body=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(API + path, data=data, method=method, headers={
            "Authorization": f"Bearer {token}", "Content-Type": "application/json",
        })
        try:
            with urllib.request.urlopen(req, context=context, timeout=30) as response:
                return response.status, json.load(response)
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return 404, None
            raise

    def upsert(name, secret_type, values, namespace=NAMESPACE):
        base_path = f"/api/v1/namespaces/{namespace}/secrets"
        status, current = request("GET", f"{base_path}/{name}")
        manifest = {
            "apiVersion": "v1", "kind": "Secret",
            "metadata": {"name": name, "namespace": namespace, "labels": {
                "app.kubernetes.io/name": "board-demo",
                "app.kubernetes.io/component": "runtime-trust",
            }},
            "type": secret_type,
            "data": {key: base64.b64encode(value.encode()).decode() for key, value in values.items()},
        }
        if status == 404:
            request("POST", base_path, manifest)
        else:
            manifest["metadata"]["resourceVersion"] = current["metadata"]["resourceVersion"]
            request("PUT", f"{base_path}/{name}", manifest)
        print(f"BOARD-DEMO-01 runtime Secret 준비됨: {namespace}/{name}")

    upsert("board-demo-cosign-current", "Opaque", {"cosign.pub": read_value("/vault/secrets/cosign-current.pub")})
    upsert("board-demo-cosign-previous", "Opaque", {"cosign.pub": read_value("/vault/secrets/cosign-previous.pub")})
    robot_name = read_value("/vault/secrets/harbor-robot-name")
    robot_secret = read_value("/vault/secrets/harbor-robot-secret")
    auth = base64.b64encode(f"{robot_name}:{robot_secret}".encode()).decode()
    docker_config = json.dumps({"auths": {REGISTRY: {
        "username": robot_name, "password": robot_secret, "auth": auth,
    }}}, separators=(",", ":"))
    upsert("board-demo-registry", "kubernetes.io/dockerconfigjson", {".dockerconfigjson": docker_config})
    upsert("board-demo-registry", "kubernetes.io/dockerconfigjson", {".dockerconfigjson": docker_config}, namespace="kyverno")
