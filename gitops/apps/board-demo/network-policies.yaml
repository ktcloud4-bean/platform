apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-default-deny
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-dns-egress
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-vault-egress
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: vault}
          podSelector:
            matchLabels: {app.kubernetes.io/name: vault}
      ports:
        - {protocol: TCP, port: 8200}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-postgres-egress
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: board-demo
      app.kubernetes.io/component: application
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 10.10.50.10/32}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-bootstrap-kubernetes-api-egress
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: board-demo
      app.kubernetes.io/component: runtime-bootstrap
  policyTypes: [Egress]
  egress:
    # Service VIP가 아니라 kube-apiserver Endpoint에 적용되는 실제 egress를 허용한다.
    - to: [{ipBlock: {cidr: 10.10.20.10/32}}]
      ports: [{protocol: TCP, port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: board-demo-pomerium-ingress
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: board-demo
      app.kubernetes.io/component: application
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: pomerium}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
              app.kubernetes.io/component: server
      ports: [{protocol: TCP, port: 3000}]
