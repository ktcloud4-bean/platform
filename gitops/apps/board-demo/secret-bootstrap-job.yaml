apiVersion: batch/v1
kind: Job
metadata:
  name: board-demo-secret-bootstrap-v1
  namespace: board-demo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: board-demo
    app.kubernetes.io/component: runtime-bootstrap
    app.kubernetes.io/part-of: platform-gitops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: board-demo
        app.kubernetes.io/component: runtime-bootstrap
    spec:
      serviceAccountName: board-demo-vault-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: vault-agent
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          args: ["agent", "-config=/vault/config/bootstrap.hcl"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: vault-agent-config, mountPath: /vault/config, readOnly: true}
            - {name: trust, mountPath: /vault/tls, readOnly: true}
            - {name: rendered, mountPath: /vault/secrets}
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: bootstrap
          image: quay.io/ansible/awx-ee:24.6.1@sha256:89593d2a0268acacdbd1c075d8810ab50d961cf7769e36de19219bb6cb4efcc1
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/bootstrap.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: rendered, mountPath: /vault/secrets, readOnly: true}
            - {name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: vault-agent-config
          configMap: {name: board-demo-bootstrap-vault-agent}
        - name: script
          configMap: {name: board-demo-secret-bootstrap-script, defaultMode: 0550}
        - name: trust
          configMap: {name: board-demo-trust}
        - name: rendered
          emptyDir: {medium: Memory, sizeLimit: 4Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600, audience: vault}
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
