apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: board-demo-verify-release-image
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: BOARD-DEMO-01 signed release image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
  labels:
    app.kubernetes.io/name: board-demo
    app.kubernetes.io/component: admission
    app.kubernetes.io/part-of: platform-gitops
spec:
  failurePolicy: Fail
  evaluation:
    mode: Kubernetes
    admission: {enabled: true}
    background: {enabled: false}
  validationActions: [Deny]
  webhookConfiguration: {timeoutSeconds: 30}
  autogen:
    podControllers: {controllers: []}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: exact-board-demo-namespace
      expression: object.metadata.namespace == "board-demo"
  matchImageReferences:
    - glob: harbor.imcherry5778.xyz/board-demo/board-app*
  credentials:
    secrets: [board-demo-registry]
  variables:
    - name: currentTrust
      expression: resource.get("v1", "secrets", "board-demo", "board-demo-cosign-current")
    - name: currentKey
      expression: string(base64.decode(variables.currentTrust.data["cosign.pub"]))
    - name: previousTrust
      expression: resource.get("v1", "secrets", "board-demo", "board-demo-cosign-previous")
    - name: previousKey
      expression: string(base64.decode(variables.previousTrust.data["cosign.pub"]))
  attestors:
    - name: current
      cosign:
        key: {expression: variables.currentKey}
        ctlog: {url: https://rekor.sigstore.dev, insecureIgnoreTlog: true, insecureIgnoreSCT: true}
    - name: previous
      cosign:
        key: {expression: variables.previousKey}
        ctlog: {url: https://rekor.sigstore.dev, insecureIgnoreTlog: true, insecureIgnoreSCT: true}
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.current, attestors.previous])).all(count, count > 0)
      message: BOARD-DEMO-01 Cosign signature를 검증하지 못했다
