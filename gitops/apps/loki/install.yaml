        - args:
          - |-
            import json
            from pathlib import Path
            import ssl
            import time
            import urllib.request

            api = "https://kubernetes.default.svc/api/v1/events?watch=true&allowWatchBookmarks=false&timeoutSeconds=600"
            token_path = Path("/var/run/secrets/kubernetes.io/serviceaccount/token")
            ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
            context = ssl.create_default_context(cafile=ca_path)

            while True:
                try:
                    token = token_path.read_text(encoding="utf-8").strip()
                    request = urllib.request.Request(api, headers={"Authorization": "Bearer " + token})
                    with urllib.request.urlopen(request, context=context, timeout=620) as response:
                        for raw in response:
                            envelope = json.loads(raw)
                            if envelope.get("type") not in ("ADDED", "MODIFIED"):
                                continue
                            event = envelope.get("object") or {}
                            metadata = event.get("metadata") or {}
                            involved = event.get("involvedObject") or {}
                            source = event.get("source") or {}
                            record = {
                                "event_time": event.get("eventTime") or event.get("lastTimestamp") or metadata.get("creationTimestamp") or "",
                                "event_action": event.get("reason") or "",
                                "event_outcome": "unknown",
                                "observer_name": event.get("reportingController") or source.get("component") or "",
                                "resource_namespace": involved.get("namespace") or "",
                                "resource_kind": involved.get("kind") or "",
                                "resource_name": involved.get("name") or "",
                                "resource_uid": involved.get("uid") or "",
                                "reason": event.get("reason") or "",
                                "event_type": event.get("type") or "",
                                "count": event.get("count") or 0,
                            }
                            print(json.dumps(record, separators=(",", ":")), flush=True)
                except Exception:
                    time.sleep(2)
          command:
