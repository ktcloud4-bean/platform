apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: loki
  labels:
    helm.sh/chart: alloy-1.11.0
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: alloy
    app.kubernetes.io/version: "491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b30"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: alloy
    app.kubernetes.io/component: config
data:
  config.alloy: |-
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "falco" {
      targets = discovery.kubernetes.pods.targets
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "falco/falco"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "pod_uid"
      }
      rule {
        target_label = "app"
        replacement  = "falco"
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-01"
      }
    }

    discovery.relabel "pomerium" {
      targets = discovery.kubernetes.pods.targets
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "pomerium/pomerium"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "pod_uid"
      }
      rule {
        target_label = "app"
        replacement  = "pomerium"
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-01"
      }
    }

    discovery.relabel "vault" {
      targets = discovery.kubernetes.pods.targets
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "vault/vault"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "pod_uid"
      }
      rule {
        target_label = "app"
        replacement  = "vault"
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-01"
      }
    }

    discovery.relabel "keycloak" {
      targets = discovery.kubernetes.pods.targets
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "keycloak/keycloak"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "pod_uid"
      }
      rule {
        target_label = "app"
        replacement  = "keycloak"
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-01"
      }
    }

    discovery.relabel "kubernetes_events" {
      targets = discovery.kubernetes.pods.targets
      rule {
        action        = "keep"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "loki/kubernetes-events"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod_name"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid"]
        target_label  = "pod_uid"
      }
      rule {
        target_label = "app"
        replacement  = "kubernetes"
      }
      rule {
        target_label = "cluster"
        replacement  = "k3s-01"
      }
    }

    loki.source.kubernetes "falco" {
      targets    = discovery.relabel.falco.output
      forward_to = [loki.process.falco.receiver]
    }
    loki.process "falco" {
      forward_to = [loki.write.local.receiver]
      stage.drop {
        expression          = "^\\{"
        drop_counter_reason = "falco_security_json"
      }
      stage.template {
        source   = "source_level"
        template = "info"
      }
      stage.template {
        source   = "event_ingested"
        template = `{{ now | date "2006-01-02T15:04:05.999999999Z07:00" }}`
      }
      stage.template {
        source   = "safe_line"
        template = `{"event.class":"operation","event.action":"lifecycle","event.outcome":"unknown","event.source":"falco","event.dataset":"engine","observer.name":"falco","observer.type":"service","actor.kind":"none","correlation.kind":"none"}`
      }
      stage.output { source = "safe_line" }
      stage.static_labels { values = { event_class = "operation", retention = "O7" } }
      stage.labels { values = { level = "source_level" } }
      stage.structured_metadata { values = { pod_name = "", pod_uid = "", event_ingested = "" } }
      stage.label_keep { values = ["cluster", "namespace", "app", "container", "level", "event_class", "retention"] }
    }

    loki.source.kubernetes "pomerium" {
      targets    = discovery.relabel.pomerium.output
      forward_to = [loki.process.pomerium.receiver]
    }
    loki.process "pomerium" {
      forward_to = [loki.write.local.receiver]
      stage.drop {
        expression          = `"service"\s*:\s*"(authorize|authenticate|envoy|identity_manager)"`
        drop_counter_reason = "pomerium_security_or_access"
      }
      stage.drop {
        expression          = `"component"\s*:\s*"idp-token-session-creator"`
        drop_counter_reason = "pomerium_session"
      }
      stage.drop {
        expression          = `"(allow|deny|email|user|user-id|session-id|request-id|check-request-id|method|path|host|ip)"\s*:`
        drop_counter_reason = "pomerium_sensitive_context"
      }
      stage.json {
        expressions    = { source_level = "level" }
        drop_malformed = true
      }
      stage.regex {
        source     = "source_level"
        expression = "(?i)^(?P<allowed_level>warn|warning|error|fatal)$"
      }
      stage.drop {
        source              = "allowed_level"
        expression          = "^$"
        drop_counter_reason = "pomerium_not_allowlisted"
      }
      stage.template {
        source   = "allowed_level"
        template = `{{ .Value | ToLower }}`
      }
      stage.template {
        source   = "event_ingested"
        template = `{{ now | date "2006-01-02T15:04:05.999999999Z07:00" }}`
      }
      stage.template {
        source   = "safe_line"
        template = `{"event.class":"operation","event.action":"error","event.outcome":"unknown","event.source":"pomerium","event.dataset":"lifecycle","observer.name":"pomerium","observer.type":"service","actor.kind":"none","correlation.kind":"none"}`
      }
      stage.output { source = "safe_line" }
      stage.static_labels { values = { event_class = "operation", retention = "O7" } }
      stage.labels { values = { level = "allowed_level" } }
      stage.structured_metadata { values = { pod_name = "", pod_uid = "", event_ingested = "" } }
      stage.label_keep { values = ["cluster", "namespace", "app", "container", "level", "event_class", "retention"] }
    }

    loki.source.kubernetes "vault" {
      targets    = discovery.relabel.vault.output
      forward_to = [loki.process.vault.receiver]
    }
    loki.process "vault" {
      forward_to = [loki.write.local.receiver]
      stage.drop {
        expression          = "^\\{"
        drop_counter_reason = "vault_audit_json"
      }
      stage.regex { expression = "\\[(?P<allowed_level>TRACE|DEBUG|INFO|WARN|ERROR)\\]" }
      stage.drop {
        source              = "allowed_level"
        expression          = "^$"
        drop_counter_reason = "vault_not_allowlisted"
      }
      stage.template {
        source   = "allowed_level"
        template = `{{ .Value | ToLower }}`
      }
      stage.template {
        source   = "event_ingested"
        template = `{{ now | date "2006-01-02T15:04:05.999999999Z07:00" }}`
      }
      stage.template {
        source   = "safe_line"
        template = `{"event.class":"operation","event.action":"lifecycle","event.outcome":"unknown","event.source":"vault","event.dataset":"server","observer.name":"vault","observer.type":"service","actor.kind":"none","correlation.kind":"none"}`
      }
      stage.output { source = "safe_line" }
      stage.static_labels { values = { event_class = "operation", retention = "O7" } }
      stage.labels { values = { level = "allowed_level" } }
      stage.structured_metadata { values = { pod_name = "", pod_uid = "", event_ingested = "" } }
      stage.label_keep { values = ["cluster", "namespace", "app", "container", "level", "event_class", "retention"] }
    }

    loki.source.kubernetes "keycloak" {
      targets    = discovery.relabel.keycloak.output
      forward_to = [loki.process.keycloak.receiver]
    }
    loki.process "keycloak" {
      forward_to = [loki.write.local.receiver]
      stage.drop {
        expression          = "org\\.keycloak\\.events"
        drop_counter_reason = "keycloak_security_event"
      }
      stage.regex { expression = "[[:space:]](?P<allowed_level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)[[:space:]]" }
      stage.drop {
        source              = "allowed_level"
        expression          = "^$"
        drop_counter_reason = "keycloak_not_allowlisted"
      }
      stage.template {
        source   = "allowed_level"
        template = `{{ .Value | ToLower }}`
      }
      stage.template {
        source   = "event_ingested"
        template = `{{ now | date "2006-01-02T15:04:05.999999999Z07:00" }}`
      }
      stage.template {
        source   = "safe_line"
        template = `{"event.class":"operation","event.action":"lifecycle","event.outcome":"unknown","event.source":"keycloak","event.dataset":"server","observer.name":"keycloak","observer.type":"service","actor.kind":"none","correlation.kind":"none"}`
      }
      stage.output { source = "safe_line" }
      stage.static_labels { values = { event_class = "operation", retention = "O7" } }
      stage.labels { values = { level = "allowed_level" } }
      stage.structured_metadata { values = { pod_name = "", pod_uid = "", event_ingested = "" } }
      stage.label_keep { values = ["cluster", "namespace", "app", "container", "level", "event_class", "retention"] }
    }

    loki.source.kubernetes "kubernetes_events" {
      targets    = discovery.relabel.kubernetes_events.output
      forward_to = [loki.process.kubernetes_events.receiver]
    }
    loki.process "kubernetes_events" {
      forward_to = [loki.write.local.receiver]
      stage.json {
        drop_malformed = true
        expressions = {
          event_time         = "event_time",
          event_action       = "event_action",
          event_outcome      = "event_outcome",
          observer_name      = "observer_name",
          resource_namespace = "resource_namespace",
          resource_kind      = "resource_kind",
          resource_name      = "resource_name",
          resource_uid       = "resource_uid",
          reason             = "reason",
          event_type         = "event_type",
          count              = "count",
        }
      }
      stage.regex {
        source     = "event_type"
        expression = "^(?P<allowed_type>Normal|Warning)$"
      }
      stage.drop {
        source              = "allowed_type"
        expression          = "^$"
        drop_counter_reason = "kubernetes_event_not_allowlisted"
      }
      stage.template {
        source   = "allowed_type"
        template = `{{ if eq .Value "Normal" }}info{{ else }}warning{{ end }}`
      }
      stage.template {
        source   = "event_ingested"
        template = `{{ now | date "2006-01-02T15:04:05.999999999Z07:00" }}`
      }
      stage.template {
        source   = "safe_line"
        template = `{"event.class":"operation","event.action":"lifecycle","event.outcome":"unknown","event.source":"kubernetes","event.dataset":"core_v1_event","observer.name":"kubernetes","observer.type":"service","actor.kind":"none","correlation.kind":"none"}`
      }
      stage.output { source = "safe_line" }
      stage.static_labels { values = { event_class = "operation", retention = "O7" } }
      stage.labels { values = { level = "allowed_type" } }
      stage.structured_metadata {
        values = {
          collector_pod_name = "pod_name",
          collector_pod_uid  = "pod_uid",
          event_time         = "",
          event_ingested     = "",
          event_action       = "",
          event_outcome      = "",
          observer_name      = "",
          resource_namespace = "",
          resource_kind      = "",
          resource_name      = "",
          resource_uid       = "",
          reason             = "",
          count              = "",
        }
      }
      stage.label_keep { values = ["cluster", "namespace", "app", "container", "level", "event_class", "retention"] }
    }

    loki.write "local" {
      endpoint {
        url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        batch_size = "256KiB"
        batch_wait = "1s"
      }
      wal {
        enabled = false
      }
    }

