apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: loki
  labels:
    helm.sh/chart: loki-7.2.0
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "3.6.11"
data:
  config.yaml: |

    analytics:
      reporting_enabled: false
    auth_enabled: false
    bloom_build:
      builder:
        planner_address: ""
      enabled: false
    bloom_gateway:
      client:
        addresses: ""
      enabled: false
    common:
      compactor_grpc_address: 'loki.loki.svc.cluster.local:9095'
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          bucketnames: loki-chunks
          endpoint: s3.imcherry5778.xyz:8333
          http_config:
            ca_file: /etc/loki/s3/s3.crt
            idle_conn_timeout: 90s
            insecure_skip_verify: false
            response_header_timeout: 30s
          insecure: false
          region: us-east-1
          s3forcepathstyle: true
          signature_version: v4
    compactor:
      apply_retention_interval: 5m
      compaction_interval: 5m
      delete_request_store: s3
      retention_delete_delay: 2h
      retention_delete_worker_count: 1
      retention_enabled: true
      working_directory: /var/loki/compactor
    frontend:
      scheduler_address: ""
      tail_proxy_url: ""
    frontend_worker:
      scheduler_address: ""
    index_gateway:
      mode: simple
    ingester:
      chunk_idle_period: 2m
      chunk_retain_period: 30s
      max_chunk_age: 5m
    limits_config:
      allow_structured_metadata: true
      discover_log_levels: false
      discover_service_name: []
      ingestion_burst_size_mb: 2
      ingestion_rate_mb: 1
      max_cache_freshness_per_query: 10m
      max_entries_limit_per_query: 5000
      max_global_streams_per_user: 256
      max_line_size: 2048
      max_query_parallelism: 2
      query_timeout: 60s
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 168h
      split_queries_by_interval: 1h
      volume_enabled: false
    memberlist:
      join_members:
      - loki-memberlist.loki.svc.cluster.local
    pattern_ingester:
      enabled: false
    querier:
      max_concurrent: 2
    query_range:
      align_queries_with_step: true
    runtime_config:
      file: /etc/loki/runtime-config/runtime-config.yaml
    schema_config:
      configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: loki_index_
        object_store: s3
        schema: v13
        store: tsdb
    server:
      grpc_listen_port: 9095
      http_listen_port: 3100
      http_server_read_timeout: 60s
      http_server_write_timeout: 60s
    storage_config:
      bloom_shipper:
        working_directory: /var/loki/data/bloomshipper
      boltdb_shipper:
        index_gateway_client:
          server_address: ""
      hedging:
        at: 250ms
        max_per_second: 20
        up_to: 3
      tsdb_shipper:
        index_gateway_client:
          server_address: ""
      use_thanos_objstore: false
    tracing:
      enabled: false

