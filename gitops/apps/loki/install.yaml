  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: alloy
        checksum/config: 64d256503ed4422647551d64647617e2a8df030e94abd4c2ea799e88e321f3e
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/instance: alloy
