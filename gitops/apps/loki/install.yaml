    spec:
      serviceAccountName: loki
      automountServiceAccountToken: false
      enableServiceLinks: false

      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        - args:
          - agent
          - -config=/vault/config/vault-agent.hcl
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          name: vault-agent
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 10001
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
          - mountPath: /vault/config
            name: loki-runtime-config
            readOnly: true
          - mountPath: /vault/tls/vault.crt
            name: loki-runtime-config
            readOnly: true
            subPath: vault.crt
          - mountPath: /vault/secrets
            name: loki-runtime-secrets
          - mountPath: /tmp
            name: vault-agent-tmp
          - mountPath: /var/run/secrets/vault
            name: vault-token
            readOnly: true
      containers:
        - name: loki
          image: docker.io/grafana/loki@sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/config/config.yaml
            - -target=all
            - -config.expand-env=true
          ports:
            - name: http-metrics
              containerPort: 3100
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
            - name: http-memberlist
              containerPort: 7946
              protocol: TCP
          env:
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /vault/secrets/credentials
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/loki/config
            - name: runtime-config
              mountPath: /etc/loki/runtime-config
            - mountPath: /var/loki
              name: loki-runtime
            - mountPath: /vault/secrets
              name: loki-runtime-secrets
              readOnly: true
            - mountPath: /etc/loki/s3/s3.crt
              name: loki-runtime-config
              readOnly: true
              subPath: s3.crt
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: single-binary
                app.kubernetes.io/instance: 'loki'
                app.kubernetes.io/name: 'loki'
            topologyKey: kubernetes.io/hostname
      volumes:
        - name: tmp
          emptyDir: {}
