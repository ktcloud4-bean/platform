apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-indexer
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: indexer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-manager
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-bootstrap
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-dashboard
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: dashboard
automountServiceAccountToken: false
---
# WAZUH-06: notifier는 wazuh-manager SA를 재사용하지 않는다. 전용 SA·Vault role이
# 있어야 "manager는 Slack webhook을 읽을 수 없다"가 정책으로 성립한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-06-notifier
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: wazuh-06-notifier
automountServiceAccountToken: false
