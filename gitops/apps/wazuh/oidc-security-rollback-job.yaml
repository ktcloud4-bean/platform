# This file is intentionally outside kustomization.  During WAZUH-02-FIX-01
# rollback apply this Job before reverting the immutable Argo SHA, then delete
# the Job after it succeeds.  It removes only the declared OIDC auth domain and
# its `wazuh-admin` all_access mapping while retaining every other auth domain.
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-oidc-security-rollback-v1
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: oidc-security-rollback
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh
        app.kubernetes.io/component: oidc-security-rollback
    spec:
      restartPolicy: Never
      serviceAccountName: wazuh-bootstrap
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          args: [agent, -config=/vault/config/vault-agent.hcl]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config/vault-agent.hcl
              subPath: vault-agent-bootstrap.hcl
              readOnly: true
            - name: vault-agent-config
              mountPath: /vault/tls/vault.crt
              subPath: vault.crt
              readOnly: true
            - name: bootstrap-secrets
              mountPath: /vault/secrets
            - name: vault-agent-tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      containers:
        - name: renderer
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: [python3, -u, /opt/wazuh-02-fix-01/sync-oidc-security.py, render]
          env:
            - name: WAZUH_OIDC_MODE
              value: rollback
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: oidc-security-script
              mountPath: /opt/wazuh-02-fix-01/sync-oidc-security.py
              subPath: sync-oidc-security.py
              readOnly: true
            - name: bootstrap-secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: work
              mountPath: /work
            - name: work
              mountPath: /tmp
        - name: securityadmin
          image: docker.io/wazuh/wazuh-indexer:4.14.7@sha256:853230e332b3b171ee9c30db91186830d5d66461e8ee0173abb57ede5c4b5d37
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ec]
          args:
            - |
              for _ in $(seq 1 120); do
                test -s /work/securityconfig.json && break
                sleep 1
              done
              test -s /work/securityconfig.json
              cd /work
              export JAVA_HOME=/usr/share/wazuh-indexer/jdk
              /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh \
                -f /work/securityconfig.json -t config -icl \
                -h indexer.wazuh.svc.cluster.local \
                -cacert /vault/secrets/root-ca.pem \
                -cert /vault/secrets/admin.pem \
                -key /vault/secrets/admin-key.pem
              touch /work/securityadmin.done
              echo WazuhOidcSecurity=ROLLED_BACK
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: bootstrap-secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: work
              mountPath: /work
            - name: work
              mountPath: /tmp
        - name: role-mapping
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: [python3, -u, /opt/wazuh-02-fix-01/sync-oidc-security.py, role-mapping]
          env:
            - name: WAZUH_OIDC_MODE
              value: rollback
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: oidc-security-script
              mountPath: /opt/wazuh-02-fix-01/sync-oidc-security.py
              subPath: sync-oidc-security.py
              readOnly: true
            - name: bootstrap-secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: work
              mountPath: /work
            - name: work
              mountPath: /tmp
      volumes:
        - name: vault-agent-config
          configMap:
            name: wazuh-vault-agent
            defaultMode: 0444
        - name: oidc-security-script
          configMap:
            name: wazuh-oidc-security-script
            defaultMode: 0444
        - name: bootstrap-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: vault-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
