# WAZUH-01 manager. wazuh-kubernetes v4.14.7의 wazuh_managers에서 파생했다.
#
# 변경점과 이유:
# - worker StatefulSet과 cluster Service 제거. 단일 manager PoC라 cluster key도 만들지 않는다.
# - Secret/authd password/API credential은 Git에 두지 않고 Vault Agent init이 memory
#   emptyDir에만 렌더한다. upstream의 5개 평문 Secret은 사용하지 않는다.
# - Service type LoadBalancer -> API는 ClusterIP, agent 수집·등록만 NodePort로 노출한다.
# - Kubernetes API audit 파일을 read-only hostPath로 붙여 소스에서 직접 수집한다.
#   WAZUH-04에서 Keycloak·Pomerium·Vault·Falco·CrowdSec AppSec Pod stdout도 같은
#   방식(hostPath로 /var/log/containers·/var/log/pods를 붙여 직접 tail)으로
#   수집하려 했으나, `pol-02-wazuh-root-manager-baseline`이 이 UID 0 pod에 k3s
#   audit 로그 hostPath 한 곳만 허용해 admission에서 막혔다(FailedCreate, 실제
#   outage 발생). 이어서 Alloy(hostPath 없이 K8s API로 Pod 로그를 읽는다)가 remoted의
#   syslog remote(포트 1516)로 직접 forward하는 안도 시도했으나, Wazuh의 원격
#   syslog(내부 queue type 2)는 로컬 파일 tailing(queue type 1)과 디코딩 경로가 달라
#   custom decoder/rule이 전혀 매칭되지 않는 것을 라이브에서 확인했다(2026-08-12,
#   wazuh-logtest는 정확히 같은 바이트로 성공하는데도 실제 수신 1,800건 이상 중
#   0건 매칭 — Wazuh 자신도 이 경로를 legacy로 보고 제거를 논의 중이다). 최종적으로
#   wazuh-04-relay 사이드카(아래, python3 stdlib만 쓰는 TCP syslog 수신기)를 같은
#   Pod에 추가해 Alloy의 syslog를 받아 emptyDir 파일에 적고, wazuh-manager
#   container가 그 파일을 <localfile log_format="syslog">로 다시 읽는다 — queue
#   type 1 경로라 decoder/rule이 wazuh-logtest 그대로 매칭된다. hostPath도, remoted
#   syslog도 쓰지 않고 노드의 다른 Pod 로그 접근도 없다.
# - manager container는 upstream과 같이 UID 0으로 동작한다. 이 예외는 policies/의
#   `pol-02-wazuh-*` PolicyException과 보상 Enforce 정책이 좁게 소유한다.
apiVersion: v1
kind: Service
metadata:
  name: wazuh
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
  ports:
    - name: api
      port: 55000
      targetPort: api
    - name: syslog
      port: 1516
      targetPort: syslog
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-agents
  namespace: wazuh
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
spec:
  type: NodePort
  # NetworkPolicy가 OPNsense source IP로 판정할 수 있게 SNAT를 끈다.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
  ports:
    - name: events
      port: 1514
      targetPort: events
      nodePort: 31514
      protocol: TCP
    - name: registration
      port: 1515
      targetPort: registration
      nodePort: 31515
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
  namespace: wazuh
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  serviceName: wazuh-agents
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: wazuh-manager
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - -config=/vault/config/vault-agent.hcl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config/vault-agent.hcl
              subPath: vault-agent-manager.hcl
              readOnly: true
            - name: vault-agent-config
              mountPath: /vault/tls/vault.crt
              subPath: vault.crt
              readOnly: true
            - name: manager-secrets
              mountPath: /vault/secrets
            - name: vault-agent-tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      containers:
        - name: wazuh-manager
          image: docker.io/wazuh/wazuh-manager:4.14.7@sha256:a65dcdb61e48b7064bd7250c5cbd6aceeb9b8043a1a413931a8868793146f06d
          imagePullPolicy: IfNotPresent
          # authd password만 upstream이 기대하는 경로로 옮기고 indexer/API credential을
          # 환경으로 올린 뒤 upstream entrypoint를 PID 1로 exec한다.
          command: [/bin/bash, -ec]
          args:
            - |
              install -d -m 0750 /wazuh-config-mount/etc
              install -m 0640 /wazuh/runtime/authd.pass /wazuh-config-mount/etc/authd.pass
              set -a
              . /wazuh/runtime/wazuh.env
              set +a
              exec /init
          env:
            - name: INDEXER_URL
              value: https://indexer.wazuh.svc.cluster.local:9200
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: full
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /wazuh/runtime/certs/root-ca.pem
            - name: SSL_CERTIFICATE
              value: /wazuh/runtime/certs/filebeat.pem
            - name: SSL_KEY
              value: /wazuh/runtime/certs/filebeat-key.pem
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # upstream image는 UID 0으로 permanent data를 복원하고(cp -a: CHOWN·FOWNER),
              # s6가 wazuh 사용자로 daemon을 내려 실행하며(SETUID·SETGID·KILL),
              # ossec daemon이 chroot한다(SYS_CHROOT). root가 자기 소유가 아닌 파일을
              # 읽어야 해서 DAC_OVERRIDE도 필요하다. 기본 Docker 집합에서 NET_RAW,
              # NET_BIND_SERVICE, MKNOD, SETPCAP, SETFCAP, AUDIT_WRITE, FSETID는 뺀다.
              add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID, SYS_CHROOT]
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          ports:
            - name: events
              containerPort: 1514
            - name: registration
              containerPort: 1515
            - name: api
              containerPort: 55000
          startupProbe:
            tcpSocket:
              port: events
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: events
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: wazuh-conf
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true
            - name: wazuh-rules
              mountPath: /wazuh-config-mount/etc/rules/wazuh-01-a90-k8s-audit.xml
              subPath: wazuh-01-a90-k8s-audit.xml
              readOnly: true
            - name: wazuh-rules
              mountPath: /wazuh-config-mount/etc/rules/wazuh-01-d30-suricata.xml
              subPath: wazuh-01-d30-suricata.xml
              readOnly: true
            - name: wazuh-rules
              mountPath: /wazuh-config-mount/etc/rules/wazuh-04-a90-idp-access.xml
              subPath: wazuh-04-a90-idp-access.xml
              readOnly: true
            - name: wazuh-rules
              mountPath: /wazuh-config-mount/etc/rules/wazuh-04-d30-waf-runtime.xml
              subPath: wazuh-04-d30-waf-runtime.xml
              readOnly: true
            - name: wazuh-rules
              mountPath: /wazuh-config-mount/etc/decoders/wazuh-04-decoders.xml
              subPath: wazuh-04-decoders.xml
              readOnly: true
            - name: wazuh-cont-init
              mountPath: /etc/cont-init.d/3-wazuh-01-index-routing
              subPath: 3-wazuh-01-index-routing
              readOnly: true
            - name: manager-secrets
              mountPath: /wazuh/runtime
              readOnly: true
            - name: k3s-audit
              mountPath: /var/log/k3s-audit
              readOnly: true
            - name: wazuh-04-relay-buffer
              mountPath: /wazuh-04-forward
              readOnly: true
            - name: wazuh-manager-master
              mountPath: /var/ossec/api/configuration
              subPath: wazuh/var/ossec/api/configuration
            - name: wazuh-manager-master
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-manager-master
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-master
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
            - name: wazuh-manager-master
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh/var/ossec/var/multigroups
            - name: wazuh-manager-master
              mountPath: /var/ossec/integrations
              subPath: wazuh/var/ossec/integrations
            - name: wazuh-manager-master
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh/var/ossec/active-response/bin
            - name: wazuh-manager-master
              mountPath: /var/ossec/agentless
              subPath: wazuh/var/ossec/agentless
            - name: wazuh-manager-master
              mountPath: /var/ossec/wodles
              subPath: wazuh/var/ossec/wodles
            - name: wazuh-manager-master
              mountPath: /etc/filebeat
              subPath: filebeat/etc/filebeat
            - name: wazuh-manager-master
              mountPath: /var/lib/filebeat
              subPath: filebeat/var/lib/filebeat
        # WAZUH-04: Alloy(gitops/apps/loki)의 syslog 전송을 받아 emptyDir 파일에
        # append하는 TCP 릴레이. python3 stdlib(socketserver)만 쓴다 — 이 저장소는
        # 커스텀 이미지 빌드 파이프라인이 없어 별도 Dockerfile 없이, 이미
        # values-alloy-01.yaml의 kubernetes-events sidecar가 쓰는 것과 같은 base
        # image·보안 패턴을 그대로 재사용한다. 20 MiB마다 `.1`로 rotate해 emptyDir가
        # 무한정 자라지 않게 한다.
        - name: wazuh-04-relay
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "-c"]
          args:
            - |-
              import os
              import socketserver
              import threading

              LOG_PATH = "/wazuh-04-forward/wazuh-04.log"
              MAX_BYTES = 20 * 1024 * 1024
              write_lock = threading.Lock()

              def rotate_if_needed():
                  try:
                      if os.path.getsize(LOG_PATH) >= MAX_BYTES:
                          os.replace(LOG_PATH, LOG_PATH + ".1")
                  except FileNotFoundError:
                      pass

              class Handler(socketserver.StreamRequestHandler):
                  def handle(self):
                      for raw_line in self.rfile:
                          line = raw_line.rstrip(b"\n")
                          if not line.strip():
                              continue
                          with write_lock:
                              rotate_if_needed()
                              with open(LOG_PATH, "ab") as f:
                                  f.write(line + b"\n")

              class Server(socketserver.ThreadingTCPServer):
                  allow_reuse_address = True
                  daemon_threads = True

              os.makedirs(os.path.dirname(LOG_PATH), exist_ok=True)
              with Server(("0.0.0.0", 1516), Handler) as srv:
                  srv.serve_forever()
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: syslog
              containerPort: 1516
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: wazuh-04-relay-buffer
              mountPath: /wazuh-04-forward
      volumes:
        - name: vault-agent-config
          configMap:
            name: wazuh-vault-agent
            defaultMode: 0444
        - name: wazuh-conf
          configMap:
            name: wazuh-manager-conf
            defaultMode: 0444
        - name: wazuh-rules
          configMap:
            name: wazuh-manager-rules
            defaultMode: 0444
        - name: wazuh-cont-init
          configMap:
            name: wazuh-manager-cont-init
            defaultMode: 0555
        - name: manager-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: vault-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: k3s-audit
          hostPath:
            path: /var/log/k3s-audit
            type: DirectoryOrCreate
        - name: wazuh-04-relay-buffer
          emptyDir:
            sizeLimit: 64Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-master
        namespace: wazuh
        labels:
          app.kubernetes.io/name: wazuh
          app.kubernetes.io/component: manager
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        # API server 기본값을 명시해 Argo 영구 diff를 없앤다.
        volumeMode: Filesystem
        resources:
          requests:
            storage: 1Gi
