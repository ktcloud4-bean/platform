apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-default-deny
  namespace: wazuh
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-internal
  namespace: wazuh
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-dns-egress
  namespace: wazuh
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Vault Agent init만 Vault로 나간다. manager·indexer·bootstrap Pod가 모두 같은 경로를 쓴다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-vault-egress
  namespace: wazuh
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
---
# WAZUH-02: Pomerium server Pod만 Dashboard의 5601로 들어온다. wazuh-default-deny가
# cross-namespace ingress를 막으므로 pomerium 쪽 egress(gitops/apps/pomerium)와 정확히
# 짝을 이뤄야 한다. OBS-02가 이 짝을 빼먹어 503을 겪은 전례가 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-dashboard-pomerium-ingress
  namespace: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: dashboard
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pomerium
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 5601
---
# WAZUH-02-FIX-01: Dashboard는 authorization-code 교환, Indexer는 discovery/JWKS 조회를
# canonical issuer로 수행한다. hostAliases가 가리키는 in-cluster Traefik Service와 실제
# backend Pod 양쪽을 명시해 kube-router Service DNAT 전후 판정 차이를 없앤다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-keycloak-egress
  namespace: wazuh
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [dashboard, indexer]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.255.250/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
---
# Suricata alert를 보내는 OPNsense Wazuh Agent와 WAZUH-03의 6개 host agent만
# manager의 등록·수집 port로 들어온다. NodePort Service는 externalTrafficPolicy=Local이라
# source IP가 보존된다. OPNsense는 자기 인터페이스 주소로 발신하므로 MGMT(10.10.10.1)와
# PLATFORM(10.10.20.1) 게이트웨이 두 주소를 그대로 둔다. 6개 host agent는 게이트웨이가
# 아니라 실제 호스트 주소(docs/ip-plan.md 고정 배정)로 발신한다 — proxmox-01
# 10.10.10.10, k3s-01 10.10.20.10, warpgate-01 10.10.30.10, netbird-01 10.10.40.10,
# postgres-01 10.10.50.10, object-01 10.10.50.20. k3s-01은 manager와 같은 노드라
# NodePort 자기 접속(hairpin) source IP가 다르게 관측되면 WAZUH-03 라이브 검증에서
# 실제 관측값으로 이 목록을 갱신한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-manager-agent-ingress
  namespace: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.10.1/32
        - ipBlock:
            cidr: 10.10.20.1/32
        - ipBlock:
            cidr: 10.10.10.10/32
        - ipBlock:
            cidr: 10.10.20.10/32
        - ipBlock:
            cidr: 10.10.30.10/32
        - ipBlock:
            cidr: 10.10.40.10/32
        - ipBlock:
            cidr: 10.10.50.10/32
        - ipBlock:
            cidr: 10.10.50.20/32
      ports:
        - protocol: TCP
          port: 1514
        - protocol: TCP
          port: 1515
---
# SOAR-01: manager의 custom integration만 Shuffle backend webhook API로 나간다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-manager-shuffle-egress
  namespace: wazuh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: manager
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shuffle
          podSelector:
            matchLabels:
              app.kubernetes.io/name: shuffle
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 5001
