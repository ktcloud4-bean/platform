<!--
  WAZUH-04: relay-agent 전용 최소 ossec.conf. wazuh-manager pod는
  `pol-02-wazuh-root-manager-baseline`이 containers 배열 전체를 고정 이미지와
  정확히 일치하도록 강제해 두 번째 container도, hostPath 확장도, remoted syslog
  remote 직접 수신(Wazuh 자신의 queue type 2 디코딩 버그)도 모두 불가능함을
  라이브로 확인했다(2026-08-12, manager.yaml 참고). 그래서 별도 Pod에서 실제
  wazuh-agent를 돌려 WAZUH-03의 6개 host agent·OPNsense와 똑같은 secure agent
  프로토콜(1514, queue type 1, 이미 Suricata 규칙으로 검증된 경로)로 manager에
  전달한다. 이 Pod 안의 wazuh-04-relay 컨테이너(python TCP 수신기)가 Alloy의
  syslog를 받아 적는 파일 하나만 localfile로 tail한다. rootcheck·syscheck는 이
  Pod 자신의 컨테이너 파일시스템을 검사하는 게 되므로(manager를 끄는 것과 같은
  이유) 명시적으로 끈다. CHANGE_* 토큰은 wazuh-agent 이미지의 0-wazuh-init
  스크립트가 WAZUH_MANAGER_SERVER 등 환경 변수로 치환한다.

  WAZUH-04-FIX-01: enrollment는 WAZUH-03 host agent와 동일하게 껐다. client.keys가
  pod 재시작마다 사라지는 컨테이너 파일시스템에만 있어 wazuh-agentd의 자동
  재등록이 같은 이름의 기존(비활성) 등록과 충돌해 영구 재시도에 빠지는 것을
  라이브로 확인했다(docs/backlog.md 참고) — client.keys는 이제 Vault Agent가
  기존 등록을 그대로 정적 렌더링한다(wazuh-04-relay-agent.yaml 참고).
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>no</enabled>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <!--
    wazuh-04-relay 컨테이너(같은 Pod, emptyDir 공유)가 Alloy로부터 받은 syslog
    메시지를 그대로(rawmsg) 이 파일에 append한다. 로컬 파일 tailing이라 queue
    type 1 경로를 타므로 wazuh-04-decoders.xml/두 rule 파일이 wazuh-logtest로
    검증된 그대로 매칭된다.
  -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/wazuh-04-forward/wazuh-04.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
