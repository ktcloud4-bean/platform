<!--
  WAZUH-01 manager 설정. wazuh-kubernetes v4.14.7의 wazuh_conf/master.conf에서 파생했다.

  변경점과 이유:
  - cluster 블록 제거: 단일 manager PoC이므로 기본값(비활성)을 쓰고 cluster key를 만들지 않는다.
  - active-response는 <disabled>yes</disabled>로 명시하고 upstream의 <command> 정의를 모두 제거했다.
  - rootcheck·syscheck·syscollector·open-scap·cis-cat·osquery 비활성: manager 컨테이너 자신을
    검사하는 event는 audit-event-standard.md의 D30/A90 소스가 아니다.
  - vulnerability-detection과 <indexer> 연결기 비활성: wazuh-states-* index는 D30/A90 계약 밖이다.
    alert는 filebeat 한 경로로만 indexer에 들어간다.
  - logall/logall_json은 upstream과 같이 no다. archives를 만들지 않는다.
  - localfile은 Kubernetes API audit 파일 하나만 둔다. upstream의 df/netstat/last 명령 수집은
    운영 로그(O7)이며 Loki가 소유하므로 제거했다.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <queue_size>131072</queue_size>
    <agents_disconnection_time>20s</agents_disconnection_time>
    <agents_disconnection_alert_time>100s</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <wodle name="open-scap">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <vulnerability-detection>
    <enabled>no</enabled>
  </vulnerability-detection>

  <indexer>
    <enabled>no</enabled>
  </indexer>

  <!-- WAZUH-01은 자동 대응을 만들지 않는다. -->
  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <!-- SOAR-01: custom-* integration은 Vault-rendered hook URL만 읽는다. 사람 승인
       전에는 read-only 보강·대시보드 대기만 하며 active-response는 계속 비활성이다. -->
  <integration>
    <name>custom-soar01</name>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- A90: Kubernetes API audit terminal stage Metadata record. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/k3s-audit/audit.log</location>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-sources</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>

    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <force>
      <enabled>yes</enabled>
      <key_mismatch>yes</key_mismatch>
      <disconnected_time enabled="yes">1h</disconnected_time>
      <after_registration_time>1h</after_registration_time>
    </force>
    <purge>no</purge>
    <use_password>yes</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>
</ossec_config>
