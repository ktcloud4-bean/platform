# WAZUH-02. upstream demo 파일(wazuh-kubernetes v4.14.7,
# wazuh/indexer_stack/wazuh-dashboard/dashboard_conf/opensearch_dashboards.yml)에서 아래를
# 바꿨다.
# - opensearch.hosts: 실제 Service DNS(indexer.wazuh.svc.cluster.local:9200)로 고정.
# - server.ssl.*: 제거. Dashboard는 ClusterIP로만 존재하고 Pomerium이 외부 TLS를 종단하므로
#   내부 자체 서명 TLS 계층을 추가하지 않는다(OBS-02 Grafana/GITOPS-02 Argo와 같은 결정).
# - opensearch.ssl.verificationMode: none을 제거. root CA와 indexer node 인증서 SAN에
#   이미 이 Service DNS가 포함돼 있어 기본값인 full hostname 검증을 그대로 쓴다.

server.host: 0.0.0.0
server.port: 5601
opensearch.hosts: https://indexer.wazuh.svc.cluster.local:9200
opensearch.ssl.certificateAuthorities: ["/vault/secrets/certs/root-ca.pem"]
opensearch.requestHeadersWhitelist: [ authorization,securitytenant ]
opensearch_security.multitenancy.enabled: false
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
uiSettings.overrides.defaultRoute: /app/wz-home
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true

# WAZUH-02-FIX-01: Pomerium은 route 입구만 판단하고, Dashboard의 실제 사용자 세션은
# Keycloak platform realm OIDC로 만든다. Wazuh 4.14.7이 포함한 OpenSearch Dashboards 2.19는
# multi-auth의 OIDC default redirect 설정을 지원하지 않으므로, 지원되는 native openid 단일
# 모드로 둔다. IdP 장애 복구는 local Dashboard form이 아니라 제한된 k3s mTLS rollback Job이
# 소유한다.
opensearch_security.auth.type: "openid"
opensearch_security.openid.connect_url: "https://sso.imcherry5778.xyz/realms/platform/.well-known/openid-configuration"
opensearch_security.openid.client_id: "wazuh"
opensearch_security.openid.client_secret: "${OIDC_CLIENT_SECRET}"
opensearch_security.openid.scope: "openid profile email"
opensearch_security.openid.base_redirect_url: "https://wazuh.imcherry5778.xyz"
opensearch_security.openid.refresh_tokens: true
