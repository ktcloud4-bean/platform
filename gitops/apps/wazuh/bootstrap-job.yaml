# WAZUH-01 보존 정책 bootstrap. indexer가 Ready가 된 뒤, manager가 첫 index를 만들기 전에
# D30·A90 ISM 정책을 running 설정으로 올린다. ism_template은 생성 시점 index에만 적용되므로
# sync wave 순서(indexer 0 -> bootstrap 1 -> manager 2)가 계약의 일부다.
apiVersion: batch/v1
kind: Job
metadata:
  name: wazuh-retention-bootstrap
  namespace: wazuh
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: wazuh
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: wazuh-bootstrap
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
          imagePullPolicy: IfNotPresent
          args:
            - agent
            - -config=/vault/config/vault-agent.hcl
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault/config/vault-agent.hcl
              subPath: vault-agent-bootstrap.hcl
              readOnly: true
            - name: vault-agent-config
              mountPath: /vault/tls/vault.crt
              subPath: vault.crt
              readOnly: true
            - name: bootstrap-secrets
              mountPath: /vault/secrets
            - name: vault-agent-tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
      containers:
        - name: retention
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: [python3, -u, /opt/wazuh-01/bootstrap-retention.py]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap-script
              mountPath: /opt/wazuh-01/bootstrap-retention.py
              subPath: bootstrap-retention.py
              readOnly: true
            - name: bootstrap-secrets
              mountPath: /vault/secrets
              readOnly: true
      volumes:
        - name: vault-agent-config
          configMap:
            name: wazuh-vault-agent
            defaultMode: 0444
        - name: bootstrap-script
          configMap:
            name: wazuh-bootstrap-script
            defaultMode: 0444
        - name: bootstrap-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: vault-agent-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 600
