apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-onprem-default-deny-ingress
  namespace: demo-onprem
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-onprem-portal-ingress
  namespace: demo-onprem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-onprem-portal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pomerium
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
              app.kubernetes.io/component: server
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-onprem-internal-from-attacker
  namespace: demo-onprem
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-onprem-internal-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              demo-onprem.imcherry5778.xyz/role: attacker
      ports:
        - {port: 8080, protocol: TCP}
