apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - recovery-pvc.yaml
  - workloads.yaml
  - network-policies.yaml
  - routes.yaml
configMapGenerator:
  - name: demo-onprem-app
    namespace: demo-onprem
    files:
      - server.py=server.py
      - recovery_seed.py=recovery_seed.py
    options:
      labels:
        app.kubernetes.io/part-of: demo-onprem-01
generatorOptions:
  disableNameSuffixHash: true
