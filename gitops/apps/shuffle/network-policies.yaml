apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-default-deny
  namespace: shuffle
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-internal
  namespace: shuffle
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-dns-egress
  namespace: shuffle
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# opensearch·backend의 Vault Agent init만 Vault로 나간다. frontend는 Vault Agent가
# 없으므로 podSelector로 두 컴포넌트만 좁힌다(wazuh-vault-egress는 namespace 전체를
# 열지만 이 namespace는 root credential 없는 컴포넌트도 있어 더 좁힌다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-vault-egress
  namespace: shuffle
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [opensearch, backend]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - protocol: TCP
          port: 8200
---
# IAM-01: backend만 canonical Keycloak HTTPS endpoint로 token 교환과 userinfo 조회를
# 수행한다. hostAliases의 in-cluster Traefik Service 하나만 허용한다. kube-router의
# Service DNAT 전후 판정 차이를 위해 같은 endpoint의 ClusterIP:443과 Pod:8443을 적는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-backend-keycloak-egress
  namespace: shuffle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shuffle
      app.kubernetes.io/component: backend
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.255.250/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8443
---
# SOAR-DASH-01: Pomerium server Pod만 frontend의 8080으로 들어온다. shuffle-default-deny가
# cross-namespace ingress를 막으므로 pomerium 쪽 egress(gitops/apps/pomerium/shuffle-egress.yaml)와
# 정확히 짝을 이뤄야 한다(OBS-02가 이 짝을 빼먹어 503을 겪은 전례).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-frontend-pomerium-ingress
  namespace: shuffle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shuffle
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pomerium
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pomerium
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 8080
---
# SOAR-01: Wazuh manager custom integration만 private Shuffle hook endpoint로 보낸다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-backend-wazuh-ingress
  namespace: shuffle
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shuffle
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wazuh
          podSelector:
            matchLabels:
              app.kubernetes.io/name: wazuh
              app.kubernetes.io/component: manager
      ports:
        - protocol: TCP
          port: 5001
---
# SOAR-01: Orborus와 정적 worker는 이미 선언된 enrichment Deployment를 발견할 때만
# Kubernetes API를 읽는다. create/update/delete 권한은 Role에 없고, API Service 하나의
# TCP 443만 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shuffle-execution-kubernetes-api-egress
  namespace: shuffle
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [orborus, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # kube-router는 Service DNAT 뒤 k3s server endpoint를 egress 정책에 대조한다.
    - to:
        - ipBlock:
            cidr: 10.10.20.10/32
      ports:
        - protocol: TCP
          port: 6443
