# SOAR-DASH-01 Shuffle frontend (nginx SPA + reverse proxy to backend /api/v1,/api/v2).
# No Vault secret: it only proxies, it never sees OpenSearch or backend credentials.
apiVersion: v1
kind: Service
metadata:
  name: shuffle-frontend
  namespace: shuffle
  labels:
    app.kubernetes.io/name: shuffle
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shuffle
    app.kubernetes.io/component: frontend
  ports:
    - name: frontend-http
      port: 8080
      targetPort: frontend-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuffle-frontend
  namespace: shuffle
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: shuffle
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shuffle
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shuffle
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: shuffle-frontend
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Kubernetes subPath 제약: 대상 emptyDir이 비어 있으면 kubelet이 subPath 항목을
        # 디렉터리로 만들어, upstream 이미지에 이미 파일로 존재하는 /etc/nginx/nginx.conf
        # 위 bind mount가 "not a directory"로 실패한다. 같은 볼륨을 subPath 없이 마운트해
        # 먼저 빈 파일을 만들어 두면 이후 subPath가 파일 대 파일로 mount된다.
        - name: nginx-conf-init
          image: harbor.imcherry5778.xyz/curated-platform/shuffle-frontend@sha256:0561dd421382f70d15cada11a324b40762f0930522fcc1b51edcce9c87cc0f00
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec, 'touch /nginx-conf-writable/nginx.conf']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: nginx-conf-writable
              mountPath: /nginx-conf-writable
        # Shuffle 2.2.1 Form은 링크에 있던 source_node를 승인 callback에 다시 넣지 않는다.
        # User Input trigger를 정확히 식별할 수 있게 고정 bundle의 한 query만 보정한다.
        # image digest가 바뀌어 원문이 달라지면 grep에서 멈춰 조용한 우회를 막는다.
        - name: patch-form-source-node
          image: harbor.imcherry5778.xyz/curated-platform/shuffle-frontend@sha256:0561dd421382f70d15cada11a324b40762f0930522fcc1b51edcce9c87cc0f00
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              cp -R /usr/share/nginx/html/. /frontend-html/
              bundle=/frontend-html/assets/index-C5fsQI9Y.js
              grep -F 'on+=`?reference_execution=${Ve}&authorization=${at}&answer=${ot}`' "$bundle"
              sed -i 's|on+=`?reference_execution=${Ve}&authorization=${at}&answer=${ot}`|on+=`?reference_execution=${Ve}\&authorization=${at}\&answer=${ot}\&source_node=${oe}`|' "$bundle"
              grep -F 'on+=`?reference_execution=${Ve}&authorization=${at}&answer=${ot}&source_node=${oe}`' "$bundle"
              # User Input runtime은 내부 shuffle-subflow app을 사용한다. upstream 실행 상세는
              # 이를 child workflow로 오인해 첫 parameter(안내 문구)를 workflow ID로 열고
              # execution_id=undefined를 붙인다. 이 결과에만 manual Form capability를 ↗에 연결한다.
              grep -F 'U.action.app_name==="shuffle-subflow"&&Ke.result.success!==void 0&&Ke.result.success===!0?' "$bundle"
              sed -i 's|U\.action\.app_name==="shuffle-subflow"&&Ke\.result\.success!==void 0&&Ke\.result\.success===!0?|U.action.name==="run_userinput"\&\&Ke.valid\&\&Ke.result.links!==void 0\&\&Ke.result.links!==null\&\&Ke.result.links.frontend_no_answer!==void 0\&\&Ke.result.links.frontend_no_answer!==null?l.jsx("span",{style:{flex:10,float:"right",textAlign:"right"},children:l.jsx("a",{rel:"noopener noreferrer",href:Ke.result.links.frontend_no_answer,target:"_blank",style:{textDecoration:"none",color:d.palette.linkColor},onClick:qr=>{},children:l.jsx(cl,{})})}):U.action.app_name==="shuffle-subflow"\&\&Ke.result.success!==void 0\&\&Ke.result.success===!0?|' "$bundle"
              grep -F 'U.action.name==="run_userinput"&&Ke.valid&&Ke.result.links!==void 0&&Ke.result.links!==null&&Ke.result.links.frontend_no_answer!==void 0&&Ke.result.links.frontend_no_answer!==null?' "$bundle"
              # parent execution은 SDK가 User Input 결과를 WAITING으로 남긴 직후에도 FINISHED가 된다.
              # Form은 source_node 결과가 WAITING이면 상위 상태만으로 승인 버튼을 잠그면 안 된다.
              grep -F 'Ct!=null&&Ve!==void 0&&Ve!==null&&Ct.length>0&&Ve.length>0&&L===!1&&(on==null?void 0:on.status)!==""&&(on==null?void 0:on.status)!=="WAITING"&&(console.log("IN here 1"),D(!0))' "$bundle"
              sed -i 's|Ct!=null&&Ve!==void 0&&Ve!==null&&Ct.length>0&&Ve.length>0&&L===!1&&(on==null?void 0:on.status)!==""&&(on==null?void 0:on.status)!=="WAITING"&&|Ct!=null\&\&Ve!==void 0\&\&Ve!==null\&\&Ct.length>0\&\&Ve.length>0\&\&L===!1\&\&(on==null?void 0:on.status)!==""\&\&(on==null?void 0:on.status)!=="WAITING"\&\&!(on.results!==void 0\&\&on.results!==null\&\&on.results.some(Fr=>Fr.action!==void 0\&\&Fr.action!==null\&\&Fr.action.id===oe\&\&Fr.status==="WAITING"))\&\&|' "$bundle"
              grep -F 'on.results.some(Fr=>Fr.action!==void 0&&Fr.action!==null&&Fr.action.id===oe&&Fr.status==="WAITING")' "$bundle"
          volumeMounts:
            - name: frontend-html
              mountPath: /frontend-html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: shuffle-frontend
          image: harbor.imcherry5778.xyz/curated-platform/shuffle-frontend@sha256:0561dd421382f70d15cada11a324b40762f0930522fcc1b51edcce9c87cc0f00
          imagePullPolicy: IfNotPresent
          command: [/entrypoint.sh]
          args: [nginx, -g, "daemon off;"]
          env:
            - name: BACKEND_HOSTNAME
              value: shuffle-backend.shuffle.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: frontend-http
              containerPort: 8080
          startupProbe:
            tcpSocket:
              port: frontend-http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: frontend-http
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: nginx-conf-tmpl
              mountPath: /etc/nginx/nginx.conf.tmpl
              subPath: nginx.conf.tmpl
              readOnly: true
            - name: nginx-conf-writable
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: frontend-html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf-tmpl
          configMap:
            name: shuffle-frontend-conf
            defaultMode: 0444
        - name: nginx-conf-writable
          emptyDir:
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: frontend-html
          emptyDir:
            sizeLimit: 16Mi
