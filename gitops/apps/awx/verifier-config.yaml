apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-verifier-nginx
  namespace: awx
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      auth_basic "AWX-01 credential boundary";
      auth_basic_user_file /etc/awx-secret/htpasswd;
      location /allowed {
        root /usr/share/nginx/html;
        try_files /allowed.txt =404;
      }
    }
  allowed.txt: |
    AWX-01 in-cluster boundary target
