apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  admin_user: awx-recovery
  admin_email: awx-recovery@imcherry5778.xyz
  admin_password_secret: awx-admin-password
  secret_key_secret: awx-secret-key
  postgres_configuration_secret: awx-postgres-configuration
  bundle_cacert_secret: awx-bundle-ca
  # 등록된 EE의 AWX credential과 kubelet의 image pull 인증은 요구 Secret 형식이
  # 다르다. 전자는 url/username/password Opaque Secret, 후자는 dockerconfigjson을
  # 사용하며 bootstrap Hook이 같은 Vault Harbor robot 입력에서 각각 만든다.
  ee_pull_credentials_secret: awx-ee-pull-credentials
  image_pull_secrets:
    - awx-ee-pull

  # 외부 postgres-01만 사용한다. 검증 playbook은 read-only ConfigMap으로 공급한다.
  projects_persistence: false
  create_preload_data: false
  garbage_collect_secrets: false
  service_type: ClusterIP
  ingress_type: none
  web_replicas: 1
  task_replicas: 1

  # Operator 2.19.1은 이 값을 web/task Pod spec.securityContext에 그대로
  # 렌더링한다. Redis image의 기본 USER는 비어 있으므로 runAsNonRoot만 두지
  # 않고 UID 1000을 고정한다. AWX image의 시작 스크립트가 group 0 write로
  # 준비된 /etc/passwd·supervisor·rsyslog 경로를 사용하므로 upstream runtime
  # contract와 같은 GID 0을 유지하고, emptyDir는 fsGroup 1000으로 제한한다.
  # migration Job은 이 필드를 상속하지 않아 policy-baseline의 좁은 admission
  # mutation이 별도로 소유한다.
  security_context_settings:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 0
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # default container group가 만드는 automation-job-* Pod는 web/task CR field나
  # migration Job mutation을 상속하지 않는다. Operator가 read-only AWX setting으로
  # 공급한 Pod spec override만 이 실행 경로에 적용한다.
  extra_settings:
    - setting: DEFAULT_EXECUTION_QUEUE_POD_SPEC_OVERRIDE
      value: >-
        '{"spec":{"imagePullSecrets":[{"name":"awx-ee-pull"}],"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"runAsGroup":0,"fsGroup":1000,"fsGroupChangePolicy":"OnRootMismatch","seccompProfile":{"type":"RuntimeDefault"}},"volumes":[{"name":"awx-ssh-canary-known-hosts","secret":{"secretName":"awx-ssh-canary-known-hosts","defaultMode":292}},{"name":"awx-ssh-marker-known-hosts","secret":{"secretName":"awx-ssh-marker-known-hosts","defaultMode":292}},{"name":"awx-execution-runner","emptyDir":{"sizeLimit":"32Mi"}}],"containers":[{"name":"worker","volumeMounts":[{"name":"awx-ssh-canary-known-hosts","mountPath":"/etc/awx-ssh-canary","readOnly":true},{"name":"awx-ssh-marker-known-hosts","mountPath":"/etc/awx-ssh-marker","readOnly":true},{"name":"awx-execution-runner","mountPath":"/runner"}]}]}}'
    - setting: AWX_TASK_ENV
      value: >-
        '{"GIT_SSH_COMMAND":"ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/awx-scm/known_hosts -o GlobalKnownHostsFile=/dev/null"}'

  image: quay.io/ansible/awx
  image_version: 24.6.1@sha256:5d47e132014ae4c6a026a2e8f19ce7b3cf3c8f313d59e44fdfa95cd9f3669209
  control_plane_ee_image: harbor.imcherry5778.xyz/curated-platform/awx-ee@sha256:d6fca88c8c26e143b1fc71cc60db3b0ee06c43cc46fd395e902dcec3dbc5af9b
  init_container_image: quay.io/ansible/awx-ee
  init_container_image_version: 24.6.1@sha256:89593d2a0268acacdbd1c075d8810ab50d961cf7769e36de19219bb6cb4efcc1
  ee_images:
    - name: AWX EE 24.6.1
      image: harbor.imcherry5778.xyz/curated-platform/awx-ee@sha256:d6fca88c8c26e143b1fc71cc60db3b0ee06c43cc46fd395e902dcec3dbc5af9b
    - name: AWX-04 platform EE
      image: harbor.imcherry5778.xyz/awx-ee/platform-ee@sha256:0a35dcb1933fd6439730dd2a57e325be1bd175852c29dd0e2894728b16137bb9
  redis_image: docker.io/library/redis
  redis_image_version: 7.2.5@sha256:3aaec283e6e593bde528077d60280ac1589887067a39273348860837c9346d7e
  image_pull_policy: IfNotPresent

  extra_volumes: |
    - name: awx-manual-project
      configMap:
        name: awx-manual-project
        defaultMode: 0444
    - name: awx-scm-known-hosts
      secret:
        secretName: awx-scm-known-hosts
        defaultMode: 0444
  task_extra_volume_mounts: |
    - name: awx-manual-project
      mountPath: /var/lib/awx/projects/awx01
      readOnly: true
    - name: awx-scm-known-hosts
      mountPath: /etc/awx-scm
      readOnly: true
  web_extra_volume_mounts: |
    - name: awx-manual-project
      mountPath: /var/lib/awx/projects/awx01
      readOnly: true

  web_resource_requirements:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: "1", memory: 2Gi}
  task_resource_requirements:
    requests: {cpu: 300m, memory: 1536Mi}
    limits: {cpu: "2", memory: 3Gi}
  ee_resource_requirements:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  redis_resource_requirements:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  init_container_resource_requirements:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  rsyslog_resource_requirements:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
