apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-vault-agent
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
data:
  bootstrap.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"
    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry { num_retries = 12 }
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "awx"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }
    template {
      destination = "/vault/secrets/db-password"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/runtime" -}}{{ .Data.data.db_password }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/admin-password"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/runtime" -}}{{ .Data.data.admin_password }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/secret-key"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/runtime" -}}{{ .Data.data.secret_key }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/ee-pull.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/pull" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/scm-known-hosts"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/scm-hostkeys" -}}{{ .Data.data.gitea_known_hosts }}{{- end -}}
    EOT
    }
    # AWX-05 machine credential가 사용하는 k3s-01의 인증된 host key다. private
    # key가 아니며, bootstrap Hook만 이를 실행 Pod 전용 Secret으로 materialize한다.
    template {
      destination = "/vault/secrets/ssh-canary-known-hosts"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/ssh-canary-hostkeys" -}}{{ .Data.data.known_hosts }}{{- end -}}
    EOT
    }
    # AWX-06 marker 대상 netbird-01의 authenticated public host key도 별도 Secret으로만
    # materialize한다. private Machine key와 lookup bootstrap은 이 workload policy로 읽지 못한다.
    template {
      destination = "/vault/secrets/ssh-marker-known-hosts"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/ssh-marker-hostkeys" -}}{{ .Data.data.known_hosts }}{{- end -}}
    EOT
    }
  provision.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"
    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry { num_retries = 12 }
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "awx-provisioner"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }
    template {
      destination = "/vault/secrets/runtime.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/runtime" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/scm.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/scm-lookup" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/ssh-canary.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/ssh-canary-lookup" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
    template {
      destination = "/vault/secrets/ssh-marker.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/ssh-marker-lookup" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
    # AWX-07 privileged node_exporter Machine credential의 lookup bootstrap만
    # provisioning Hook에 전달한다. private key와 host key는 이 policy로 읽지 못한다.
    template {
      destination = "/vault/secrets/ssh-node-exporter.json"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    {{- with secret "kv/data/awx/ssh-node-exporter-lookup" -}}{{ .Data.data | toJSON }}{{- end -}}
    EOT
    }
  verifier.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"
    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry { num_retries = 12 }
    }
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "awx"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }
    template {
      destination = "/etc/awx-secret/htpasswd"
      perms = "0400"
      error_on_missing_key = true
      contents = <<EOT
    awx-boundary:{{ with secret "kv/data/awx/runtime" }}{{ .Data.data.verifier_htpasswd }}{{ end }}
    EOT
    }
