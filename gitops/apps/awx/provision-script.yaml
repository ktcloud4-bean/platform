apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-provision-script
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
data:
  provision.py: |
    #!/usr/bin/env python3
    # AWX07_PROVISION_GUARD=1
    import base64
    import json
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    BASE = "http://awx-service.awx.svc.cluster.local"
    API = BASE + "/api/v2"
    runtime = json.load(open("/vault/secrets/runtime.json", encoding="utf-8"))
    scm = json.load(open("/vault/secrets/scm.json", encoding="utf-8"))
    ssh_canary = json.load(open("/vault/secrets/ssh-canary.json", encoding="utf-8"))
    ssh_marker = json.load(open("/vault/secrets/ssh-marker.json", encoding="utf-8"))
    ssh_node_exporter = json.load(open("/vault/secrets/ssh-node-exporter.json", encoding="utf-8"))
    admin_password = runtime["admin_password"]
    auth = base64.b64encode(f"awx-recovery:{admin_password}".encode()).decode()

    def api(method, path, body=None, expected=(200, 201, 202, 204)):
        data = None if body is None else json.dumps(body).encode()
        request = urllib.request.Request(
            API + path,
            data=data,
            method=method,
            headers={"Authorization": f"Basic {auth}", "Content-Type": "application/json"},
        )
        try:
            with urllib.request.urlopen(request, timeout=60) as response:
                if response.status not in expected:
                    raise RuntimeError(f"예상 밖 HTTP {response.status}: {method} {path}")
                raw = response.read()
                return {} if not raw else json.loads(raw)
        except urllib.error.HTTPError as error:
            detail = error.read().decode(errors="replace")[:1000]
            raise RuntimeError(f"HTTP {error.code}: {method} {path}: {detail}") from error

    def wait_ready():
        for attempt in range(180):
            try:
                result = api("GET", "/ping/")
                if result.get("version"):
                    print(f"AWX API 준비됨: {result['version']}")
                    return
            except Exception:
                pass
            if attempt % 12 == 0:
                print(f"AWX API 준비 대기: {attempt + 1}/180")
            time.sleep(5)
        raise RuntimeError("AWX API 준비 시간이 초과됨")

    def wait_task_instance():
        # AWX web API가 먼저 Ready가 되어도 task dispatcher가 재기동 중이면 host 생성의
        # on-commit dispatch가 500을 내거나 SCM update가 instance shutdown으로 reap된다.
        # enabled/capacity가 있고 오류 없는 control/hybrid 집합이 20초 동안 같은지 확인해
        # CR reconciliation이 task Deployment를 교체하는 창을 지난 뒤 provisioning한다.
        previous = ()
        stable = 0
        for attempt in range(120):
            instances = api("GET", "/instances/?page_size=200").get("results", [])
            ready = tuple(sorted(item.get("hostname") for item in instances if item.get("enabled") and
                          not item.get("errors") and int(item.get("capacity") or 0) > 0 and
                          item.get("node_type") in ("control", "hybrid")))
            stable = stable + 1 if ready and ready == previous else 1
            previous = ready
            if ready and stable >= 5:
                print(f"AWX task instance 안정 준비됨: {','.join(ready)}")
                return
            if attempt % 12 == 0:
                print(f"AWX task instance 준비 대기: {attempt + 1}/120")
            time.sleep(5)
        raise RuntimeError("AWX task instance 준비 시간이 초과됨")

    def update_project(project):
        requested = api("POST", f"/projects/{project['id']}/update/", {}, expected=(202,))
        update_id = requested.get("project_update") or requested.get("id")
        if not isinstance(update_id, int):
            raise RuntimeError(f"project update 식별자가 없다: {requested}")
        for attempt in range(120):
            update = api("GET", f"/project_updates/{update_id}/")
            status = update.get("status")
            if status == "successful":
                revision = update.get("scm_revision")
                if not revision:
                    raise RuntimeError("SCM update가 성공했지만 revision이 비어 있다")
                print(f"AWX-04 SCM sync 성공: {revision}")
                return revision
            if status in ("failed", "error", "canceled"):
                raise RuntimeError(f"SCM update 실패: {update.get('id')} status={status}")
            time.sleep(5)
        raise RuntimeError("SCM project update 시간이 초과됨")

    def one(endpoint, filters):
        query = urllib.parse.urlencode(filters)
        result = api("GET", f"/{endpoint}/?{query}")
        if result["count"] > 1:
            raise RuntimeError(f"중복 객체: {endpoint} {filters}")
        return result["results"][0] if result["count"] == 1 else None

    def ensure(endpoint, filters, declaration, update=True):
        current = one(endpoint, filters)
        if current is None:
            current = api("POST", f"/{endpoint}/", declaration)
            print(f"생성: {endpoint}/{current['id']} {filters}")
        elif update:
            current = api("PATCH", f"/{endpoint}/{current['id']}/", declaration)
            print(f"일치화: {endpoint}/{current['id']} {filters}")
        return current

    def attach(path, object_id):
        current = api("GET", path)
        if any(item["id"] == object_id for item in current.get("results", [])):
            return
        api("POST", path, {"id": object_id})

    def detach(path, object_id):
        current = api("GET", path)
        if not any(item["id"] == object_id for item in current.get("results", [])):
            return
        api("POST", path, {"id": object_id, "disassociate": True})

    def object_role(obj, role_name):
        return obj["summary_fields"]["object_roles"][role_name]["id"]

    def give_team_role(obj, role_name, team):
        attach(f"/roles/{object_role(obj, role_name)}/teams/", team["id"])

    wait_ready()
    wait_task_instance()

    api("PATCH", "/settings/system/", {"TOWER_URL_BASE": "https://awx.imcherry5778.xyz"})
    api("PATCH", "/settings/oidc/", {
        "SOCIAL_AUTH_OIDC_KEY": "awx",
        "SOCIAL_AUTH_OIDC_SECRET": runtime["oidc_client_secret"],
        "SOCIAL_AUTH_OIDC_OIDC_ENDPOINT": "https://sso.imcherry5778.xyz/realms/platform",
        "SOCIAL_AUTH_OIDC_VERIFY_SSL": True,
    })
    api("PATCH", "/settings/authentication/", {
        "SOCIAL_AUTH_ORGANIZATION_MAP": {
            "Platform": {
                "users": ["imcherry5778", "imcherry5778-admin"],
                "admins": [],
                "remove_users": True,
                "remove_admins": True,
            }
        },
        "SOCIAL_AUTH_TEAM_MAP": {
            "AWX Operators": {"organization": "Platform", "users": ["imcherry5778"], "remove": True},
            "AWX Approvers": {"organization": "Platform", "users": ["imcherry5778-admin"], "remove": True},
        },
    })

    organization = ensure("organizations", {"name": "Platform"}, {
        "name": "Platform",
        "description": "AWX-01 최소권한 조직",
        "max_hosts": 0,
    })
    operators = ensure("teams", {"name": "AWX Operators", "organization": organization["id"]}, {
        "name": "AWX Operators", "organization": organization["id"],
        "description": "check 및 승인 workflow 시작 권한",
    })
    approvers = ensure("teams", {"name": "AWX Approvers", "organization": organization["id"]}, {
        "name": "AWX Approvers", "organization": organization["id"],
        "description": "apply approval 전용 권한",
    })

    production = ensure("inventories", {"name": "운영 VM 정적 인벤토리 (실행 금지)", "organization": organization["id"]}, {
        "name": "운영 VM 정적 인벤토리 (실행 금지)",
        "organization": organization["id"],
        "description": "docs/ip-plan.md 고정 VM 선언. NET-04 전에는 AWX 실행 권한과 credential을 부여하지 않는다.",
        "variables": json.dumps({"awx01_source": "docs/ip-plan.md", "awx01_remote_execution": False}),
    })
    host_groups = {
        "vlan20-k3s": ["k3s-01.imcherry5778.xyz"],
        "vlan30-dmz": ["warpgate-01.imcherry5778.xyz", "netbird-01.imcherry5778.xyz"],
        "vlan50-data": ["postgres-01.imcherry5778.xyz", "object-01.imcherry5778.xyz"],
    }
    for group_name, hostnames in host_groups.items():
        group = ensure("groups", {"name": group_name, "inventory": production["id"]}, {
            "name": group_name, "inventory": production["id"],
            "description": "docs/ip-plan.md 기반 정적 그룹",
        })
        for hostname in hostnames:
            host = ensure("hosts", {"name": hostname, "inventory": production["id"]}, {
                "name": hostname, "inventory": production["id"], "enabled": True,
                "description": "AWX-01 정적 선언; NET-04 전 실행 금지",
                "variables": json.dumps({"awx01_cross_vlan_ssh_validated": False}),
            })
            attach(f"/groups/{group['id']}/hosts/", host["id"])

    boundary = ensure("inventories", {"name": "AWX-01 검증 전용 (cluster 내부)", "organization": organization["id"]}, {
        "name": "AWX-01 검증 전용 (cluster 내부)",
        "organization": organization["id"],
        "description": "선택지 (b) 증거 전용. 실제 운영 대상의 cross-VLAN 접근 증거가 아니다.",
    })
    boundary_host = ensure("hosts", {"name": "awx-verifier.awx.svc.cluster.local", "inventory": boundary["id"]}, {
        "name": "awx-verifier.awx.svc.cluster.local", "inventory": boundary["id"], "enabled": True,
        "description": "AWX-01 선택지 (b) cluster 내부 HTTP 검증 대상",
        "variables": json.dumps({"ansible_connection": "local", "awx01_validation_only": True}),
    })

    credential_type = ensure("credential_types", {"name": "AWX-01 HTTP Basic"}, {
        "name": "AWX-01 HTTP Basic",
        "description": "검증 endpoint에만 쓰는 username/password 환경 주입",
        "kind": "cloud",
        "inputs": {
            "fields": [
                {"id": "username", "type": "string", "label": "Username"},
                {"id": "password", "type": "string", "label": "Password", "secret": True},
            ],
            "required": ["username", "password"],
        },
        "injectors": {"env": {"AWX_VERIFY_USER": "{{ username }}", "AWX_VERIFY_PASSWORD": "{{ password }}"}},
    }, update=False)
    allowed_credential = ensure("credentials", {"name": "AWX-01 verifier allowed", "organization": organization["id"]}, {
        "name": "AWX-01 verifier allowed", "organization": organization["id"],
        "description": "cluster 내부 검증 대상 하나에만 할당",
        "credential_type": credential_type["id"],
        "inputs": {"username": "awx-boundary", "password": runtime["verifier_password"]},
    })
    denied_credential = ensure("credentials", {"name": "AWX-01 verifier denied", "organization": organization["id"]}, {
        "name": "AWX-01 verifier denied", "organization": organization["id"],
        "description": "음성 대조 전용; AWX Operators에는 할당하지 않음",
        "credential_type": credential_type["id"],
        "inputs": {"username": "awx-boundary", "password": runtime["verifier_denied_password"]},
    })

    project = ensure("projects", {"name": "AWX-01 선언 저장소", "organization": organization["id"]}, {
        "name": "AWX-01 선언 저장소", "organization": organization["id"],
        "description": "GitOps ConfigMap이 공급하는 read-only 검증 playbook",
        "scm_type": "", "scm_url": "", "scm_branch": "", "scm_refspec": "",
        "scm_clean": False, "scm_delete_on_update": False, "scm_track_submodules": False,
        "scm_update_on_launch": False, "allow_override": False,
        "credential": None, "local_path": "awx01",
    })

    vault_lookup_type = one("credential_types", {"name": "HashiCorp Vault Secret Lookup"})
    source_control_type = one("credential_types", {"name": "Source Control"})
    machine_type = one("credential_types", {"name": "Machine"})
    if vault_lookup_type is None or source_control_type is None or machine_type is None:
        raise RuntimeError("AWX built-in Vault, Source Control 또는 Machine credential type을 찾지 못했다")
    vault_lookup = ensure("credentials", {"name": "AWX-04 Vault SCM lookup", "organization": organization["id"]}, {
        "name": "AWX-04 Vault SCM lookup", "organization": organization["id"],
        "description": "Gitea deploy key는 Vault external lookup으로만 읽는다.",
        "credential_type": vault_lookup_type["id"],
        "inputs": {
            "url": "https://vault.vault.svc.cluster.local:8200",
            "cacert": open("/trust/vault.crt", encoding="utf-8").read(),
            "role_id": scm["vault_role_id"], "secret_id": scm["vault_secret_id"],
            "default_auth_path": "approle", "api_version": "v2",
        },
    })
    scm_credential = ensure("credentials", {"name": "AWX-04 platform mirror read-only", "organization": organization["id"]}, {
        "name": "AWX-04 platform mirror read-only", "organization": organization["id"],
        "description": "deploy key 원문은 저장하지 않고 AWX Vault external input source로만 조회",
        "credential_type": source_control_type["id"], "inputs": {"username": "git"},
    }, update=False)
    ensure("credential_input_sources", {
        "target_credential": scm_credential["id"], "input_field_name": "ssh_key_data",
    }, {
        "target_credential": scm_credential["id"], "source_credential": vault_lookup["id"],
        "input_field_name": "ssh_key_data",
        "metadata": {
            "secret_backend": "kv", "secret_path": "awx/scm", "auth_path": "approle",
            "secret_key": "gitea_deploy_key",
        },
    })
    scm_project = ensure("projects", {"name": "AWX-04 platform 운영 원본", "organization": organization["id"]}, {
        "name": "AWX-04 platform 운영 원본", "organization": organization["id"],
        "description": "GitHub SSOT의 private Gitea pull-mirror. branch override와 project persistence는 금지.",
        "scm_type": "git",
        "scm_url": "ssh://git@gitea-ssh.gitea.svc.cluster.local:2222/ktcloud4-bean/platform.git",
        "scm_branch": "main", "scm_refspec": "",
        "scm_clean": True, "scm_delete_on_update": True, "scm_track_submodules": False,
        "scm_update_on_launch": False, "allow_override": False,
        "credential": scm_credential["id"],
    })
    update_project(scm_project)
    platform_ee = ensure("execution_environments", {"name": "AWX-04 platform EE"}, {
        "name": "AWX-04 platform EE",
        "description": "Jenkins Trivy·SBOM·Cosign을 통과한 Harbor digest 전용 EE",
        "image": "harbor.imcherry5778.xyz/awx-ee/platform-ee@sha256:0a35dcb1933fd6439730dd2a57e325be1bd175852c29dd0e2894728b16137bb9",
        "credential": None, "pull": "",
    })
    scm_template = ensure("job_templates", {"name": "AWX-04 운영 원본 정보", "organization": organization["id"]}, {
        "name": "AWX-04 운영 원본 정보", "organization": organization["id"],
        "description": "SCM main에 고정된 catalog check를 표시만 한다. 실행 권한·branch override·credential use는 없다.",
        "project": scm_project["id"], "inventory": boundary["id"],
        "playbook": "infra/ansible/playbooks/node-exporter-baseline.yml", "job_type": "check",
        "execution_environment": platform_ee["id"],
        "ask_limit_on_launch": False, "ask_inventory_on_launch": False,
        "ask_credential_on_launch": False, "ask_job_type_on_launch": False,
        "ask_scm_branch_on_launch": False, "forks": 1, "verbosity": 0,
    })

    ssh_canary_inventory = ensure("inventories", {"name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"]}, {
        "name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"],
        "description": "같은 k3s-01의 무변경 SSH canary 전용 inventory; 다른 운영 host는 포함하지 않는다.",
        "variables": json.dumps({"ansible_become": False, "awx05_single_target": True}),
    })
    ssh_canary_host = ensure("hosts", {"name": "k3s-01.imcherry5778.xyz", "inventory": ssh_canary_inventory["id"]}, {
        "name": "k3s-01.imcherry5778.xyz", "inventory": ssh_canary_inventory["id"], "enabled": True,
        "description": "AWX-05 canary의 같은-node SSH 대상 하나",
        "variables": json.dumps({
            "ansible_become": False,
            "ansible_ssh_common_args": "-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/awx-ssh-canary/known_hosts -o GlobalKnownHostsFile=/dev/null -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no",
        }),
    })
    ssh_canary_lookup = ensure("credentials", {"name": "AWX-05 Vault Machine lookup", "organization": organization["id"]}, {
        "name": "AWX-05 Vault Machine lookup", "organization": organization["id"],
        "description": "AWX-05 Machine private key external lookup의 단기 AppRole bootstrap",
        "credential_type": vault_lookup_type["id"],
        "inputs": {
            "url": "https://vault.vault.svc.cluster.local:8200",
            "cacert": open("/trust/vault.crt", encoding="utf-8").read(),
            "role_id": ssh_canary["vault_role_id"], "secret_id": ssh_canary["vault_secret_id"],
            "default_auth_path": "approle", "api_version": "v2",
        },
    })
    ssh_canary_credential = ensure("credentials", {"name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"]}, {
        "name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"],
        "description": "전용 비인간 account와 strict host key만 사용하는 no-become Machine credential",
        "credential_type": machine_type["id"],
        "inputs": {
            "username": "awx-canary",
        },
    }, update=False)
    ensure("credential_input_sources", {
        "target_credential": ssh_canary_credential["id"], "input_field_name": "ssh_key_data",
    }, {
        "target_credential": ssh_canary_credential["id"], "source_credential": ssh_canary_lookup["id"],
        "input_field_name": "ssh_key_data",
        "metadata": {
            "secret_backend": "kv", "secret_path": "awx/ssh-canary", "auth_path": "approle",
            "secret_key": "ssh_private_key",
        },
    })
    ssh_canary_template = ensure("job_templates", {"name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"]}, {
        "name": "AWX-05 k3s-01 SSH canary", "organization": organization["id"],
        "description": "k3s-01 하나에서 ping/min facts와 NetworkPolicy 음성 경계만 판정하는 check-only job",
        "project": project["id"], "inventory": ssh_canary_inventory["id"],
        "playbook": "awx05-ssh-canary.yml", "job_type": "check",
        "execution_environment": platform_ee["id"], "limit": "k3s-01.imcherry5778.xyz",
        "become_enabled": False, "allow_simultaneous": False,
        "ask_limit_on_launch": False, "ask_inventory_on_launch": False,
        "ask_credential_on_launch": False, "ask_job_type_on_launch": False,
        "ask_scm_branch_on_launch": False, "ask_variables_on_launch": False,
        "ask_execution_environment_on_launch": False, "ask_forks_on_launch": False,
        "forks": 1, "verbosity": 0,
    })
    attach(f"/job_templates/{ssh_canary_template['id']}/credentials/", ssh_canary_credential["id"])

    ssh_marker_inventory = ensure("inventories", {"name": "AWX-06 netbird-01 marker", "organization": organization["id"]}, {
        "name": "AWX-06 netbird-01 marker", "organization": organization["id"],
        "description": "cross-VLAN SSH와 승인된 가역 marker 한 파일만 판정하는 단일 대상 inventory",
        "variables": json.dumps({"ansible_become": False, "awx06_single_target": True}),
    })
    ssh_marker_host = ensure("hosts", {"name": "netbird-01.imcherry5778.xyz", "inventory": ssh_marker_inventory["id"]}, {
        "name": "netbird-01.imcherry5778.xyz", "inventory": ssh_marker_inventory["id"], "enabled": True,
        "description": "AWX-06 cross-VLAN marker 대상 하나",
        "variables": json.dumps({
            "ansible_become": False,
            "ansible_ssh_common_args": "-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/awx-ssh-marker/known_hosts -o GlobalKnownHostsFile=/dev/null -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no",
        }),
    })
    ssh_marker_lookup = ensure("credentials", {"name": "AWX-06 Vault Machine lookup", "organization": organization["id"]}, {
        "name": "AWX-06 Vault Machine lookup", "organization": organization["id"],
        "description": "AWX-06 Machine private key external lookup의 단기 AppRole bootstrap",
        "credential_type": vault_lookup_type["id"],
        "inputs": {
            "url": "https://vault.vault.svc.cluster.local:8200",
            "cacert": open("/trust/vault.crt", encoding="utf-8").read(),
            "role_id": ssh_marker["vault_role_id"], "secret_id": ssh_marker["vault_secret_id"],
            "default_auth_path": "approle", "api_version": "v2",
        },
    })
    ssh_marker_credential = ensure("credentials", {"name": "AWX-06 netbird-01 marker", "organization": organization["id"]}, {
        "name": "AWX-06 netbird-01 marker", "organization": organization["id"],
        "description": "전용 비인간 account와 strict host key만 사용하는 no-become Machine credential",
        "credential_type": machine_type["id"], "inputs": {"username": "awx-marker"},
    }, update=False)
    ensure("credential_input_sources", {
        "target_credential": ssh_marker_credential["id"], "input_field_name": "ssh_key_data",
    }, {
        "target_credential": ssh_marker_credential["id"], "source_credential": ssh_marker_lookup["id"],
        "input_field_name": "ssh_key_data",
        "metadata": {
            "secret_backend": "kv", "secret_path": "awx/ssh-marker", "auth_path": "approle",
            "secret_key": "ssh_private_key",
        },
    })
    marker_template_common = {
        "project": project["id"], "inventory": ssh_marker_inventory["id"],
        "limit": "netbird-01.imcherry5778.xyz", "execution_environment": platform_ee["id"],
        "become_enabled": False, "allow_simultaneous": False,
        "ask_limit_on_launch": False, "ask_inventory_on_launch": False,
        "ask_credential_on_launch": False, "ask_job_type_on_launch": False,
        "ask_scm_branch_on_launch": False, "ask_variables_on_launch": False,
        "ask_execution_environment_on_launch": False, "ask_forks_on_launch": False,
        "forks": 1, "verbosity": 0,
    }
    marker_precheck = ensure("job_templates", {"name": "AWX-06 netbird marker precheck", "organization": organization["id"]}, {
        **marker_template_common, "name": "AWX-06 netbird marker precheck",
        "description": "marker 부재에서 check가 changed=1을 예고하는 승인 전 단일 대상 판정",
        "playbook": "awx06-marker-precheck.yml", "job_type": "check",
    })
