apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awx-runtime-secret-bootstrap
  namespace: awx
  annotations: {argocd.argoproj.io/sync-wave: "-9"}
rules:
  # Stock AWX Operator 2.19.1 only accepts namespaced Secret references for
  # external PostgreSQL, admin password, secret key and bundle CA. Vault is
  # the source of truth; this one-shot bootstrap is not a sync operator.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awx-runtime-secret-bootstrap
  namespace: awx
  annotations: {argocd.argoproj.io/sync-wave: "-9"}
subjects:
  - kind: ServiceAccount
    name: awx-vault-bootstrap
    namespace: awx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awx-runtime-secret-bootstrap
