apiVersion: v1
kind: ConfigMap
metadata:
  name: awx-secret-bootstrap-script
  namespace: awx
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
data:
  bootstrap.py: |
    #!/usr/bin/env python3
    import base64
    import json
    import os
    import ssl
    import urllib.error
    import urllib.request

    namespace = "awx"
    api = "https://kubernetes.default.svc"
    token = open("/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8").read().strip()
    context = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")

    def read_secret(path):
        with open(path, encoding="utf-8") as handle:
            value = handle.read().strip()
        if not value:
            raise RuntimeError(f"비어 있는 Vault 렌더링 값: {path}")
        return value

    def encoded(values):
        return {key: base64.b64encode(value.encode()).decode() for key, value in values.items()}

    def request(method, path, body=None):
        data = None if body is None else json.dumps(body).encode()
        req = urllib.request.Request(
            api + path,
            data=data,
            method=method,
            headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
        )
        try:
            with urllib.request.urlopen(req, context=context, timeout=30) as response:
                return response.status, json.load(response)
        except urllib.error.HTTPError as error:
            if error.code == 404:
                return 404, None
            raise

    def upsert(name, values, secret_type="Opaque"):
        base_path = f"/api/v1/namespaces/{namespace}/secrets"
        status, current = request("GET", f"{base_path}/{name}")
        manifest = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": name, "namespace": namespace},
            "type": secret_type,
            "data": encoded(values),
        }
        if status == 404:
            request("POST", base_path, manifest)
        else:
            manifest["metadata"]["resourceVersion"] = current["metadata"]["resourceVersion"]
            request("PUT", f"{base_path}/{name}", manifest)
        print(f"runtime Secret 준비됨: {name}")

    db_password = read_secret("/vault/secrets/db-password")
    if any(character in db_password for character in "'\"\\"):
        raise RuntimeError("AWX Operator 비호환 문자가 DB 비밀번호에 포함됨")

    upsert("awx-postgres-configuration", {
        "host": "postgres-01.imcherry5778.xyz",
        "port": "5432",
        "database": "awx",
        "username": "awx_user",
        "password": db_password,
        "sslmode": "verify-full",
        "target_session_attrs": "read-write",
        "type": "unmanaged",
    })
    upsert("awx-admin-password", {"password": read_secret("/vault/secrets/admin-password")})
    upsert("awx-secret-key", {"secret_key": read_secret("/vault/secrets/secret-key")})
    upsert("awx-bundle-ca", {
        "bundle-ca.crt": open("/trust/postgres-01.crt", encoding="utf-8").read()
    })
    pull = json.load(open("/vault/secrets/ee-pull.json", encoding="utf-8"))
    pull_user = pull["harbor_robot_name"]
    pull_secret = pull["harbor_robot_secret"]
    docker_auth = base64.b64encode(f"{pull_user}:{pull_secret}".encode()).decode()
    upsert("awx-ee-pull", {
        ".dockerconfigjson": json.dumps({"auths": {
            "harbor.imcherry5778.xyz": {
                "username": pull_user, "password": pull_secret, "auth": docker_auth,
            }
        }}, separators=(",", ":")),
    }, secret_type="kubernetes.io/dockerconfigjson")
    upsert("awx-ee-pull-credentials", {
        "url": "https://harbor.imcherry5778.xyz",
        "username": pull_user,
        "password": pull_secret,
        "ssl_verify": "true",
    })
    upsert("awx-scm-known-hosts", {
        "known_hosts": read_secret("/vault/secrets/scm-known-hosts"),
    })
    upsert("awx-ssh-canary-known-hosts", {
        "known_hosts": read_secret("/vault/secrets/ssh-canary-known-hosts"),
    })
