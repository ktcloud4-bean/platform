apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-crowdsec-agent
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: vault-crowdsec-issuer
    app.kubernetes.io/part-of: platform-gitops
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    path: pki/sign/crowdsec-agent
    caBundleSecretRef:
      name: vault-server-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-vault-crowdsec-agent
        serviceAccountRef:
          name: cert-manager-vault-crowdsec-agent
---
