apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-internal
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: vault-issuer
    app.kubernetes.io/part-of: platform-gitops
spec:
  vault:
    server: https://vault.vault.svc.cluster.local:8200
    path: pki/sign/cert-manager-internal-workload
    caBundleSecretRef:
      name: vault-server-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-vault-issuer
        serviceAccountRef:
          name: cert-manager-vault-issuer
