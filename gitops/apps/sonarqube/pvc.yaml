apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: sonarqube
  annotations:
    # local-path는 WaitForFirstConsumer이므로 소비 Deployment와 같은 wave에서 바인딩한다.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: platform-gitops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 30Gi
