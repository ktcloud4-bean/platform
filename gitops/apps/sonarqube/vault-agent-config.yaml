apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-vault-agent
  namespace: sonarqube
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: sonarqube
    app.kubernetes.io/component: secret-consumer
    app.kubernetes.io/part-of: platform-gitops
data:
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "sonarqube"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/vault/secrets/runtime.env"
      perms                = "0440"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/sonarqube/runtime" -}}
    SONAR_JDBC_PASSWORD={{ .Data.data.db_password }}
    {{- end -}}
    EOT
    }

  verifier.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "sonarqube-verifier"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    template {
      destination          = "/vault/secrets/scanner.env"
      perms                = "0440"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/sonarqube/verification" -}}
    QUALITY01_PASS_TOKEN={{ .Data.data.pass_token }}
    QUALITY01_FAIL_TOKEN={{ .Data.data.fail_token }}
    {{- end -}}
    EOT
    }
