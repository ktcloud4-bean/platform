apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-01-secret-bootstrap-v1
  namespace: e2e-01
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: e2e-01
    app.kubernetes.io/component: secret-bootstrap
    app.kubernetes.io/part-of: platform-gitops
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-01
        app.kubernetes.io/component: secret-bootstrap
    spec:
      serviceAccountName: e2e-01-vault-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: vault-agent
          image: harbor.imcherry5778.xyz/curated-platform/vault@sha256:18ceda087817a9e0dbed22fb632225fdc079f1b909bc0ff94d00ade4c4990e9f
          imagePullPolicy: IfNotPresent
          args: ["agent", "-config=/vault/config/bootstrap.hcl"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: vault-agent-config, mountPath: /vault/config, readOnly: true}
            - {name: trust, mountPath: /vault/tls, readOnly: true}
            - {name: rendered, mountPath: /vault/secrets}
            - {name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: bootstrap
          # 저장소에 이미 고정된 AWX EE의 Python 표준 라이브러리만 재사용한다.
          image: harbor.imcherry5778.xyz/curated-platform/awx-ee@sha256:d6fca88c8c26e143b1fc71cc60db3b0ee06c43cc46fd395e902dcec3dbc5af9b
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/bootstrap.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: rendered, mountPath: /vault/secrets, readOnly: true}
            - {name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: vault-agent-config
          configMap: {name: e2e-01-vault-agent}
        - name: script
          configMap: {name: e2e-01-secret-bootstrap-script, defaultMode: 0550}
        - name: trust
          configMap: {name: e2e-01-trust-bundle}
        - name: rendered
          emptyDir: {medium: Memory, sizeLimit: 4Mi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600, audience: vault}
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
