apiVersion: policies.kyverno.io/v1beta1
kind: ImageValidatingPolicy
metadata:
  name: e2e-01-verify-release-image
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    policies.kyverno.io/title: E2E-01 signed release image
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
  labels:
    app.kubernetes.io/name: e2e-01
    app.kubernetes.io/component: admission
    app.kubernetes.io/part-of: platform-gitops
spec:
  failurePolicy: Fail
  evaluation:
    mode: Kubernetes
    admission:
      enabled: true
    background:
      enabled: false
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: exact-e2e-01-namespace
      expression: >-
        object.metadata.namespace == "e2e-01"
  matchImageReferences:
    - glob: harbor.imcherry5778.xyz/ci01-evidence/ci01-app*
  credentials:
    secrets:
      - e2e-01-registry
  variables:
    - name: currentTrust
      expression: >-
        resource.get("v1", "secrets", "e2e-01", "e2e-01-cosign-current")
    - name: currentKey
      expression: >-
        string(base64.decode(variables.currentTrust.data["cosign.pub"]))
    - name: previousTrust
      expression: >-
        resource.get("v1", "secrets", "e2e-01", "e2e-01-cosign-previous")
    - name: previousKey
      expression: >-
        string(base64.decode(variables.previousTrust.data["cosign.pub"]))
  attestors:
    - name: current
      cosign:
        key:
          expression: variables.currentKey
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
    - name: previous
      cosign:
        key:
          expression: variables.previousKey
        ctlog:
          url: https://rekor.sigstore.dev
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.current, attestors.previous])).all(count, count > 0)
      message: current 또는 previous 공개키로 Cosign signature를 검증하지 못했다
