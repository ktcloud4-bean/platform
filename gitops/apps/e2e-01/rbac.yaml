apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-01-runtime-secret-bootstrap
  namespace: e2e-01
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-01-runtime-secret-bootstrap
  namespace: e2e-01
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: e2e-01-vault-bootstrap
    namespace: e2e-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-01-runtime-secret-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-01-kyverno-public-key-reader
  namespace: e2e-01
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - e2e-01-cosign-current
      - e2e-01-cosign-previous
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-01-kyverno-public-key-reader
  namespace: e2e-01
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-01-kyverno-public-key-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-01-runtime-registry-bootstrap
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - e2e-01-registry
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-01-runtime-registry-bootstrap
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: e2e-01-vault-bootstrap
    namespace: e2e-01
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-01-runtime-registry-bootstrap
