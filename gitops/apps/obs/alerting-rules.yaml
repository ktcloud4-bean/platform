# OBS-13: 상시 alert rule 4종.
#
# for·threshold 근거는 gitops/apps/obs/README.md의 "OBS-13 상시 alert rule과 실제
# 알림 채널" 절이 소유한다. Prometheus는 release=obs label이 있는 PrometheusRule만
# 선택한다(gitops/apps/obs/README.md의 수집 경계 절 참고).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: obs-13-alerting-rules
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  groups:
    - name: obs-13-node-down
      rules:
        - alert: NodeDown
          expr: up{job="node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "node-exporter target {{ $labels.instance }}가 5분 이상 응답하지 않는다."
    - name: obs-13-root-filesystem
      rules:
        - alert: RootFilesystemUsageWarning
          expr: >-
            100 * (1 - node_filesystem_avail_bytes{job=~"node-exporter|node-exporter-root",mountpoint="/",fstype!="tmpfs"}
            / node_filesystem_size_bytes{job=~"node-exporter|node-exporter-root",mountpoint="/",fstype!="tmpfs"}) > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} root filesystem 사용률이 85%를 10분 이상 초과했다."
        - alert: RootFilesystemUsageCritical
          expr: >-
            100 * (1 - node_filesystem_avail_bytes{job=~"node-exporter|node-exporter-root",mountpoint="/",fstype!="tmpfs"}
            / node_filesystem_size_bytes{job=~"node-exporter|node-exporter-root",mountpoint="/",fstype!="tmpfs"}) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.instance }} root filesystem 사용률이 95%를 5분 이상 초과했다."
    - name: obs-13-certificate
      rules:
        - alert: TLSCertificateExpiringSoon
          expr: >-
            (probe_ssl_earliest_cert_expiry{service="obs-blackbox",target="traefik-certificate"} - time()) < 14 * 86400
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.target }} TLS 인증서가 14일 이내 만료된다."
    - name: obs-13-backup
      rules:
        - alert: VeleroBackupFailed
          # velero_backup_failure_total(완전 실패)과 velero_backup_partial_failure_total
          # (부분 실패)을 모두 잡는다. 라이브 실측으로 완전 실패는 실제 오브젝트 스토리지
          # 접근 실패처럼 운영 backup 경로를 직접 건드려야만 재현되는 반면, 부분 실패는
          # 안전한 backup 요청(예: 존재하지 않는 namespace selector)만으로도 재현되고
          # 두 phase 모두 백업 건강 이상 신호라는 점은 같다.
          expr: >-
            increase(velero_backup_failure_total{namespace="velero",service="velero"}[1h]) > 0
            or increase(velero_backup_partial_failure_total{namespace="velero",service="velero"}[1h]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Velero backup 실패(완전 또는 부분)가 지난 1시간 안에 발생했다."
    - name: obs-16-native-metrics
      rules:
        - alert: NativeMetricsTargetDown
          expr: up{job=~"postgres-exporter|seaweedfs|netbird-management"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} {{ $labels.component }} target {{ $labels.instance }}가 5분 이상 응답하지 않는다."
        - alert: PostgreSQLDatabaseMetricsDown
          expr: pg_up{job="postgres-exporter",instance="postgres-01.imcherry5778.xyz"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "postgres_exporter가 PostgreSQL 자체에 연결하지 못한다."
    - name: obs-17-warpgate
      rules:
        - alert: WarpgateServiceDown
          expr: >-
            node_systemd_unit_state{job="node-exporter",instance="10.10.30.10:9100",name="warpgate.service",state="active"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "warpgate.service가 5분 이상 active가 아니다."
        - alert: WarpgateACMERenewTimerDown
          expr: >-
            node_systemd_unit_state{job="node-exporter",instance="10.10.30.10:9100",name="warpgate-acme-renew.timer",state="active"} != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "warpgate-acme-renew.timer가 5분 이상 active가 아니다."
        - alert: WarpgateTLSCertificateExpiringSoon
          expr: >-
            (probe_ssl_earliest_cert_expiry{service="obs-blackbox",target="warpgate-certificate"} - time()) < 14 * 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Warpgate private TLS 인증서가 14일 이내 만료된다."
    # BKP-07: k3s-datastore-backup·postgres-native-backup·vault-raft-backup
    # 세 systemd timer job은 Alertmanager에 걸리는 규칙이 없어, PostgreSQL(8/12부터)과
    # Vault(8/8부터)가 며칠씩 조용히 실패해도 아무도 몰랐다(BKP-06에서 발견·복구).
    # 세 unit 모두 OBS-11/13/17 fleet가 이미 --collector.systemd로 수집 중이라
    # node_systemd_unit_state{state="failed"}==1을 직접 감시한다(WarpgateServiceDown과
    # 달리 timer가 아니라 oneshot .service 자체를 본다 — timer는 트리거된 job이 실패해도
    # 계속 active라 실패를 못 잡는다).
    - name: bkp-07-native-backup
      rules:
        - alert: K3sDatastoreBackupFailed
          expr: >-
            node_systemd_unit_state{job="node-exporter-root",instance="10.10.20.10:9101",name="k3s-datastore-backup.service",state="failed"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "k3s-datastore-backup.service가 마지막 실행에서 실패했다."
        - alert: PostgreSQLNativeBackupFailed
          expr: >-
            node_systemd_unit_state{job="node-exporter",instance="10.10.50.10:9100",name="postgres-native-backup.service",state="failed"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "postgres-native-backup.service가 마지막 실행에서 실패했다."
        - alert: VaultRaftBackupFailed
          expr: >-
            node_systemd_unit_state{job="node-exporter-root",instance="10.10.20.10:9101",name="vault-raft-backup.service",state="failed"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "vault-raft-backup.service가 마지막 실행에서 실패했다."
