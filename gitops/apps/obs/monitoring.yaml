apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: opnsense-node
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 10.10.10.1:9100
      labels:
        instance: opnsense.imcherry5778.xyz
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-fleet
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  # OBS-11: proxmox-01·postgres-01·object-01·warpgate-01·netbird-01의 checksum 고정
  # node_exporter systemd unit(infra/ansible/roles/node_exporter_baseline)을 읽는다.
  # k3s-01은 기존 obs-prometheus-node-exporter DaemonSet 대상이므로 여기 포함하지
  # 않는다. instance는 기본 __address__(ip:port)를 그대로 써서 기존 k3s-01
  # node-exporter target(instance=10.10.20.10:9100)과 형식을 맞춘다. job만
  # node-exporter로 덮어써 Node Exporter Full 대시보드의 job 변수를 정규화한다.
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 10.10.10.10:9100
        - 10.10.50.10:9100
        - 10.10.50.20:9100
        - 10.10.30.10:9100
        - 10.10.40.10:9100
      labels:
        job: node-exporter
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter-root-k3s01
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  # OBS-13: 기존 obs-prometheus-node-exporter DaemonSet(10.10.20.10:9100)은 non-root
  # securityContext 때문에 filesystem collector만 실패한다(OBS-11이 기존 한계로
  # 판정). DaemonSet은 바꾸지 않고, 같은 host에 별도 포트(9101)로 떠 있는 host-level
  # node_exporter(infra/ansible/roles/node_exporter_baseline,
  # inventory group node_exporter_root_k3s01)를 filesystem 대표 시계열 보완용으로만
  # 추가한다. job을 fleet(job=node-exporter)과 분리해 OBS-11의 6-target 집계·대시보드
  # job 변수를 건드리지 않는다.
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 10.10.20.10:9101
      labels:
        job: node-exporter-root
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: postgres-exporter
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  # OBS-15: postgres-01의 local peer + pg_read_all_stats exporter를 관리 주소 TCP
  # 9187에서만 scrape한다. PostgreSQL TCP 5432·pg_hba·Secret은 바꾸지 않는다.
  metricsPath: /metrics
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 10.10.50.10:9187
      labels:
        job: postgres-exporter
        instance: postgres-01.imcherry5778.xyz
---
