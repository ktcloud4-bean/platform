apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obs-velero
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  namespaceSelector:
    matchNames: [velero]
  selector:
    matchLabels:
      app.kubernetes.io/instance: velero
      app.kubernetes.io/name: velero
  endpoints:
    - port: http-monitoring
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
