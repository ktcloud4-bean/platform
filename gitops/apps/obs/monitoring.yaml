apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obs-traefik
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
  jobLabel: app.kubernetes.io/name
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
