apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-02-dashboard
  namespace: obs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: platform-gitops
data:
  overview.json: >
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 1,
          "title": "Node Ready/NotReady",
          "type": "stat",
          "gridPos": {
            "w": 4,
            "h": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"}) or vector(0)",
              "legendFormat": "Ready Nodes"
            }
          ],
          "transformations": [],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "0 / 1",
                      "color": "red"
                    },
                    "1": {
                      "text": "1 / 1",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 2,
          "title": "Core Components",
          "type": "stat",
          "gridPos": {
            "w": 5,
            "h": 8,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(up{job=~\"traefik|postgres|vault|pomerium\"} == 1) or vector(0)",
              "legendFormat": "Ready Core"
            }
          ],
          "options": {
            "textMode": "value",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "0 / 4",
                      "color": "red"
                    },
                    "1": {
                      "text": "1 / 4",
                      "color": "red"
                    },
                    "2": {
                      "text": "2 / 4",
                      "color": "red"
                    },
                    "3": {
                      "text": "3 / 4",
                      "color": "orange"
                    },
                    "4": {
                      "text": "4 / 4",
                      "color": "green"
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          },
          "links": [
            {
              "title": "OBS-05 Core Services",
              "url": "/d/obs-05-core-services",
              "targetBlank": false
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 3,
          "title": "Firing Alerts Count",
          "type": "stat",
          "gridPos": {
            "w": 5,
            "h": 8,
            "x": 9,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          },
          "links": [
            {
              "title": "Alertmanager",
              "url": "/alerting/list",
              "targetBlank": true
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 4,
          "title": "Argo CD OutOfSync",
          "type": "stat",
          "gridPos": {
            "w": 5,
            "h": 8,
            "x": 14,
            "y": 0
          },
          "targets": [
            {
              "expr": "count(argocd_app_info{sync_status!=\"Synced\"} or argocd_app_info{health_status!=\"Healthy\"}) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          },
          "options": {
            "colorMode": "background"
          },
          "links": [
            {
              "title": "Argo CD UI",
              "url": "/argocd",
              "targetBlank": true
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 5,
          "title": "Pod Restarts (15m)",
          "type": "stat",
          "gridPos": {
            "w": 5,
            "h": 8,
            "x": 19,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total[15m]))"
            }
          ],
          "options": {
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          },
          "links": [
            {
              "title": "OBS-07 Loki Log Explorer",
              "url": "/d/obs-07-loki-log-explorer",
              "targetBlank": false
            }
          ]
        },
        {
          "id": 6,
          "title": "Cluster CPU (%)",
          "type": "gauge",
          "gridPos": {
            "w": 8,
            "h": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100))",
              "legendFormat": "Max CPU"
            },
            {
              "expr": "avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100))",
              "legendFormat": "Avg CPU",
              "hide": true
            }
          ],
          "options": {
            "orientation": "auto",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 7,
          "title": "Cluster RAM (%)",
          "type": "gauge",
          "gridPos": {
            "w": 8,
            "h": 12,
            "x": 8,
            "y": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)",
              "legendFormat": "Max RAM"
            },
            {
              "expr": "avg((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)",
              "legendFormat": "Avg RAM",
              "hide": true
            }
          ],
          "options": {
            "orientation": "auto",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          },
          "links": [
            {
              "title": "OBS-04 Capacity Sentinel",
              "url": "/d/obs-04-capacity-sentinel",
              "targetBlank": false
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "id": 8,
          "title": "Max PVC Usage (%)",
          "type": "gauge",
          "gridPos": {
            "w": 8,
            "h": 12,
            "x": 16,
            "y": 8
          },
          "targets": [
            {
              "expr": "max(kubelet_volume_stats_used_bytes / on(persistentvolumeclaim, namespace) kubelet_volume_stats_capacity_bytes) * 100 or vector(0)"
            }
          ],
          "options": {
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "No data",
                      "color": "dark-gray"
                    }
                  }
                }
              ]
            }
          }
        }
      ],
      "schemaVersion": 41,
      "tags": [
        "obs-02",
        "platform"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "title": "Platform observability overview",
      "uid": "obs-02-overview",
      "version": 2
    }
