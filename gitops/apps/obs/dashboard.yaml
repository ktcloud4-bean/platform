apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-02-dashboard
  namespace: obs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: platform-gitops
data:
  overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "count(node_uname_info{service=\"obs-prometheus-node-exporter\"})", "legendFormat": "nodes", "refId": "A"}],
          "title": "Node exporter",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "count(kube_persistentvolumeclaim_info{service=\"obs-kube-state-metrics\"})", "legendFormat": "PVC", "refId": "A"}],
          "title": "PersistentVolumeClaims",
          "type": "stat"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "value_and_name"},
          "targets": [{"expr": "sum(count_over_time({namespace=~\".+\"}[5m]))", "legendFormat": "logs", "refId": "A"}],
          "title": "Loki logs in the last 5 minutes",
          "type": "stat"
        }
      ],
      "schemaVersion": 41,
      "tags": ["obs-02", "platform"],
      "time": {"from": "now-6h", "to": "now"},
      "title": "Platform observability overview",
      "uid": "obs-02-overview",
      "version": 1
    }
