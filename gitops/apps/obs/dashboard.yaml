apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-02-dashboard
  namespace: obs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: platform-gitops
data:
  overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 1,
          "title": "Node Ready/NotReady",
          "type": "stat",
          "gridPos": {"h": 8, "w": 4, "x": 0, "y": 0},
          "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\", status=\"true\"}) / count(kube_node_status_condition{condition=\"Ready\"})"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          }
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 2,
          "title": "Core Components Up/Down",
          "type": "stat",
          "gridPos": {"h": 8, "w": 8, "x": 4, "y": 0},
          "targets": [{"expr": "up{job=~\"traefik|postgres|vault|pomerium\"}", "legendFormat": "{{job}}"}],
          "options": {
            "textMode": "value_and_name",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          }
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 3,
          "title": "Firing Alerts Count",
          "type": "stat",
          "gridPos": {"h": 8, "w": 4, "x": 12, "y": 0},
          "targets": [{"expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            }
          }
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 4,
          "title": "Argo CD Sync Status",
          "type": "table",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "targets": [{"expr": "argocd_app_info{sync_status!=\"Synced\"} or argocd_app_info{health_status!=\"Healthy\"}", "format": "table", "instant": true}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 5,
          "title": "Cluster CPU / RAM (%)",
          "type": "gauge",
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "targets": [
            {"expr": "avg(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100))", "legendFormat": "CPU Avg"},
            {"expr": "max(100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100))", "legendFormat": "CPU Max"},
            {"expr": "avg((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)", "legendFormat": "RAM Avg"},
            {"expr": "max((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100)", "legendFormat": "RAM Max"}
          ]
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 6,
          "title": "Max PVC Usage (%)",
          "type": "gauge",
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "targets": [{"expr": "max(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "id": 7,
          "title": "Pod Restarts (15m)",
          "type": "stat",
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total[15m]))"}],
          "options": {"colorMode": "background"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          }
        }
      ],
      "schemaVersion": 41,
      "tags": ["obs-02", "platform"],
      "time": {"from": "now-6h", "to": "now"},
      "title": "Platform observability overview",
      "uid": "obs-02-overview",
      "version": 2
    }
