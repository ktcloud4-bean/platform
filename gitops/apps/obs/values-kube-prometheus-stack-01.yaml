nameOverride: obs
fullnameOverride: obs

crds:
  enabled: true
  upgradeJob:
    enabled: false

defaultRules:
  create: false

alertmanager:
  enabled: true
  serviceAccount:
    automountServiceAccountToken: false
  config:
    global:
      resolve_timeout: 1m
    route:
      group_by: [alertname]
      group_wait: 5s
      group_interval: 1m
      repeat_interval: 12h
      receiver: discard
      routes:
        - receiver: obs-01-verification
          matchers:
            - alertname = "OBS01Delivery"
        # OBS-13·OBS-16·OBS-17: 허용한 10개 alertname만 실제 채널(obs-13-receiver)로 보낸다.
        # 다른 모든 alertname은 여전히 discard로 떨어진다.
        - receiver: obs-13-receiver
          matchers:
            - alertname =~ "NodeDown|RootFilesystemUsageWarning|RootFilesystemUsageCritical|TLSCertificateExpiringSoon|VeleroBackupFailed|NativeMetricsTargetDown|PostgreSQLDatabaseMetricsDown|WarpgateServiceDown|WarpgateACMERenewTimerDown|WarpgateTLSCertificateExpiringSoon"
    receivers:
      - name: discard
      - name: obs-01-verification
        webhook_configs:
          - url: http://obs-01-alert-sink.obs-01-test.svc:8080/alerts
            send_resolved: true
      - name: obs-13-receiver
        webhook_configs:
          # alerting-receiver.yaml의 상시 receiver. obs namespace 안이라
          # obs-internal NetworkPolicy가 이미 이 경로를 연다.
          - url: http://obs-13-receiver.obs.svc:8080/alerts
            send_resolved: true
  alertmanagerSpec:
    automountServiceAccountToken: false
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.33.1
      sha: 9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    replicas: 1
    retention: 120h
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 300m
        memory: 256Mi
    securityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
  serviceAccount:
    create: true
    name: obs-grafana
    automountServiceAccountToken: false
  automountServiceAccountToken: false
  testFramework:
    enabled: false
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.1.1
    sha: 7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
  initChownData:
    enabled: false
  persistence:
    enabled: false
    inMemory:
      enabled: false
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform-observability
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-observability
        - name: platform-capacity
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-capacity
        - name: platform-core-services
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-core-services
        - name: platform-backup-pipelines
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-backup-pipelines
        - name: platform-loki-log-explorer
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-loki-log-explorer
        - name: platform-argocd-application-overview
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-argocd-application-overview
        - name: platform-kubernetes-global
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-kubernetes-global
        - name: platform-node-exporter-full
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/platform-node-exporter-full
  dashboardsConfigMaps:
    platform-observability: obs-02-dashboard
    platform-capacity: obs-04-capacity-sentinel
    platform-core-services: obs-05-core-services
    platform-backup-pipelines: obs-06-backup-pipelines
    platform-loki-log-explorer: obs-07-loki-log-explorer
    platform-argocd-application-overview: obs-12-argocd-application-overview
    platform-kubernetes-global: obs-09-kubernetes-global
    platform-node-exporter-full: obs-11-node-exporter-full
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://obs-prometheus.obs.svc:9090
          isDefault: true
          editable: false
        - name: Alertmanager
          uid: alertmanager
          type: alertmanager
          access: proxy
          url: http://obs-alertmanager.obs.svc:9093
          editable: false
          jsonData:
            implementation: prometheus
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki.loki.svc:3100
          editable: false
  env:
    GF_SERVER_ROOT_URL: https://grafana.imcherry5778.xyz
    GF_SECURITY_ALLOW_EMBEDDING: "true"
    GF_LIVE_ALLOWED_ORIGINS: "*"
    GF_SECURITY_ADMIN_USER: admin
    GF_SECURITY_ADMIN_PASSWORD__FILE: /vault/secrets/admin-password
    GF_USERS_ALLOW_SIGN_UP: "false"
    GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
    GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /vault/secrets/oidc-client-secret
    GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://sso.imcherry5778.xyz/realms/platform/protocol/openid-connect/auth
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://sso.imcherry5778.xyz/realms/platform/protocol/openid-connect/token
    GF_AUTH_GENERIC_OAUTH_API_URL: https://sso.imcherry5778.xyz/realms/platform/protocol/openid-connect/userinfo
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], '/grafana-editors') && 'Editor' || 'Viewer'"
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
    GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
    GF_ANALYTICS_REPORTING_ENABLED: "false"
    GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  extraInitContainers:
    - name: vault-agent
      image: hashicorp/vault:2.0.3@sha256:a296a888b118615dc01d5f1a6846e6d4a7277946caaed5b447008fff5fe06b54
      imagePullPolicy: IfNotPresent
      args:
        - agent
        - -config=/vault/config/vault-agent.hcl
      securityContext:
        runAsUser: 100
        runAsGroup: 472
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      volumeMounts:
        - name: obs-grafana-runtime-config
          mountPath: /vault/config
          readOnly: true
        - name: obs-grafana-runtime-config
          mountPath: /vault/tls/vault.crt
          subPath: vault.crt
          readOnly: true
        - name: obs-grafana-runtime-secrets
          mountPath: /vault/secrets
        - name: vault-agent-tmp
          mountPath: /tmp
        - name: vault-token
          mountPath: /var/run/secrets/vault
          readOnly: true
  extraContainerVolumes:
    - name: vault-token
      projected:
        defaultMode: 0440
        sources:
          - serviceAccountToken:
              path: token
              audience: vault
              expirationSeconds: 600
  extraVolumeMounts:
    - name: obs-grafana-runtime-secrets
      mountPath: /vault/secrets
      readOnly: true
  extraVolumes:
    - name: obs-grafana-runtime-secrets
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
    - name: vault-agent-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
    - name: obs-grafana-runtime-config
      configMap:
        name: obs-grafana-runtime-config

