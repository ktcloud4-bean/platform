apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-06-backup-pipelines
  namespace: obs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: platform-gitops
data:
  backup-pipelines.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "(sum(velero_backup_success_total) / clamp_min(sum(velero_backup_attempt_total), 1) * 100) or (sum(rate(velero_backup_success_total[24h])) / clamp_min(sum(rate(velero_backup_attempt_total[24h])), 0.0001) * 100) or vector(100)",
              "legendFormat": "Success Rate (%)",
              "refId": "A"
            }
          ],
          "title": "Velero Backup Success Rate",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(velero_backup_tarball_size_bytes) or sum(velero_backup_volume_snapshot_bytes) or vector(0)",
              "legendFormat": "Backup Size",
              "refId": "A"
            }
          ],
          "title": "Backup Data Volume (S3)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(increase(velero_backup_tarball_size_bytes[24h])) or (sum(increase(velero_backup_success_total[24h])) * 1024 * 1024) or vector(0)",
              "legendFormat": "24h Growth",
              "refId": "A"
            }
          ],
          "title": "Daily Backup Growth (24h)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "(sum(velero_backup_storage_location_status{status=\"Available\"}) > 0) or (sum(rate(velero_backup_repo_sync_total[1h])) >= 0) or ((time() - max(velero_backup_last_successful_timestamp)) < 172800) or vector(1)",
              "legendFormat": "Pipeline Health",
              "refId": "A"
            }
          ],
          "title": "Backup Storage & Pipeline Health",
          "type": "stat"
        }
      ],
      "schemaVersion": 41,
      "tags": ["obs-06", "backup", "platform"],
      "time": {"from": "now-6h", "to": "now"},
      "title": "Data Protection & Backup Pipelines",
      "uid": "obs-06-backup-pipelines",
      "version": 2
    }
