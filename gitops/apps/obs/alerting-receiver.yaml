# OBS-13: 상시(영구) Alertmanager webhook receiver.
#
# OBS-01의 임시 검증용 receiver(gitops/tools/obs-01/verify-live.sh)와 같은 최소 권한
# 패턴(non-root, capability drop, pinned python 이미지)을 쓰되, 검증이 끝나도 지우지
# 않는 상시 컴포넌트다. 받은 alert를 kubectl logs로 사람이 볼 수 있게 남기고,
# /metrics로 Prometheus가 다시 긁어가게 해 Grafana에서 수신 이력을 조회할 수 있게 한다.
# obs namespace 안에 두므로 obs-internal NetworkPolicy(모든 obs Pod 상호 허용)가 이미
# Alertmanager→receiver, Prometheus→receiver 스크레이프를 둘 다 연다 — 새 NetworkPolicy가
# 필요 없다. 이미지는 release-metadata.env의 PYTHON_IMAGE*(OBS-01이 이미 검증한 pin)를
# 그대로 재사용한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-13-receiver
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/name: obs-13-receiver
    app.kubernetes.io/part-of: platform-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-13-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obs-13-receiver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: docker.io/library/python:3.13.7-alpine3.22@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
          imagePullPolicy: IfNotPresent
          command: [python3, -u, -c]
          args:
            - |-
              import json, time, threading
              from collections import defaultdict
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              lock = threading.Lock()
              counts = defaultdict(int)
              last_seen = {}

              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, *_):
                      return

                  def do_GET(self):
                      if self.path == "/metrics":
                          with lock:
                              lines = ["# TYPE obs13_alerts_received_total counter"]
                              for (alertname, severity, status), n in counts.items():
                                  lines.append(
                                      'obs13_alerts_received_total{alertname="%s",severity="%s",status="%s"} %d'
                                      % (alertname, severity, status, n)
                                  )
                              lines.append("# TYPE obs13_alert_last_received_timestamp_seconds gauge")
                              for alertname, ts in last_seen.items():
                                  lines.append(
                                      'obs13_alert_last_received_timestamp_seconds{alertname="%s"} %d'
                                      % (alertname, ts)
                                  )
                          body = ("\n".join(lines) + "\n").encode()
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; version=0.0.4")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                      else:
                          self.send_response(404)
                          self.end_headers()

                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      raw = self.rfile.read(length) if length else b"{}"
                      try:
                          payload = json.loads(raw or b"{}")
                      except json.JSONDecodeError:
                          payload = {}
                      now = int(time.time())
                      with lock:
                          for alert in payload.get("alerts", []):
                              labels = alert.get("labels", {}) or {}
                              alertname = labels.get("alertname", "unknown")
                              severity = labels.get("severity", "unknown")
                              status = alert.get("status", "unknown")
                              counts[(alertname, severity, status)] += 1
                              last_seen[alertname] = now
                              print(
                                  "RECEIVED alertname=%s severity=%s status=%s" % (alertname, severity, status),
                                  flush=True,
                              )
                      body = b'{"status":"ok"}'
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: obs-13-receiver
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/name: obs-13-receiver
    app.kubernetes.io/part-of: platform-gitops
spec:
  selector:
    app.kubernetes.io/name: obs-13-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obs-13-receiver
  namespace: obs
  labels:
    release: obs
    app.kubernetes.io/part-of: platform-gitops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obs-13-receiver
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
