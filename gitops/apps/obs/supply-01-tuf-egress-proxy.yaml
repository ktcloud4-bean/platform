# SUPPLY-01-FIX-01: EKS Kyverno TUF metadata 전용 CONNECT proxy.
# EKS는 이 hostNetwork listener로만 접근하고, process는 TUF CDN authority를 다시 고정한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-01-tuf-egress-proxy
  namespace: obs
  labels:
    app.kubernetes.io/name: supply-01-tuf-egress-proxy
    app.kubernetes.io/part-of: platform-gitops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: supply-01-tuf-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supply-01-tuf-egress-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: supply-01-tuf-egress-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-01.imcherry5778.xyz
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connect-proxy
          image: harbor.imcherry5778.xyz/curated-platform/python@sha256:527c28b29498575b851ad88e7522ac7201bbd9e920d2c11b00ff2b39b315f5f8
          imagePullPolicy: IfNotPresent
          command: [python3, -u, /app/supply-01-tuf-egress-proxy.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: connect
              containerPort: 8445
          readinessProbe:
            tcpSocket:
              host: 10.10.20.12
              port: connect
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              host: 10.10.20.12
              port: connect
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: proxy-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: proxy-code
          configMap:
            name: supply-01-tuf-egress-proxy
            defaultMode: 0555
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supply-01-tuf-egress-proxy
  namespace: obs
  labels:
    app.kubernetes.io/name: supply-01-tuf-egress-proxy
    app.kubernetes.io/part-of: platform-gitops
automountServiceAccountToken: false
