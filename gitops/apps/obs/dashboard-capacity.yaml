          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 34359738368,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 8589934592},
                  {"color": "green", "value": 12884901888}
                ]
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 3, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "sum(node_memory_MemAvailable_bytes) or node_memory_MemAvailable_bytes",
              "legendFormat": "클러스터 합산",
              "refId": "A"
            }
          ],
          "title": "클러스터 합산: RAM Available / 12 GiB",
