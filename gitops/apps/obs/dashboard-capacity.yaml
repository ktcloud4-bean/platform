            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "(sum(node_memory_MemAvailable_bytes) - 8589934592) / clamp_min(-deriv(sum(node_memory_MemAvailable_bytes)[1d:1h]), 1) / 86400",
              "legendFormat": "정지선까지 예상 도달일",
              "refId": "A"
            }
          ],
          "title": "RAM 정지선 예상 도달일 (8 GiB 정지선 기준)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 7},
                  {"color": "green", "value": 14}
                ]
              },
              "unit": "d"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 12, "x": 12, "y": 10},
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
