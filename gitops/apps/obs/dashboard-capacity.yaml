          "options": {
            "content": "LVM thin provisioning pool 실사용 대비 할당 비율. 70% 초과 시 신규 쓰기 실패 위험 — 대상: {노드/볼륨그룹명}",
            "mode": "markdown"
          },
          "title": "Thin-pool 안내",
          "type": "text"
