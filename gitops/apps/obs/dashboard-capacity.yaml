          "targets": [
            {
              "expr": "(96 * 1073741824 - sum(kubelet_volume_stats_used_bytes)) / clamp_min(deriv(sum(kubelet_volume_stats_used_bytes)[1d:1h]), 1) / 86400",
              "legendFormat": "정지선까지 예상 도달일",
              "refId": "A"
            }
          ],
          "title": "PVC 정지선 예상 도달일 (96 GiB 정지선 기준)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "description": "LVM thin provisioning pool 실사용 대비 할당 비율. 70% 초과 시 신규 쓰기 실패 위험 — 대상: {노드/볼륨그룹명}",
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 60},
                  {"color": "red", "value": 70}
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 14},
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "(node_thinpool_data_used_bytes / node_thinpool_data_total_bytes * 100) or (100 - (node_filesystem_avail_bytes{mountpoint=~\"/|/rootfs\", fstype=~\"xfs|ext4\"} / node_filesystem_size_bytes{mountpoint=~\"/|/rootfs\", fstype=~\"xfs|ext4\"} * 100))",
              "legendFormat": "thin-pool usage %",
              "refId": "A"
            }
          ],
          "title": "Thin-pool 사용률 (Warning >= 60% / Stop >= 70%)",
          "type": "gauge"
