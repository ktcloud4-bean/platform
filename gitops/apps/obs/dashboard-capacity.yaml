apiVersion: v1
kind: ConfigMap
metadata:
  name: obs-04-capacity-sentinel
  namespace: obs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: platform-gitops
data:
  capacity-sentinel.json: |
    {
