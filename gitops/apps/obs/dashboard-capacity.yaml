              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 7},
                  {"color": "green", "value": 14}
                ]
              },
              "unit": "d"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 10},
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
