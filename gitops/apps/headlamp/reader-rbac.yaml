apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: reader-identity
    app.kubernetes.io/part-of: platform-gitops
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-reader
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: reader-identity
    app.kubernetes.io/part-of: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-reader
subjects:
  - kind: ServiceAccount
    name: headlamp-reader
    namespace: headlamp
