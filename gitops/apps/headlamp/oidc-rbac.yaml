apiVersion: v1
kind: Namespace
metadata:
  name: headlamp-rbac-test
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: rbac-test
    app.kubernetes.io/part-of: platform-gitops
---
# 일상 OIDC group의 cluster-wide 읽기와 log 조회만 분리한다. Secret, ConfigMap,
# RBAC, TokenRequest, CSR, webhook, CRD, port-forward와 모든 write는 포함하지 않는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-oidc-user
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-user
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-oidc-user
subjects:
  - kind: Group
    name: oidc:/platform-users
    apiGroup: rbac.authorization.k8s.io
---
# 특권 group은 일상 조회 범위에 Pod exec만 더한다. 상시 namespace 변경은 이
# ClusterRole에 넣지 않아 Argo 소유 workload를 UI에서 수정할 수 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-oidc-privileged
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - nodes
      - pods
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-oidc-privileged
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-oidc-privileged
subjects:
  - kind: Group
    name: oidc:/platform-privileged
    apiGroup: rbac.authorization.k8s.io
---
# 승인된 직접 변경은 disposable namespace의 ConfigMap 하나로 한정한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-oidc-privileged-mutation
  namespace: headlamp-rbac-test
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-oidc-privileged-mutation
  namespace: headlamp-rbac-test
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/component: oidc-rbac
    app.kubernetes.io/part-of: platform-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-oidc-privileged-mutation
subjects:
  - kind: Group
    name: oidc:/platform-privileged
    apiGroup: rbac.authorization.k8s.io
