apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: platform-gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: git-ssh
    app.kubernetes.io/part-of: platform-gitops
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: server
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
      nodePort: 30022
      protocol: TCP
