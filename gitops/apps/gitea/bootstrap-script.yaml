apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-bootstrap
  namespace: gitea
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: platform-gitops
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu
    config=/etc/gitea/app.ini
    gitea migrate --config "${config}"

    if gitea admin user list --admin --config "${config}" \
      | grep -Eq '(^|[[:space:]])scm-recovery([[:space:]]|$)'; then
      echo "SCM-01 bootstrap: local recovery admin present"
    else
      gitea admin user create --config "${config}" \
        --username scm-recovery \
        --password "$(cat /gitea/bootstrap/local-admin-password)" \
        --email scm-recovery@imcherry5778.xyz \
        --admin --must-change-password=false
      echo "SCM-01 bootstrap: local recovery admin created"
    fi
    gitea admin user change-password --config "${config}" \
      --username scm-recovery \
      --password "$(cat /gitea/bootstrap/local-admin-password)" \
      --must-change-password=false
    echo "SCM-01 bootstrap: local recovery password reconciled"

    auth_id=$(gitea admin auth list --vertical-bars --config "${config}" \
      | awk -F '|' '$2 ~ /^[[:space:]]*keycloak[[:space:]]*$/ {
          gsub(/[[:space:]]/, "", $1); print $1
        }')
    if [ -n "${auth_id}" ]; then
      gitea admin auth update-oauth --config "${config}" --id "${auth_id}" \
        --name keycloak --provider openidConnect --key gitea \
        --secret "$(cat /gitea/bootstrap/oidc-client-secret)" \
        --auto-discover-url https://sso.imcherry5778.xyz/realms/platform/.well-known/openid-configuration \
        --scopes openid --scopes profile --scopes email \
        --required-claim-name groups --required-claim-value /platform-users \
        --group-claim-name groups --skip-local-2fa
      echo "SCM-01 bootstrap: Keycloak OAuth source reconciled"
    else
      gitea admin auth add-oauth --config "${config}" \
        --name keycloak --provider openidConnect --key gitea \
        --secret "$(cat /gitea/bootstrap/oidc-client-secret)" \
        --auto-discover-url https://sso.imcherry5778.xyz/realms/platform/.well-known/openid-configuration \
        --scopes openid --scopes profile --scopes email \
        --required-claim-name groups --required-claim-value /platform-users \
        --group-claim-name groups --skip-local-2fa
      echo "SCM-01 bootstrap: Keycloak OAuth source created"
    fi
