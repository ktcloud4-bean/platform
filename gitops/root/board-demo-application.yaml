apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: board-demo
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  project: board-demo
  source:
    repoURL: ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
    targetRevision: main
    path: gitops/apps/board-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: board-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ApplyOutOfSyncOnly=true, PruneLast=true, PrunePropagationPolicy=foreground]
