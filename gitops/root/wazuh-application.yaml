apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wazuh
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # policy-baseline(wave 1)이 Healthy가 된 뒤에 생성한다. Wazuh manager는 UID 0이라
    # `pol-02-wazuh-*` PolicyException이 먼저 있어야 admission을 통과한다.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  project: wazuh
  source:
    repoURL: ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
    targetRevision: b7a36d8d1ad2ed2f71085a593b90d322d6c63ab0
    path: gitops/apps/wazuh
  destination:
    server: https://kubernetes.default.svc
    namespace: wazuh
  # volumeClaimTemplates에는 API server가 apiVersion/kind/status를 채운다. 선언할 수
  # 없는 이 세 항목만 무시하고 `spec.resources.requests.storage`(16 GiB 상한 회계)는
  # 계속 Argo diff 대상으로 둔다.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.status'
        - '.spec.volumeClaimTemplates[]?.apiVersion'
        - '.spec.volumeClaimTemplates[]?.kind'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
