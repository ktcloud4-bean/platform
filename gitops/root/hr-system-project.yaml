apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hr-system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  description: AWS-HR-01 private EKS HR workload and internal ALB boundary
  sourceRepos: [ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git]
  destinations:
    - {namespace: hr-system, name: hr-system-prod}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceWhitelist:
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: networking.k8s.io, kind: NetworkPolicy}
