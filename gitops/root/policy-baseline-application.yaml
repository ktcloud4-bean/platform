apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policy-baseline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  project: policy-baseline
  source:
    repoURL: ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
    # WAZUH-04 merge 전 immutable live 검증 pointer. 최종 main 선언에는 남기지 않는다.
    targetRevision: a1c39909c14dc41fc7577be480d9aa563fb8fde1
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: pomerium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
