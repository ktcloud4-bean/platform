apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: board-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  description: BOARD-DEMO-01 signed internal board application
  sourceRepos: [ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git]
  destinations:
    - {namespace: board-demo, server: https://kubernetes.default.svc}
    - {namespace: kyverno, server: https://kubernetes.default.svc}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: policies.kyverno.io, kind: ImageValidatingPolicy}
  namespaceResourceWhitelist:
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Service}
    - {group: "", kind: ServiceAccount}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
