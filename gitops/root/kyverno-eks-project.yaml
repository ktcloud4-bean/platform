apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kyverno-eks
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  description: SUPPLY-01 Kyverno admission and ImageValidatingPolicy boundary on EKS
  sourceRepos:
    - ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
  destinations:
    - namespace: kyverno
      name: hr-system-prod
    - namespace: kube-system
      name: hr-system-prod
    - namespace: hr-system
      name: hr-system-prod
    - namespace: "*"
      name: hr-system-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: policies.kyverno.io
      kind: ImageValidatingPolicy
    - group: policies.kyverno.io
      kind: PolicyException
    - group: kyverno.io
      kind: PolicyException
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
