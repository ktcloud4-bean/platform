apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  description: VAULT-01 Vault 단일 replica Raft 기준선의 최소 배포 경계
  sourceRepos:
    - ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
  destinations:
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # VAULT-02: Kubernetes auth의 TokenReview 호출 권한만 바인딩한다.
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: StatefulSet
    # VAULT-03: Pomerium을 경유하지 않는 표준 Ingress와 그 자체서명 backend TLS 신뢰 설정.
    - group: networking.k8s.io
      kind: Ingress
    - group: traefik.io
      kind: ServersTransport
    # vault-ingress-ca 하나만 담는다. 값은 VAULT-01이 이미 공개한 leaf 인증서이며
    # private key나 unseal 자료가 아니다.
    - group: ''
      kind: Secret
