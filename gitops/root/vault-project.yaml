apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: vault
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform-gitops
spec:
  description: VAULT-01 Vault 단일 replica Raft 기준선의 최소 배포 경계
  sourceRepos:
    - ssh://git@ssh.github.com:443/ktcloud4-bean/platform.git
  destinations:
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: StatefulSet
