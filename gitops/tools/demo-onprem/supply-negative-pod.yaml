apiVersion: v1
kind: Pod
metadata:
  name: demo-onprem-supply-negative
  namespace: demo-onprem
  labels:
    app.kubernetes.io/name: demo-onprem-supply-proof
spec:
  serviceAccountName: demo-onprem
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: supply-proof
      image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      imagePullPolicy: IfNotPresent
      command: [sleep, "600"]
      resources:
        requests: {cpu: 5m, memory: 12Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
