apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-onprem-transient-lateral-block
  namespace: demo-onprem
  labels:
    demo-onprem.imcherry5778.xyz/transient: "true"
spec:
  podSelector:
    matchLabels:
      demo-onprem.imcherry5778.xyz/role: attacker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
