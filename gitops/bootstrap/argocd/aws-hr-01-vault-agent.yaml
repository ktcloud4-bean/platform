apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-aws-hr-01-vault-agent
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/component: aws-hr-01-secret-consumer
    app.kubernetes.io/part-of: argocd
data:
  runtime.hcl: |
    exit_after_auth = true
    pid_file = "/tmp/vault-agent.pid"

    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      ca_cert = "/vault/tls/vault.crt"
      retry {
        num_retries = 12
      }
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role       = "aws-hr-01-argocd"
          token_path = "/var/run/secrets/vault/token"
        }
      }
    }

    # EKS cluster Secret에는 source access key를 넣지 않는다. argocd-k8s-auth만 이
    # memory volume의 shared credentials file을 읽고 전용 target role을 AssumeRole한다.
    template {
      destination          = "/argocd/aws/credentials"
      perms                = "0400"
      error_on_missing_key = true
      contents             = <<EOT
    {{- with secret "kv/data/aws-hr-01/argocd" -}}
    [default]
    aws_access_key_id = {{ .Data.data.access_key_id }}
    aws_secret_access_key = {{ .Data.data.secret_access_key }}
    {{- end -}}
    EOT
    }
